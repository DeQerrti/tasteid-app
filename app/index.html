<!DOCTYPE html>
<html lang="ru">
<head>
<script>
// Тема из кэша — синхронно, до первой отрисовки. theme.js ниже тоже её
// применяет, но только после fetch("/site-settings.json") — а это сеть,
// пусть и локальная. При быстрой повторной навигации (пара кликов по
// логотипу подряд) окно между первой отрисовкой и ответом сервера иногда
// растягивается настолько, что на долю секунды видна тема по умолчанию
// из :root, прежде чем встанет настоящая. localStorage читается без
// сети, поэтому успевает всегда. Ключ пишет и обновляет applyTheme() в
// theme.js.
(function () {
  try {
    var cached = JSON.parse(localStorage.getItem("tasteid-skin-cache"));
    if (!cached) return;
    if (cached.skin) document.documentElement.setAttribute("data-skin", cached.skin);
    if (cached.declarations) {
      var s = document.createElement("style");
      s.id = "theme-overrides";
      s.textContent = ":root { " + cached.declarations + " }";
      document.head.appendChild(s);
    }
  } catch {}
})();
</script>

<style>
/* ══ NOIR PALETTE ════════════════════════════════ */

/* ══ HEADER ══════════════════════════════════════ */

/* ══ ОБОЛОЧКА: БОКОВАЯ ПАНЕЛЬ ═════════════════════
   Раньше здесь был бренд-хиро на всю ширину (логотип, подзаголовок,
   декоративные точки) и под ним — горизонтальная строка вкладок,
   пришитая к верху. Это работало как первая страница сайта: витрина,
   которую видят один раз. Для окна, которое открывают по многу раз в
   день, это означало заново скроллить мимо одного и того же хиро на
   каждой перезагрузке — и вкладки, актуальные только на десктопе.

   Ниже — тот же приём, что уже работает в settings-edit.html
   (#sidebar): липкая колонка слева, а не строка сверху. Логотип
   переиспользует класс .logo — он же нужен JS-перехвату клика на
   логотипе (см. скрипт в конце файла), поэтому просто переопределяем
   его размер здесь, а не заводим новый класс. */
body { display: flex; }

nav#rail {
  width: 236px; flex: 0 0 auto;
  display: flex; flex-direction: column;
  padding: 18px 14px;
  border-right: 1px solid var(--border);
  background: var(--nav-bg);
  position: sticky; top: 0;
  /* var(--app-titlebar) — только в Electron: chrome.js поднимает верх
     колонки ниже полосы для перетаскивания окна (см. её же комментарий
     про top у nav). В браузере и на телефоне переменная не задана,
     calc() тогда просто вычитает 0. */
  height: calc(100vh - var(--app-titlebar, 0px));
  overflow-y: auto; scrollbar-width: thin;
}

/* Растягивание рельсы мышью — см. js/utils.js, makeResizablePanel().
   Полоска на 3px шире своей видимой части (border-right у самой nav)
   — чтобы попасть курсором было проще, чем в ровно 1px. */
.rail-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 5;
}
.rail-resize:hover, .rail-resize.active { background: var(--red-dim); opacity: .5; }

/* Логотип и подпись под ним — один визуальный блок с одной чертой
   снизу, а не два раздельных (раньше у каждого была своя граница и
   свой отступ, а между ними — отрицательный margin, чтобы стянуть их
   обратно: две линии почти впритык читались как двойная рамка). */
nav#rail .logo {
  font-size: 1.2rem;
  letter-spacing: .02em;
  display: block;
  padding: 4px 6px 2px;
}
.rail-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-dim);
  padding: 0 6px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.rail-tabs { display: flex; flex-direction: column; gap: 2px; }

.tab-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-dim);
  background: none;
  border: none;
  border-radius: 7px;
  text-align: left;
  padding: .6rem .7rem;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
}
.tab-btn:hover { color: var(--text); background: var(--tint-hi); }
.tab-btn.active { color: var(--text-hi); background: var(--tint-hi); }
/* Ромб слева от активной вкладки рисуется, а не берётся символом '◆' из
   шрифта: ни один из самохостящихся файлов Cormorant Garamond не
   содержит этот знак (проверено по cmap), и браузер молча подставлял
   системный запасной шрифт — на Android его ромб рисуется заметно
   крупнее и грубее, чем на компьютере, хотя код был один и тот же.
   Тот же приём — цветной квадрат, повёрнутый на 45° — уже используется
   в .tl-label-dot чуть ниже по файлу: здесь он просто переиспользован,
   чтобы отпечаток не зависел от того, какой шрифт есть у конкретного
   устройства. */
.tab-btn.active::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 1px;
  position: absolute;
  top: 50%; left: -3px;
  transform: translateY(-50%) rotate(45deg);
  background: var(--red);
}

.rail-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

/* См. комментарий у #admin-settings-link в разметке ниже: без этого
   правила класс .hidden у ссылки ничего не делал. */
.hidden { display: none; }

#admin-settings-link {
  display: block;
  font-size: .85rem;
  padding: .5rem .7rem;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 7px;
}
#admin-settings-link:hover { color: var(--text); background: var(--tint-hi); }

/* Телефон. 236px рельсы там съедали бы больше половины ширины — как и
   в settings-edit.html при той же проблеме, но лечится иначе: там
   всего один экран за раз, а тут пять равноценных вкладок, к которым
   возвращаются по многу раз за сессию — им лучше подходит нижняя
   панель, приклеенная к низу экрана, чем прокручиваемая строка сверху
   (тот же паттерн, что в большинстве мобильных приложений). */
@media (max-width: 700px) {
  body { display: block; }

  nav#rail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; height: auto;
    flex-direction: row; align-items: stretch;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    border-right: none; border-top: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 50;
  }
  nav#rail .logo, .rail-sub, .rail-foot { display: none; }
  .rail-resize { display: none; }

  .rail-tabs { flex-direction: row; flex: 1; gap: 0; }
  .tab-btn {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    font-size: .64rem; letter-spacing: .01em;
    padding: .5rem .2rem;
    border-radius: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab-btn.active::before {
    top: 1px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
  }
}

/* Видимая рамка фокуса. Карточка отзыва теперь фокусируема
   (role="button" + tabindex), и без этого правила человек, идущий
   по странице с клавиатуры, не понимал бы, где находится. */
.review-card-wrap:focus-visible,
.tab-btn:focus-visible,
.review-modal-close:focus-visible {
  outline: 2px solid var(--red-hi);
  outline-offset: 2px;
}
/* Мышиный клик по карточке рамку не рисует — только :focus-visible */
.review-card-wrap:focus:not(:focus-visible) { outline: none; }

/* ══ LAYOUT ══════════════════════════════════════ */
main { flex: 1; min-width: 0; max-width: 1800px; margin: 0 auto; padding: 2.5rem 2.5rem 6rem; }
@media (max-width: 700px) {
  main { padding: 1.25rem 1rem calc(5.5rem + env(safe-area-inset-bottom)); }
}
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-hi);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}

.year-divider {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--border2);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.year-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
.year-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ══ GRIDS ═══════════════════════════════════════ */
.grid-now { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .grid-now { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars { display: grid; gap: .85rem; grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 860px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1100px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* ══ CARDS ═══════════════════════════════════════ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: var(--card-border, 1px solid var(--border));
  border-radius: var(--card-radius, 2px);
  overflow: hidden;
  text-decoration: none;
  transition: border-color .25s, transform .25s, box-shadow .25s;
  position: relative;
  box-shadow: var(--card-shadow, none);
}
.card::before {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; top: 0; left: 0;
  width: 12px; height: 12px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card::after {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover, var(--card-shadow, none));
}
.card:hover::before,
.card:hover::after {
  border-color: var(--red);
  width: 16px; height: 16px;
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
  filter: var(--card-img-filter, grayscale(.15) brightness(.9));
  transition: filter .3s;
  flex-shrink: 0;
}
.card:hover img { filter: var(--card-img-filter-hover, grayscale(0) brightness(.98)); }
.card-char img  { aspect-ratio: 1/1; }

.card-body {
  padding: .6rem .7rem .7rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}
.card-meta {
  margin-top: auto;
  padding-top: .3rem;
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
.card-grade-inline {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem;
  font-style: italic;
  font-weight: 600;
}

/* ══ TYPE TAGS ═══════════════════════════════════ */
.type-tag {
  position: absolute; top: 0; right: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .55rem;
  z-index: 3;
  background: var(--badge-bg, var(--poster-scrim));
  backdrop-filter: blur(8px);
  border-radius: var(--radius-btn, 0px) 0 0 var(--radius-btn, 0px);
}
.tag-anime, .tag-manga, .tag-novel, .tag-movie, .tag-show, .tag-manual, .tag-book {
  color: var(--badge-text, var(--text-hi));
  border-bottom: 1px solid var(--badge-border, rgba(240,236,230,.18));
  border-left:   1px solid var(--badge-border, rgba(240,236,230,.18));
}

.watch-badge {
  position: absolute; top: 0; left: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; font-weight: 500;
  color: var(--badge-text-dim, rgba(240,236,230,.7));
  background: var(--badge-bg, var(--poster-scrim));
  border-bottom: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-right: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-radius: 0 var(--radius-btn, 0px) var(--radius-btn, 0px) 0;
  padding: .25rem .52rem;
  backdrop-filter: blur(8px);
  z-index: 3;
  max-width: calc(100% - 64px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.progress-line {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--red-hi);
  font-weight: 500;
}

/* ══ STATE ═══════════════════════════════════════ */
/* Оформление тем переехало в themes.css — там же лежат палитры
   и структурные отличия каждой темы. */


@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══ REVIEWS GRID ════════════════════════════════ */
/* minmax(0, 1fr), а не просто 1fr: колонка по умолчанию не даёт себе стать
   уже min-content своего содержимого, а карточка отзыва с обложкой в 150px
   и текстом внутри как раз шире экрана телефона — из-за этого вся страница
   уезжала вбок примерно на 20px. */
.reviews-grid { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .reviews-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .reviews-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .reviews-grid { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .reviews-grid { grid-template-columns: repeat(7, 1fr); } }

/* ══ REVIEW CARD ═════════════════════════════════
   Постер + минимум подписей — карточка теперь витрина для беглого
   просмотра коллекции, а не мини-статья. Внутри переиспользован .card
   (index.html, у него уже есть постер на всю карточку, оверлеи
   .type-tag/.watch-badge и поддержка всех тем) — та же система, что
   несёт карточки на вкладке «Статусы» (см. cards.js, manualCard).
   Полный текст отзыва по-прежнему открывается по клику — см. модалку
   (.review-modal-*, reviewModalBodyHtml). */
.review-card-wrap { position: relative; height: 100%; }
.review-card-wrap { cursor: pointer; }

.card-grade-row {
  display: flex; align-items: center; gap: .4rem;
  margin-top: .3rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-weight: 600; font-style: italic;
  color: var(--text-hi);
}
/* Тот же приём отрисовки, что у .tab-btn.active::before (index.html) —
   не символ шрифта, а повёрнутый на 45° квадрат, чтобы отпечаток не
   зависел от того, какой шрифт стоит на конкретном устройстве. */
.card-grade-dot {
  width: 6px; height: 6px;
  border-radius: 1px;
  transform: rotate(45deg);
  background: var(--gc);
  flex-shrink: 0;
}

.card-fav {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  color: var(--text-dim);
  margin-top: .25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-fav span { color: var(--text); }

.card-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
.card-tags .rtag { font-size: .6rem; padding: .16rem .45rem; }

/* Нужен только модалке (reviewModalBodyHtml) — в самой карточке
   счётчик пересмотров теперь показан оверлеем .watch-badge. */
.review-rewatch {
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: .25rem .6rem;
  text-align: center;
}

.review-modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 24px;
}
.review-modal-overlay.hidden { display: none; }
.review-modal-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  max-width: 680px;
  width: 100%;
  max-height: 86vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  animation: fadeUp .25s ease both;
}
.review-modal-close {
  position: absolute; top: 16px; right: 16px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  width: 32px; height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: .9rem;
}
.review-modal-close:hover { border-color: var(--red); color: var(--text-hi); }
.review-modal-header {
  display: flex; gap: 1.2rem;
  margin-bottom: 1.4rem;
  padding-right: 40px;
}
.review-modal-cover {
  width: 90px; flex-shrink: 0;
  aspect-ratio: 2/3; object-fit: cover;
  border: 1px solid var(--border2);
  filter: grayscale(.1) brightness(.88);
}
.review-modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 600;
  color: var(--text-hi);
  margin-bottom: .3rem;
}
.review-modal-tags {
  margin: 0 0 1.4rem;
}
.review-modal-tags .rtag {
  font-size: .72rem; padding: .22rem .55rem;
}
.review-modal-fulltext {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 300;
  color: var(--text); line-height: 1.8;
  margin-bottom: 1.4rem;
}
.review-modal-fulltext p { margin: 0 0 1rem; }
.review-modal-fulltext p:last-child { margin-bottom: 0; }
.review-modal-nofull-hint {
  font-family: 'DM Sans', sans-serif !important;
  font-size: .8rem !important;
  color: var(--text-dim) !important;
}

/* ══ TAGS ════════════════════════════════════════ */
.rtag {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .55rem;
  border-radius: 1px;
  font-weight: 400;
  letter-spacing: .03em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
.rtag-visual, .rtag-plot, .rtag-chars, .rtag-special {
  background: var(--tint);
  color: var(--text);
  border: 1px solid var(--tint-line);
}
.rtag-custom {
  background: color-mix(in srgb, var(--tag-color, var(--text-hi)) 12%, transparent);
  color: var(--tag-color, var(--text));
  border: 1px solid color-mix(in srgb, var(--tag-color, var(--text-hi)) 30%, transparent);
}

/* ══ GRADE ═══════════════════════════════════════ */
.grade-chip {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gc); flex: 1;
  cursor: default; position: relative;
  min-width: 80px; white-space: nowrap;
}
/* ══ SOURCE BUTTONS ══════════════════════════════ */
.source-buttons { display: flex; gap: .4rem; flex-shrink: 0; }
.review-source-link {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .75rem; border-radius: 1px;
  flex-shrink: 0; white-space: nowrap;
  text-decoration: none;
  transition: background .2s, color .2s, border-color .2s;
  border: 1px solid;
}
.source-teletype { background: var(--tint); border-color: var(--tint-line); color: var(--text-dim); }
.source-teletype:hover { background: var(--tint-hi); border-color: var(--tint-line-hi); color: var(--text); }
.source-other    { background: var(--accent-wash);  border-color: var(--accent-fill-hi);  color: var(--red); }
.source-other:hover    { background: var(--accent-fill-hi);  border-color: var(--red-hi);   color: var(--red-hi); }

.source-dot-teletype { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
.source-dot-other    { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--red); }

/* ══ EDIT BUTTON ═════════════════════════════════ */
.review-edit-btn {
  position: absolute; top: -10px; right: -10px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-dim); font-size: .85rem;
  display: none; align-items: center; justify-content: center;
  text-decoration: none; transition: all .18s;
}
.review-card-wrap:hover .review-edit-btn { display: flex; }
.review-edit-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--text-hi); }
.review-card-wrap .card { height: 100%; }

/* ══ STATS ═══════════════════════════════════════ */
.stat-section { margin-bottom: 3.5rem; animation: fadeUp .4s ease both; }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.4rem;
}
.stat-grid .stat-card {
  margin-bottom: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.6rem 1.8rem;
  min-width: 0; /* allow children (year-bars-wrap etc.) to shrink inside grid cell */
}
.stat-grid .stat-card.wide { grid-column: 1 / -1; }
@media (max-width: 780px) {
  .stat-grid { grid-template-columns: 1fr; }
}

.stat-total { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 2rem; }
.stat-total-num {
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-style: italic;
  font-size: clamp(3.5rem, 8vw, 6rem);
  color: var(--text-hi); line-height: 1;
}
.stat-total-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem; letter-spacing: .2em;
  text-transform: uppercase; color: var(--text-dim);
}

.stat-counters { display: flex; flex-wrap: wrap; gap: 1px; border: 1px solid var(--border); }
.stat-rewatch-top {
  margin-top: 1.2rem;
  padding: .9rem 1.1rem;
  background: var(--tint);
  border: 1px solid var(--tint-line);
  border-radius: 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text-dim);
}
.stat-rewatch-top b {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 600;
  color: var(--text-hi);
}
.stat-counter {
  flex: 1; min-width: 80px; padding: 1rem 1.2rem;
  background: var(--surface); text-align: center;
  border-right: 1px solid var(--border);
}
.stat-counter:last-child { border-right: none; }
.stat-counter-val {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 900; color: var(--text-hi); line-height: 1;
}
.stat-counter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim); margin-top: .35rem;
}

.stat-donut-wrap { display: flex; align-items: center; gap: 3rem; flex-wrap: wrap; }
.stat-donut-svg { width: 200px; height: 200px; flex-shrink: 0; }
.donut-center-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; fill: var(--text-hi); }
.donut-center-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; fill: var(--text-dim); }
.donut-legend { display: flex; flex-direction: column; gap: .65rem; }
.donut-legend-item { display: flex; align-items: center; gap: .6rem; font-family: 'DM Sans', sans-serif; font-size: .8rem; }
.donut-dot { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); flex-shrink: 0; }
.donut-legend-label { color: var(--text); flex: 1; }
.donut-legend-val   { color: var(--text-hi); font-weight: 500; min-width: 24px; text-align: right; }
.donut-legend-pct   { color: var(--text-dim); min-width: 36px; text-align: right; }

.year-bars-wrap {
  display: flex; align-items: flex-end; gap: 6px;
  overflow-x: auto; padding-bottom: .5rem;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
  min-height: 180px;
}
.year-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.year-bar-track {
  width: 32px; height: 140px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
}
.year-bar-stack {
  width: 100%;
  border-radius: 1px 1px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  min-height: 2px;
}
.year-bar-seg { width: 100%; min-height: 1px; }
.year-bar-val   { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); line-height: 1; }
.year-bar-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .05em; }

.grade-bars { display: flex; flex-direction: column; gap: .75rem; }
.grade-row  { display: flex; align-items: center; gap: 1rem; }
.grade-row-label { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; font-style: italic; min-width: 140px; text-align: right; flex-shrink: 0; }
.grade-row-track { flex: 1; height: 6px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
.grade-row-bar   { height: 100%; width: 0%; }
.grade-row-val   { font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--text-dim); min-width: 20px; text-align: right; }

.stat-tag-cloud { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.stat-tag { transition: opacity .2s, transform .2s; cursor: default; }
.stat-tag:hover { opacity: .8; transform: translateY(-1px); }
.stat-tag-cnt { font-size: .65em; opacity: .6; margin-left: .2em; }

/* ── Дайджест года ── */
.stat-year-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 2.5rem; }

.year-spotlight-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: flex-start; }
.year-spotlight-item { width: 160px; }
.year-spotlight-item .card {
  box-shadow: 0 0 0 1px var(--red-dim), 0 0 28px var(--accent-fill-hi);
}

.stat-export-row { margin-top: -1.5rem; margin-bottom: 3.5rem; }


/* ══ TIERLIST ════════════════════════════════════ */
.tl-filters {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.8rem;
}
.tl-year-select-wrap { margin: -1.2rem 0 1.8rem; }
.tl-year-select {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  letter-spacing: .03em;
  padding: .4rem .7rem;
  border-radius: 4px;
  cursor: pointer;
}
.tl-year-select:hover { border-color: var(--red); }
.tl-filter {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .4rem .9rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-filter:hover { color: var(--text); border-color: var(--border2); }
.tl-filter.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }

.tl-rows { display: flex; flex-direction: column; gap: .7rem; }

.tl-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: visible;
  animation: fadeUp .35s ease both;
  position: relative;
}
.tl-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--tl-color, var(--red-dim));
  opacity: .6;
}

.tl-label {
  width: 120px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem .7rem;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--tl-color, #888) 8%, var(--surface));
  position: relative;
  overflow: hidden;
  gap: .3rem;

}

.tl-label-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: .92rem;
  color: var(--tl-color, var(--text-hi));
  text-align: center;
  line-height: 1.2;
  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;
}
.tl-label-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  letter-spacing: .1em;
  color: var(--text-dim);
}

.tl-cards {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding: .7rem;
  background: var(--surface);
  min-height: 72px;
  align-content: flex-start;
}

.tl-empty {
  display: flex;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: .9rem;
  font-style: italic;
  color: var(--text-dim);
  padding: .5rem;
}

/* ── Постер в тир-листе ── */
.tl-poster {
  width: 100px;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s, z-index 0s;
  animation: fadeUp .25s ease both;
}
.tl-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-poster:hover::before { opacity: 1; width: 13px; height: 13px; }

.tl-poster img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: grayscale(.2) brightness(.82);
  transition: filter .25s;
}
.tl-poster:hover img { filter: grayscale(0) brightness(.98); }

/* ── Тултип тир-листа — расширен и текст переносится ── */
.tl-tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .85rem 1.05rem;
  pointer-events: none;
  z-index: 9999;
  max-width: 260px;
  min-width: 160px;
  width: max-content;
  box-shadow: 0 12px 40px var(--shadow);
  opacity: 0;
  transition: opacity .12s;
}
.tl-tooltip.visible { opacity: 1; }
.tl-tt-title {
  font-family: 'Playfair Display', serif;
  font-size: .92rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.3;
  margin-bottom: .28rem;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
}
.tl-tt-grade {
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-style: italic; font-weight: 600;
  margin-bottom: .2rem;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem; color: var(--text-dim);
  font-style: italic; line-height: 1.5;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-meta {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; color: var(--text-dim);
  margin-top: .28rem; letter-spacing: .04em;
  white-space: normal;
  overflow-wrap: break-word;
}

/* ══ MOBILE TIERLIST — ИСПРАВЛЕНО ════════════════ */
@media (max-width: 600px) {
  .tl-label {
    width: 68px;
    padding: .6rem .35rem;
  }
  .tl-label-name { font-size: .72rem; }
  .tl-label-count { font-size: .5rem; }

  .tl-poster { width: 70px; }

  .tl-cards {
    gap: .35rem;
    padding: .5rem .45rem;
    min-height: 60px;
  }

  .tl-tooltip {
    max-width: calc(100vw - 24px);
    min-width: 160px;
  }

  .tl-filter {
    font-size: .58rem;
    padding: .32rem .7rem;
  }

  /* На телефоне 2.5rem полей с каждой стороны съедали пятую часть экрана,
     а обложка в 150px оставляла тексту отзыва колонку в два слова. */
  main { padding-left: 1.1rem; padding-right: 1.1rem; }
  .review-top { gap: .8rem; padding: .9rem; }
  .review-cover-col { width: 108px; }
}

/* ══ REVIEW FILTERS ══════════════════════════════ */
.rv-filter-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem;
}
.rv-filter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 70px;
  flex-shrink: 0;
}
.rv-filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .65rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .03em;
}
.rv-filter-btn:hover { color: var(--text); border-color: var(--border2); }
.rv-filter-btn.active {
  background: var(--accent-fill);
  border-color: var(--red);
  color: var(--text-hi);
}
.rv-search-input {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  padding: .28rem .75rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-hi);
  outline: none;
  width: 180px;
  transition: border-color .2s, background .2s;
  letter-spacing: .02em;
}
.rv-search-input:focus {
  border-color: var(--red);
  background: var(--bg2);
}
.rv-search-input::placeholder {
  color: var(--text-dim);
}
/* ══ ADMIN ADD BUTTON ════════════════════════════ */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}
.section-header .section-title {
  margin-bottom: 0;
  flex: 1;
}
.admin-add-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .3rem .75rem;
  text-decoration: none;
  transition: all .18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.admin-add-btn:hover {
  border-color: var(--red-dim);
  color: var(--red-hi);
}

/* ══ REVIEW TOOLBAR ══════════════════════════════ */
.rv-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.rv-filters {
  display: inline-flex;
  flex-direction: column;
  gap: .75rem;
  padding: 1.1rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
}
  /* ══ TIERLIST MODE TOGGLE ════════════════════════ */
.tl-mode-toggle {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.8rem;
}
.tl-mode-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .55rem 1.4rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-mode-btn:hover { color: var(--text); border-color: var(--border2); }
.tl-mode-btn.active {
  color: var(--text-hi);
  border-color: var(--red);
  background: var(--surface2);
}
.tl-mode-add-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: 0 1rem;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-mode-add-btn:hover { color: var(--red-hi); border-color: var(--red-dim); }

/* ══ МОДАЛКА: новый тир-лист (коллекция) ═════════ */
.modal-overlay.hidden { display: none; }
.modal-close:hover { color: var(--text-hi); }
.modal .field { margin-bottom: 1rem; }
.modal .field label {
  font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .4rem;
}
.modal .field input[type="text"] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px;
  padding: .65rem .85rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; outline: none; transition: border-color .2s, background .2s;
}
.modal .field input[type="text"]:focus { border-color: var(--red); background: var(--bg2); }
.modal .btn-save {
  width: 100%; background: var(--accent-fill); border: 1px solid var(--accent-line);
  border-radius: 2px; color: var(--text-hi); font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700; font-style: italic; letter-spacing: .06em;
  padding: .8rem; cursor: pointer; transition: background .2s, border-color .2s;
}
.modal .btn-save:hover { background: var(--accent-fill-hi); border-color: var(--red); }
.modal .btn-save:disabled { opacity: .4; cursor: not-allowed; }
.modal .status-msg {
  font-family: 'DM Sans', sans-serif; font-size: .78rem; text-align: center;
  margin-top: .85rem; min-height: 1.2rem; letter-spacing: .03em;
}
.modal .status-msg.ok  { color: var(--green-hi); }
.modal .status-msg.err { color: var(--err); }

/* ── Переключатель тир-листов внутри игры ── */
.tl-char-lists {
  display: flex;
  gap: .4rem;
  margin-bottom: 1.4rem;
  flex-wrap: wrap;
}
.tl-list-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 1px;
  padding: .3rem .85rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-list-btn:hover { color: var(--text); border-color: var(--border2); }
.tl-list-btn.active {
  color: var(--text-hi);
  border-color: var(--red-dim);
  background: var(--surface2);
}

/* Постеры персонажей — квадратные (1/1 вместо 2/3) */
.tl-poster img.char-img {
  aspect-ratio: 1/1;
}
  /* ══ ПОСТЕРЫ ПЕРСОНАЖЕЙ В ТИР-ЛИСТЕ ════════════ */
.tl-char-poster {
  width: auto;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s;
  animation: fadeUp .25s ease both;
  /* Фон совпадает с фоном ряда — убирает "чёрные блоки" вокруг прозрачных PNG */
  background: var(--surface);
}
.tl-char-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-char-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-char-poster:hover::before { opacity: 1; width: 13px; height: 13px; }
.tl-char-poster img {
  height: 100%;
  width: auto;
  max-width: 100%;
  display: block;
  filter: grayscale(.15) brightness(.85);
  transition: filter .25s;
  background: var(--surface);
}
.tl-char-poster:hover img { filter: grayscale(0) brightness(.98); }
</style>
</head>
<body>

<nav id="rail" aria-label="Боковая панель">
  <a href="/" class="logo">TasteID</a>
  <div class="rail-sub" data-label="site.subtitle">Цифровой паспорт интересов</div>
  <div class="rail-tabs" role="tablist" aria-label="Разделы">
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-now" data-label="nav.now" onclick="switchTab('tab-now', this)">Статусы</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-favorites" data-label="nav.favorites" onclick="switchTab('tab-favorites', this)">Любимое</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-reviews" data-label="nav.reviews" onclick="switchTab('tab-reviews', this)">Отзывы</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-stats" data-label="nav.stats" onclick="switchTab('tab-stats', this)">Статистика</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-tierlist" data-label="nav.tierlist" onclick="switchTab('tab-tierlist', this)">Тир-лист</button>
  </div>
  <div class="rail-foot">
    <a href="/settings-edit.html" id="admin-settings-link" class="hidden admin-link" data-i18n>Настройки</a>
  </div>
  <div class="rail-resize" id="rail-resize" aria-hidden="true"></div>
</nav>

<script>
  // .hidden у ссылки настроек — обычный CSS-класс, а не HTML-атрибут
  // hidden, и на этой странице ни разу не был описан отдельным
  // правилом (в отличие от backup-history.html и settings-edit.html,
  // где .hidden{display:none} есть). Ссылка была видна всем, а не
  // только владельцу — простое дополнение, раз уж элемент и так
  // переносится в боковую панель.
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof isAdmin === "function" && isAdmin()) {
      document.getElementById("admin-settings-link").classList.remove("hidden");
    }
  });
</script>

<main>
  <div id="tab-now" role="tabpanel" tabindex="0"       class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем…</div></div>
  <div id="tab-favorites" role="tabpanel" tabindex="0" class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем любимчиков…</div></div>
  <div id="tab-reviews" role="tabpanel" tabindex="0"   class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем отзывы…</div></div>

  <div id="review-modal-overlay" class="review-modal-overlay hidden">
    <div class="review-modal-panel" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
      <button class="review-modal-close" title="Закрыть" aria-label="Закрыть">✕</button>
      <div id="review-modal-body"></div>
    </div>
  </div>
  <div id="tab-stats" role="tabpanel" tabindex="0"     class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Считаем…</div></div>
  <div id="tab-tierlist" role="tabpanel" tabindex="0"  class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем рецензии…</div></div>
</main>

<!-- Модалка: новый тир-лист (коллекция) — доступна только админу -->
<div class="modal-overlay hidden" id="collection-modal-overlay" onclick="closeCollectionModalOnOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeCollectionModal()">✕</button>
    <div class="modal-title" data-i18n>Новый тир-лист</div>
    <div class="field">
      <label data-i18n>Название</label>
      <input type="text" id="cm-collection-name" placeholder="Например: Опенинги" data-i18n-placeholder="Например: Опенинги">
    </div>
    <button class="btn-save" id="cm-collection-save" onclick="submitNewCollection()" data-i18n>Создать</button>
    <div class="status-msg" id="collection-modal-status"></div>
  </div>
</div>

<!-- Модалка: список горячих клавиш, вызывается «?» — тот же список,
     что и справочная панель в настройках (js/utils.js: keyboardShortcutsHtml) -->
<div class="modal-overlay hidden" id="shortcuts-modal-overlay" onclick="closeShortcutsModalOnOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeShortcutsModal()">✕</button>
    <div class="modal-title" data-i18n>Горячие клавиши</div>
    <div id="shortcuts-modal-list"></div>
  </div>
</div>

<script src="/js/config.js?v=14"></script>
<script src="/js/api.js?v=12"></script>
<script src="/js/cards.js?v=13"></script>
<script src="/js/now.js?v=12"></script>
<script src="/js/favorites.js?v=12"></script>
<script src="/js/reviews.js?v=16"></script>
<script src="/js/stats.js?v=14"></script>
<script src="/js/tierlist.js?v=13"></script>

<script>
let _navInit = true;

function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => {
    el.classList.remove("active");
    el.setAttribute("aria-selected", "false");
  });
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  btn.setAttribute("aria-selected", "true");

  if (!_navInit) {
    btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
  if (tabId === "tab-stats")     loadStats();
  if (tabId === "tab-tierlist")  loadTierlist();
}

// ── Горячие клавиши ─────────────────────────────
// 1–5 переключают вкладки рельсы, / открывает поиск в «Отзывах», N —
// новый отзыв (только у админа), ? — эта же подсказка списком. Список
// показываемых сочетаний — общий с панелью в настройках, см.
// js/utils.js: keyboardShortcutsList/Html.
function openShortcutsModal() {
  document.getElementById("shortcuts-modal-list").innerHTML = keyboardShortcutsHtml();
  document.getElementById("shortcuts-modal-overlay").classList.remove("hidden");
}
function closeShortcutsModal() {
  document.getElementById("shortcuts-modal-overlay").classList.add("hidden");
}
function closeShortcutsModalOnOverlay(e) {
  if (e.target === document.getElementById("shortcuts-modal-overlay")) closeShortcutsModal();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeShortcutsModal(); return; }

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (document.querySelector(".modal-overlay:not(.hidden), .review-modal-overlay:not(.hidden)")) return;

  if (e.key >= "1" && e.key <= "5") {
    const idx = Number(e.key) - 1;
    const btn = document.querySelectorAll(".rail-tabs .tab-btn")[idx];
    const tabId = ["tab-now", "tab-favorites", "tab-reviews", "tab-stats", "tab-tierlist"][idx];
    if (btn) { e.preventDefault(); switchTab(tabId, btn); }
  } else if (e.key === "/") {
    e.preventDefault();
    const btn = document.querySelector('.tab-btn[aria-controls="tab-reviews"]');
    switchTab("tab-reviews", btn);
    setTimeout(() => document.getElementById("rv-search")?.focus(), 50);
  } else if (e.key === "n" && typeof isAdmin === "function" && isAdmin()) {
    e.preventDefault();
    location.href = "/add.html";
  } else if (e.key === "?") {
    e.preventDefault();
    openShortcutsModal();
  }
});

// Первую вкладку открываем только после того, как применились настройки
// сайта: до этого неизвестны ни стартовая вкладка (mainTab), ни порядок,
// ни какие вкладки скрыты. Раньше клик стоял здесь же синхронно — вкладка
// успевала отрисоваться со встроенными настройками и через миг
// перерисовывалась поверх, а mainTab не работал вовсе.
// Обёртка Promise.resolve обязательна. window.themeReady приходит из
// theme.js, и если браузер по какой-то причине отдаст старую копию
// этого файла (кэш, сбой загрузки), themeReady окажется undefined —
// без обёртки здесь падал бы весь блок, и страница навсегда осталась
// бы на надписи «Загружаем…». Теперь в худшем случае просто откроется
// первая доступная вкладка.
Promise.resolve(window.themeReady).then(() => {
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");

  if (btn) btn.click();
  _navInit = false;
});

// Клик по логотипу на самой же главной — это переход "/" -> "/", то
// есть по сути просто "вернуться на стартовую вкладку и наверх". Без
// перехвата это была бы настоящая перезагрузка: страница поднимается
// заново с нуля, снова ждёт настройки сайта, снова открывает стартовую
// вкладку, а та заново запрашивает свои данные и на время запроса
// показывает спиннер вместо контента — резкая смена высоты между
// спиннером и заполненной вкладкой и читается как рывок интерфейса.
// Обычно перезагрузка укладывается в один кадр и не видна, но при
// быстрых повторных кликах эти циклы наслаиваются друг на друга.
// Тут же вкладка и так уже открыта и её данные уже загружены — так что
// вместо повторного похода на сервер просто возвращаемся к стартовой
// вкладке и скроллу локально, без единого лишнего запроса.
document.querySelector(".logo")?.addEventListener("click", (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  window.scrollTo({ top: 0, behavior: "smooth" });
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");
  btn?.click();
});

makeResizablePanel(
  document.getElementById("rail"),
  document.getElementById("rail-resize"),
  "tasteid-rail-width", 200, 420
);

// Service worker: без него установленное из manifest.json приложение
// при плохой сети показывало пустой экран. Регистрируем после load,
// чтобы не отнимать канал у первой отрисовки. Не поддерживается или
// не установился — сайт просто работает как раньше, без офлайна.
//
// В приложении он не просто бесполезен (сервер локальный, «плохой
// сети» не бывает), а вреден: порт при каждом запуске новый, значит и
// источник (origin) для service worker'а новый — и на диске копится
// Cache Storage от происхождений, куда приложение больше никогда не
// зайдёт и которые никому не почистить.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    if (await isAppContext()) return;
    navigator.serviceWorker
      .register("/sw.js")
      .catch((err) => console.warn(i18n("[sw] не зарегистрировался:"), err));
  });
}
</script>

</body>
</html>
