  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%;
  background: var(--surface2); color: var(--text-dim);
  cursor: pointer;
}
:where(.set-view) .pp-add-modal-close:hover { color: var(--text); background: var(--tint-hi); }
:where(.set-view) .pp-add-modal-frame {
  width: 100%; height: 100%;
  border: none; border-radius: 4px;
}
@media (max-width: 720px) {
  :where(.set-view) .pp-add-modal-overlay { padding: 0; }
  /* height: 100vh – запасной вариант для браузеров без dvh (см. ниже);
     100dvh – «динамический» vh, который пересчитывается вместе с
     панелью адреса телефона. Обычный vh на телефоне считается по
     максимальной высоте экрана (когда панель адреса скрыта), а
     модалка на весь экран открывается ДО того, как она успевает
     спрятаться – нижний край панели в этот момент оказывается под
     ней, обрезанным. dvh пересчитывает высоту по актуальному
     состоянию панели адреса, а не по максимуму. */
  :where(.set-view) .pp-add-modal-panel { max-width: none; height: 100vh; height: 100dvh; border-radius: 0; }
  :where(.set-view) .pp-add-modal-frame { border-radius: 0; }
}

:where(.set-view) .list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
:where(.set-view) .list-row .name { flex: 1; font-size: .88rem; }
:where(.set-view) .list-row .tag-note { color: var(--text-dim); font-size: .78rem; }
:where(.set-view) .vault-current { color: var(--text-dim); font-size: .78rem; white-space: nowrap; }

:where(.set-view) .app-path { font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text-dim);
  word-break: break-all; border: 1px dashed var(--border2); border-radius: 4px; padding: 9px 12px; }
:where(.set-view) .app-zoom { font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text-hi);
  min-width: 4rem; text-align: center; }

/* Ползунок масштаба – тот же минимализм, что у остальных полей:
   тонкий трек, квадратный бегунок без родных стрелок браузера. */
:where(.set-view) .app-zoom-slider {
  -webkit-appearance: none; appearance: none;
  width: 200px; max-width: 100%; height: 3px;
  background: var(--border2); border-radius: 2px; outline: none;
}
:where(.set-view) .app-zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 2px;
  background: var(--red); cursor: pointer;
}
:where(.set-view) .app-zoom-slider::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 2px; border: none;
  background: var(--red); cursor: pointer;
}

:where(.set-view) .fav-restore { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-top: 10px; font-size: .78rem; color: var(--text-dim); }
:where(.set-view) .fav-restore-btn { background: none; border: 1px dashed var(--border2); color: var(--text-dim);
  border-radius: 4px; padding: 3px 9px; font-size: .78rem; cursor: pointer; font-family: inherit; }
:where(.set-view) .fav-restore-btn:hover { color: var(--text-hi); border-color: var(--text-dim); }

:where(.set-view) .tab-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  transition: opacity .15s, border-color .15s;
}
:where(.set-view) .tab-row input[type="checkbox"] { width: auto; margin: 0; }
:where(.set-view) .tab-row .tab-name { flex: 1; font-size: .9rem; }
:where(.set-view) .tab-row input[type="text"] { flex: 1; display: none; }
:where(.set-view) .tab-row.editing .tab-name { display: none; }
:where(.set-view) .tab-row.editing input[type="text"] { display: block; }
:where(.set-view) .tab-row .drag-handle {
  flex: none; cursor: grab; color: var(--text-dim); font-size: .95rem;
  line-height: 1; padding: 2px 4px; user-select: none;
}
:where(.set-view) .tab-row .drag-handle:active { cursor: grabbing; }
:where(.set-view) .tab-row.dragging { opacity: .4; }
:where(.set-view) .tab-row.drag-over { border-color: var(--red); box-shadow: 0 -1px 0 var(--red); }
:where(.set-view) .tab-row .main-radio-label {
  display: flex; align-items: center; gap: 5px; flex: none;
  font-size: .72rem; color: var(--text-dim); cursor: pointer; white-space: nowrap;
}
:where(.set-view) .tab-row .main-radio-label input { width: auto; margin: 0; }

/* Телефон. В строке вкладки шесть вещей подряд: ручка перетаскивания,
   глаз, имя, карандаш и подпись «Главная страница» с точкой. Глаз и
   карандаш под пальцем становятся по 44px (см. style.css), «Главная
   страница» не переносится (white-space: nowrap) и ужаться не может
   (flex: none) – в 390px это не влезало, строка вылезала за экран, и
   вместе с ней уезжала вбок вся страница настроек.
   Пускаем подпись на вторую строку: места по ширине она больше не
   просит, а сама радиокнопка (13px, растягивать её нельзя – станет
   не похожа на радиокнопку) получает нормальную цель для пальца за
   счёт отступов у своей подписи. */
@media (pointer: coarse) {

<script>
  // .hidden у ссылки настроек – обычный CSS-класс, а не HTML-атрибут
  // hidden, и на этой странице ни разу не был описан отдельным
  // правилом (в отличие от удалённых теперь backup-history.html и
  // settings-edit.html, где .hidden{display:none} был свой на
  // страницу). Ссылка была видна всем, а не
  // только владельцу – простое дополнение, раз уж элемент и так
  // переносится в боковую панель.
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof isAdmin === "function" && isAdmin()) {
      document.getElementById("admin-settings-link").classList.remove("hidden");
    }
  });

  // ── Вид панели: развёрнута / только иконки / прятать ──
  // Кнопка в углу рельсы открывает меню из трёх видов (раньше она умела
  // только «свернуть целиком / развернуть»). Вид запоминается в
  // localStorage; прежний ключ tasteid-rail-collapsed ("1" = свёрнута)
  // переносится как «прятать», чтобы у тех, кто панель уже прятал, она
  // и после обновления осталась спрятанной.
  //
  // «Прятать» – прежнее поведение: рельса лежит за левым краем окна
  // (transform в CSS) и выезжает поверх, стоит навести курсор на
  // полоску-ловушку или на саму рельсу; убираем курсор – прячется
  // обратно с небольшой задержкой, чтобы случайный перелёт мимо края
  // не дёргал её туда-сюда.
  (function initRailMode() {
    const STORAGE_KEY = "tasteid-rail-mode";
    const OLD_KEY = "tasteid-rail-collapsed";
    const MODES = ["full", "icons", "hidden"];
    const rail = document.getElementById("rail");
    const btn = document.getElementById("rail-collapse-btn");
    const edge = document.getElementById("rail-edge-trigger");
    if (!rail || !btn || !edge) return;
    const t = (s) => (typeof i18n === "function" ? i18n(s) : s);

    let hideTimer = null;
    const peek = () => {
      clearTimeout(hideTimer);
      rail.classList.add("rail-peek");
    };
    const unpeek = () => {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => rail.classList.remove("rail-peek"), 250);
    };

    const menu = document.createElement("div");
    menu.className = "rail-mode-menu hidden";
    menu.setAttribute("role", "menu");
    menu.innerHTML =
      `<div class="rail-mode-menu-title">${t("Вид панели")}</div>` +
      [
        ["full", t("Развёрнута"), t("Иконки и подписи разделов")],
        ["icons", t("Только иконки"), t("Узкая полоса, подсказки при наведении")],
        ["hidden", t("Прятать"), t("Выезжает при наведении на край, как панель задач")],
      ]
        .map(
          ([mode, name, desc]) =>
            `<button type="button" class="rail-mode-option" role="menuitemradio" data-mode="${mode}" aria-checked="false">` +
            `<span class="rail-mode-radio"></span><span class="rail-mode-name">${name}</span><span class="rail-mode-desc">${desc}</span></button>`
        )
        .join("");
    document.body.appendChild(menu);

    // Подсказки к иконкам в узком виде – подпись раздела, которой там
    // не видно. Ставим всегда: в развёрнутом виде title совпадает с
    // подписью и ничему не мешает.
    rail.querySelectorAll(".tab-btn, #admin-settings-link").forEach((el) => {
      const label = el.querySelector(".tab-label, .admin-link-label");
      if (label && !el.title) el.title = label.textContent.trim();
    });

    let mode = "full";
    const setMode = (next) => {
      mode = MODES.includes(next) ? next : "full";
      document.body.classList.toggle("rail-collapsed", mode === "hidden");
      document.body.classList.toggle("rail-icons", mode === "icons");
      if (mode !== "hidden") rail.classList.remove("rail-peek");
      menu.querySelectorAll(".rail-mode-option").forEach((o) => {
        o.setAttribute("aria-checked", String(o.dataset.mode === mode));
      });
      try { localStorage.setItem(STORAGE_KEY, mode); } catch {}
    };

    const closeMenu = () => {
      if (menu.classList.contains("hidden")) return;
      menu.classList.add("hidden");
      btn.setAttribute("aria-expanded", "false");
      if (mode === "hidden") unpeek();
    };
    const openMenu = () => {
      const r = btn.getBoundingClientRect();
      menu.classList.remove("hidden");
      const w = menu.offsetWidth;
      const h = menu.offsetHeight;
      menu.style.left = Math.max(8, Math.min(r.right + 8, innerWidth - w - 8)) + "px";
      menu.style.top = Math.max(8, Math.min(r.top, innerHeight - h - 8)) + "px";
      btn.setAttribute("aria-expanded", "true");
      if (mode === "hidden") peek();
      menu.querySelector('[aria-checked="true"]')?.focus();
    };

    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (menu.classList.contains("hidden")) openMenu();
      else closeMenu();
    });
    menu.addEventListener("click", (e) => {
      const opt = e.target.closest(".rail-mode-option");
      if (!opt) return;
      setMode(opt.dataset.mode);
      closeMenu();
    });
    menu.addEventListener("mouseenter", () => mode === "hidden" && peek());
    document.addEventListener("click", (e) => {
      if (!menu.contains(e.target) && e.target !== btn) closeMenu();
    });
    window.addEventListener("resize", closeMenu);

    edge.addEventListener("mouseenter", peek);
    edge.addEventListener("mouseleave", unpeek);
    rail.addEventListener("mouseenter", peek);
    rail.addEventListener("mouseleave", () => {
      if (menu.classList.contains("hidden")) unpeek();
    });

    // Escape: открыто меню – закрывает его. Иначе в виде «прятать» – тот
    // же Windows-приём, что и полоска-ловушка (мышью в край или клавишей):
    // у Escape нет mouseleave, поэтому выехавшую так рельсу прячем сами по
    // таймеру; повторный Escape прячет сразу.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!menu.classList.contains("hidden")) {
        closeMenu();
        btn.focus();
        return;
      }
      if (mode !== "hidden") return;
      if (rail.classList.contains("rail-peek")) {
        unpeek();
      } else {
        peek();
        hideTimer = setTimeout(() => rail.classList.remove("rail-peek"), 3000);
      }
    });

    let saved = null;
    try {
      saved = localStorage.getItem(STORAGE_KEY);
      if (!saved && localStorage.getItem(OLD_KEY) === "1") saved = "hidden";
    } catch {}
    setMode(saved || "full");
  })();
</script>

// LAST_TAB_KEY – из js/theme.js (он загружается заведомо раньше, прямо
// в <head>): общая константа, а не общий localStorage-ключ-дубль,
// иначе рано или поздно они бы разъехались, как только кто-то поправил
// бы один и забыл про второй.
function switchTab(tabId, btn) {
  try {
    localStorage.setItem(LAST_TAB_KEY, tabId.replace(/^tab-/, ""));
  } catch {
    // Приватный режим и подобное – не страшно, просто не запомнится.
  }
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => {
    el.classList.remove("active");
    el.setAttribute("aria-selected", "false");
  });
  const shownTab = document.getElementById(tabId);
  shownTab.classList.remove("hidden");
  btn.classList.add("active");
  btn.setAttribute("aria-selected", "true");

  // На телефоне спрятанная вкладка (.hidden – display:none) не удаляется
  // из DOM (см. комментарий чуть ниже – "уже отрисованное никуда не
  // девается"), но сам WebView под память вправе выбросить уже
  // декодированные битмапы её картинок, пока она невидима (тот же приём,
  // из-за которого раньше переписали capacitor:// на blob-URL – см. её
  // же комментарий у resolveImage() в mobile/src/main.js). Обложка при
  // этом на вид "грузится с нуля" при возврате на вкладку, хотя байты
  // уже лежат в srcCache и по мосту заново не ходили – браузеру просто
  // нужно время передекодировать их заново. window.__mobileForceResolveImages
  // (тот же приём, что уже использует снимок тир-листа/статистики) не
  // ждёт, пока браузер сам спохватится это сделать при показе картинки,
  // а передекодирует сразу же, как только вкладка становится видимой –
  // так к моменту, когда человек её увидит, декодирование уже почти
  // наверняка успело закончиться. На компьютере такой функции нет вовсе –
  // вызов просто не найдёт её.
  if (typeof window.__mobileForceResolveImages === "function") {
    const imgs = Array.from(shownTab.querySelectorAll("img"));
    if (imgs.length) window.__mobileForceResolveImages(imgs);
  }
  // Иначе клавиатурный фокус остаётся на кнопке, кликнутой мышью раньше
  // (переключение по 1–5 её не трогает), и следующее нажатие клавиши
  // рисует рамку :focus-visible вокруг неё, а не вокруг активной вкладки.
  if (document.activeElement !== btn) btn.focus({ preventScroll: true });

  if (!_navInit) {
    btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  // Сама вкладка переключается визуально мгновенно (.hidden выше) – а
  // вот loadX() внизу каждый раз заново читает reviews.json, и на
  // телефоне это идёт через нативный мост Capacitor, а не мгновенный
  // локальный fetch, как на компьютере. Быстрое перелистывание нескольких
  // вкладок подряд раньше заводило для КАЖДОЙ из них свой такой запрос
  // разом – та же самая перегрузка моста параллельными обращениями,
  // от которой уже избавлялись для картинок (imgObserver/rootMargin,
  // __mobileForceResolveImages пачками – см. её же историю в этой
  // сессии), только здесь для самого чтения данных, а не картинок.
  // Откладываем сам вызов на короткое время и отменяем предыдущий –
  // так при перелистывании нескольких вкладок подряд запрос уходит
  // только для той, на которой человек в итоге остановился. Уже
  // отрисованное на вкладке при этом никуда не девается ни на миг –
  // .hidden выше её не трогает, обновление тихо подхватится, если
  // данные и правда успели измениться.
  clearTimeout(_tabLoadTimer);
  _tabLoadTimer = setTimeout(() => {
    if (tabId === "tab-now")       loadNow();
    if (tabId === "tab-favorites") loadFavorites();
    if (tabId === "tab-reviews")   loadReviews();
    if (tabId === "tab-stats")     loadStats();
    if (tabId === "tab-tierlist")  loadTierlist();
  }, 150);
}

// Строка вкладок раздела прилипает к верху при прокрутке (см. её же
// комментарий у .tl-mode-toggle в CSS выше). Без этого обработчика
// переключение вкладки из середины списка оставляло прокрутку на месте:
// новый список открывался тоже с середины, и его начало приходилось
// искать листанием вверх – ровно то, от чего прилипание и избавляет.
// Прокрутку возвращаем в начало, только если строка действительно
// прилипла (раздел уехал выше края окна); у самого верха страница не
// дёргается. Перехват на фазе capture: проверяем положение до того, как
// обработчик раздела перерисует содержимое (Статистика делает это сразу
// же, синхронно). Сама прокрутка – через два кадра: «Статусы»
// перерисовываются в requestAnimationFrame (см. bindNowModeToggle).
const STICKY_TABS_BAR =
  "#tab-now > .tl-mode-toggle, #tab-tierlist > .tl-mode-toggle, #tab-favorites > .fav-head, #tab-stats > .stat-toolbar";
document.addEventListener("click", (e) => {
  const btn = e.target.closest?.(".tl-mode-btn, .tl-filter[data-stat-year]");
  const bar = btn?.closest(STICKY_TABS_BAR);
  if (!bar || bar.parentElement.getBoundingClientRect().top >= 0) return;
  requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, 0)));
}, true);

// ── Горячие клавиши ─────────────────────────────
// 1–5 переключают вкладки рельсы, / открывает поиск в «Отзывах», N –
// новый отзыв (только у админа), ? – эта же подсказка списком. Список
// показываемых сочетаний – общий с панелью в настройках, см.
// js/utils.js: keyboardShortcutsList/Html.
function openShortcutsModal() {
  document.getElementById("shortcuts-modal-list").innerHTML = keyboardShortcutsHtml();
  document.getElementById("shortcuts-modal-overlay").classList.remove("hidden");
}
function closeShortcutsModal() {
  document.getElementById("shortcuts-modal-overlay").classList.add("hidden");
}
function closeShortcutsModalOnOverlay(e) {
  if (e.target === document.getElementById("shortcuts-modal-overlay")) closeShortcutsModal();
}

document.addEventListener("keydown", (e) => {
  // Esc закрывает открытую модалку (в том числе эту) – общий
  // обработчик в js/utils.js, здесь только цифры/N//?, поэтому Escape
  // просто ничего из нижеперечисленного не находит и молча проходит.
  if (e.key === "Escape") return;

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (document.querySelector(".modal-overlay:not(.hidden), .review-modal-overlay:not(.hidden)")) return;
  // Настройки окном поверх приложения (router.js, overlay): вкладки под
  // ним видны, но переключать их (а «N» – уводить из настроек) можно
  // только при закрытом окне. Раньше маршрут прятал приложение целиком.
  if (document.querySelector("#view-root.route-overlay:not(.hidden)")) return;

  // e.code – физическая клавиша, не символ: e.key на русской раскладке
  // для тех же клавиш отдаёт кириллицу («ф» вместо «/», «т» вместо «н» –
  // клавиша N – и вовсе не «н», а совсем другая), и сочетания молча не
  // срабатывали, пока не переключишься на английскую. code от раскладки
  // не зависит.
  // Позиция считается только по ВИДИМЫМ вкладкам – скрытые в настройках
  // (settings.hiddenTabs, см. theme.js) остаются в DOM с атрибутом
  // hidden, и без фильтра «1» продолжала бы указывать на позицию в
  // общем списке, а не на первую видимую. tabId берём из самой кнопки
  // (aria-controls), а не гадаем по номеру – settings.tabOrder может
  // переставить вкладки местами, и порядковый номер после этого уже
  // не совпадает с зашитым «tab-now, tab-favorites, …».
  const digitMatch = /^Digit([1-5])$/.exec(e.code);
  const visibleTabBtns = () => Array.from(document.querySelectorAll(".rail-tabs .tab-btn:not([hidden])"));
  if (digitMatch) {
    const btn = visibleTabBtns()[Number(digitMatch[1]) - 1];
    if (btn) { e.preventDefault(); switchTab(btn.getAttribute("aria-controls"), btn); }
    return;
  }

  // Своя клавиша на конкретную вкладку (Настройки → Горячие клавиши →
  // Переключение вкладок) – привязана к id, а не к позиции, поэтому
  // работает поверх цифр независимо от того, что скрыто или переставлено.
  for (const [tabId, b] of Object.entries(currentTabKeyBindings())) {
    if (tabBindingMatchesKey(e, b)) {
      const btn = document.querySelector(`.tab-btn[aria-controls="tab-${tabId}"]:not([hidden])`);
      if (btn) { e.preventDefault(); switchTab(`tab-${tabId}`, btn); }
      return;
    }
  }

  // Биндинги настраиваемые (см. js/utils.js: currentKeybindings) –
  // /, N и ? по умолчанию, но каждый можно перевесить на другую
  // клавишу в Настройки → Горячие клавиши.
  const kb = currentKeybindings();
  if (keyBindingMatches(e, kb.search)) {
    e.preventDefault();
    const btn = document.querySelector('.tab-btn[aria-controls="tab-reviews"]');
    switchTab("tab-reviews", btn);
    setTimeout(() => document.getElementById("rv-search")?.focus(), 50);
  } else if (keyBindingMatches(e, kb.newReview) && typeof isAdmin === "function" && isAdmin()) {
    e.preventDefault();
    location.hash = "#/add";
  } else if (keyBindingMatches(e, kb.shortcuts)) {
    e.preventDefault();
    openShortcutsModal();
  }
});

// Кнопки мыши (средняя, «назад»/«вперёд» на боковине) для переключения
// вкладок – та же привязка по id, что и у клавиш выше, просто другой
// источник события. Левая кнопка сюда не заходит (button === 0) – она
// нужна для обычных кликов по интерфейсу.
document.addEventListener("mousedown", (e) => {
  if (e.button === 0) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (document.querySelector(".modal-overlay:not(.hidden), .review-modal-overlay:not(.hidden)")) return;
  // Настройки окном поверх приложения (router.js, overlay): вкладки под
  // ним видны, но переключать их (а «N» – уводить из настроек) можно
  // только при закрытом окне. Раньше маршрут прятал приложение целиком.
  if (document.querySelector("#view-root.route-overlay:not(.hidden)")) return;
  for (const [tabId, b] of Object.entries(currentTabKeyBindings())) {
    if (tabBindingMatchesMouse(e, b)) {
      const btn = document.querySelector(`.tab-btn[aria-controls="tab-${tabId}"]:not([hidden])`);
      if (btn) { e.preventDefault(); switchTab(`tab-${tabId}`, btn); }
      return;
    }
  }
});

// Первую вкладку открываем только после того, как применились настройки
// сайта: до этого неизвестны ни стартовая вкладка (mainTab), ни порядок,
// ни какие вкладки скрыты. Раньше клик стоял здесь же синхронно – вкладка
// успевала отрисоваться со встроенными настройками и через миг
// перерисовывалась поверх, а mainTab не работал вовсе.
// Обёртка Promise.resolve обязательна. window.themeReady приходит из
// theme.js, и если браузер по какой-то причине отдаст старую копию
// этого файла (кэш, сбой загрузки), themeReady окажется undefined –
// без обёртки здесь падал бы весь блок, и страница навсегда осталась
// бы на надписи «Загружаем…». Теперь в худшем случае просто откроется
// первая доступная вкладка.
// Если адрес открыт сразу на маршруте (#/reviews-order и т.п. –
// прямая ссылка/обновление страницы), рельса всё равно скрыта
// роутером (см. js/router.js), но кликать по вкладке под ней смысла
// нет – она всё равно не видна, а её loadNow()/loadFavorites()/…
// сходят в сеть впустую.
Promise.resolve(window.themeReady).then(() => {
  _navInit = false;
  if (location.hash) return;
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");

  if (btn) btn.click();
});

// Клик по логотипу на самой же главной – это переход "/" -> "/", то
// есть по сути просто "вернуться на стартовую вкладку и наверх". Без
// перехвата это была бы настоящая перезагрузка: страница поднимается
// заново с нуля, снова ждёт настройки сайта, снова открывает стартовую
// вкладку, а та заново запрашивает свои данные и на время запроса
// показывает спиннер вместо контента – резкая смена высоты между
// спиннером и заполненной вкладкой и читается как рывок интерфейса.
// Обычно перезагрузка укладывается в один кадр и не видна, но при
// быстрых повторных кликах эти циклы наслаиваются друг на друга.
// Тут же вкладка и так уже открыта и её данные уже загружены – так что
// вместо повторного похода на сервер просто возвращаемся к стартовой
// вкладке и скроллу локально, без единого лишнего запроса.
document.querySelector(".logo")?.addEventListener("click", (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  // Активен маршрут роутера (#/reviews-order и т.п.) – сначала просто
  // уходим с него (leaveRoute() из js/router.js), тем же приёмом, что
  // раньше был переходом на "/". Вкладку саму по себе трогать не надо:
  // она и так осталась открытой под скрытой рельсой (см. renderRoute()).
  if (location.hash) {
    leaveRoute();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");
  btn?.click();
});

makeResizablePanel(
  document.getElementById("rail"),
  document.getElementById("rail-resize"),
  "tasteid-rail-width", 180, 420
);

// Service worker и manifest.json – это PWA-механика для установки
// сайта из браузера («Добавить на экран»/офлайн-страница), а сайта в
// этом репозитории нет: тут только Electron- и мобильное приложение,
// у которых свои родные способы установки. sw.js был не просто
// бесполезен (сервер локальный, «плохой сети» не бывает), а вреден:
// порт при каждом запуске новый, значит и источник (origin) для
// service worker'а новый – и на диске копится Cache Storage от
// происхождений, куда приложение больше никогда не зайдёт и которые
// никому не почистить. Файлы sw.js и manifest.json удалены вместе с
// этой регистрацией.
</script>

</body>
</html>
