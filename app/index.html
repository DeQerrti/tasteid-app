<!DOCTYPE html>
<html lang="ru">
<head>
<script>
// Тема из кэша – синхронно, до первой отрисовки. theme.js ниже тоже её
// применяет, но только после fetch("/site-settings.json") – а это сеть,
// пусть и локальная. При быстрой повторной навигации (пара кликов по
// логотипу подряд) окно между первой отрисовкой и ответом сервера иногда
// растягивается настолько, что на долю секунды видна тема по умолчанию
// из :root, прежде чем встанет настоящая. localStorage читается без
// сети, поэтому успевает всегда. Ключ пишет и обновляет applyTheme() в
// theme.js.
//
// Ключ содержит id хранилища (window.__TASTEID.vaultId – он сам уже
// вписан в HTML выше этого тега, см. её же комментарий в
// electron/protocol.js) – без этого кэш темы одного хранилища был
// виден в другом: тема/палитра примешивались между хранилищами при
// переключении. sync.js с общей vaultScopedKey() сюда ещё не
// подключён – этот тег в разметке первым, до него, поэтому та же
// логика повторена тут же, в одну строку.
(function () {
  try {
    var vaultId = (window.__TASTEID && window.__TASTEID.vaultId) || "default";
    var cached = JSON.parse(localStorage.getItem("tasteid-skin-cache:" + vaultId));
    if (!cached) return;
    if (cached.skin) document.documentElement.setAttribute("data-skin", cached.skin);
    if (cached.declarations) {
      var s = document.createElement("style");
      s.id = "theme-overrides";
      s.textContent = ":root { " + cached.declarations + " }";
      document.head.appendChild(s);
    }
  } catch {}
})();
</script>

<style>
/* ══ NOIR PALETTE ════════════════════════════════ */

/* ══ HEADER ══════════════════════════════════════ */

/* ══ ОБОЛОЧКА: БОКОВАЯ ПАНЕЛЬ ═════════════════════
   Раньше здесь был бренд-хиро на всю ширину (логотип, подзаголовок,
   декоративные точки) и под ним – горизонтальная строка вкладок,
   пришитая к верху. Это работало как первая страница сайта: витрина,
   которую видят один раз. Для окна, которое открывают по многу раз в
   день, это означало заново скроллить мимо одного и того же хиро на
   каждой перезагрузке – и вкладки, актуальные только на десктопе.

   Ниже – тот же приём, что уже работает в settings-edit.html
   (#sidebar): липкая колонка слева, а не строка сверху. Логотип
   переиспользует класс .logo – он же нужен JS-перехвату клика на
   логотипе (см. скрипт в конце файла), поэтому просто переопределяем
   его размер здесь, а не заводим новый класс. */
body { display: flex; }

/* На тач-экране (телефон, планшет) полоску скролла всё равно никто не
   успевает разглядеть пальцем – ни навести, ни ухватить её нельзя, а
   декоративный жёлоб у правого края только зрительно мешает. На
   компьютере (мышь/трекпад) оставляем как есть – там от неё есть
   реальная польза. `*`, а не только `body`/`main` – та же полоска
   торчала у любого внутреннего блока со своей прокруткой (модалка
   отзыва, списки в настройках и т.д.). */
@media (hover: none) and (pointer: coarse) {
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; }
}

nav#rail {
  width: 204px; flex: 0 0 auto;
  display: flex; flex-direction: column;
  padding: 18px 14px;
  border-right: 1px solid var(--border);
  background: var(--nav-bg);
  position: sticky; top: 0;
  /* var(--app-titlebar) – только в Electron: chrome.js поднимает верх
     колонки ниже полосы для перетаскивания окна (см. её же комментарий
     про top у nav). В браузере и на телефоне переменная не задана,
     calc() тогда просто вычитает 0. */
  height: calc(100vh - var(--app-titlebar, 0px));
  overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
}

/* Растягивание рельсы мышью – см. js/utils.js, makeResizablePanel().
   Полоска на 3px шире своей видимой части (border-right у самой nav)
   – чтобы попасть курсором было проще, чем в ровно 1px. */
.rail-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 5;
}

/* Логотип и подпись под ним – один визуальный блок с одной чертой
   снизу, а не два раздельных (раньше у каждого была своя граница и
   свой отступ, а между ними – отрицательный margin, чтобы стянуть их
   обратно: две линии почти впритык читались как двойная рамка). */
nav#rail .logo {
  font-size: 1.2rem;
  letter-spacing: .02em;
  display: block;
  padding: 4px 6px 2px;
}
.rail-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem; letter-spacing: .03em; text-transform: uppercase;
  white-space: nowrap;
  color: var(--text-dim);
  padding: 0 6px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.rail-tabs { display: flex; flex-direction: column; gap: 2px; }

.tab-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-dim);
  background: none;
  border: none;
  border-radius: 7px;
  /* Раньше left: подсветка неактивной вкладки не видна (background:
     none), поэтому смещение к краю не бросалось в глаза. Но стоило
     вкладке стать активной – background заливал всю ширину кнопки, а
     слово оставалось прижато к левому краю, и «вмятина» подсветки
     читалась заметно шире самого слова. Центр – по всем вкладкам сразу,
     а не только у активной: иначе при наведении текст на миг прыгал бы
     между двумя выравниваниями. Так уже сделано в рисованной теме –
     здесь то же самое стало базовым, а не только её особенностью. */
  text-align: center;
  padding: .6rem .7rem;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
}
.tab-btn:hover { color: var(--text); background: var(--tint-hi); }
.tab-btn.active { color: var(--text-hi); background: var(--tint-hi); }
/* Ромб слева от активной вкладки раньше рисовался в базовой теме (не
   берётся символом '◆' из шрифта: ни один из самохостящихся файлов
   Cormorant Garamond не содержит этот знак, проверено по cmap, и
   браузер молча подставлял системный запасной – на Android он рисуется
   заметно крупнее и грубее, чем на компьютере). С центрированием текста
   выше он держался бы за левый край кнопки отдельно от слова, поэтому
   скрыт – ровно как во всех остальных темах, которые задают то же
   правило сами (themes.css). */
.tab-btn.active::before {
  display: none;
}

.rail-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

/* ── Полное сворачивание рельсы ──────────────────
   По просьбе из обратной связи: раздел можно свернуть целиком (место
   отдаётся контенту), а вернуть его – наведением у левого края, как
   автоскрытая панель задач Windows. Состояние живёт в localStorage –
   см. скрипт в конце файла (initRailMode, вид «прятать»).

   Приём: position: fixed снимает рельсу из flex-потока – main, будучи
   единственным оставшимся flex-элементом, сам растягивается на всю
   ширину, никакой отдельной правки под main не нужно. transform, а не
   left/width – так поверх скольжение анимируется дёшево (GPU), а не
   перекладкой макета на каждый кадр. */
.rail-collapse-btn {
  position: absolute; top: 16px; right: 10px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 5px;
  background: none; color: var(--text-dim);
  cursor: pointer;
}
.rail-collapse-btn:hover,
.rail-collapse-btn[aria-expanded="true"] { color: var(--text); background: var(--tint-hi); }

body.rail-collapsed nav#rail {
  position: fixed; top: 0; left: 0;
  transform: translateX(-100%);
  z-index: 100;
  box-shadow: 4px 0 24px rgba(0, 0, 0, .25);
  transition: transform .16s ease;
}
body.rail-collapsed nav#rail.rail-peek { transform: translateX(0); }

/* ── Вид панели: меню у кнопки (initRailMode) ──
   Раньше кнопка-стрелка умела только «свернуть целиком / развернуть».
   Теперь три вида: развёрнута, только иконки (узкая полоса), прятать
   (выезжает при наведении на край – прежнее сворачивание). Меню
   живёт вне nav#rail: у рельсы overflow скрыт, внутри его бы обрезало. */
.rail-mode-menu {
  position: fixed; z-index: 1000;
  width: 260px; padding: .55rem;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
  box-shadow: 0 14px 40px var(--shadow, rgba(0,0,0,.6));
  font-family: 'DM Sans', sans-serif;
}
.rail-mode-menu.hidden { display: none; }
.rail-mode-menu-title {
  font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-dim); padding: .3rem .55rem .45rem;
}
.rail-mode-option {
  display: grid; grid-template-columns: 18px 1fr; gap: .1rem .65rem; align-items: start;
  width: 100%; text-align: left;
  padding: .55rem; border: 0; border-radius: 6px; background: none;
  color: var(--text-hi); cursor: pointer; font: inherit;
}
.rail-mode-option:hover, .rail-mode-option:focus-visible { background: var(--tint-hi); outline: none; }
.rail-mode-radio {
  grid-row: span 2; margin-top: .15rem;
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--text-dim);
  display: flex; align-items: center; justify-content: center;
}
.rail-mode-option[aria-checked="true"] .rail-mode-radio { border-color: var(--red-hi); }
.rail-mode-option[aria-checked="true"] .rail-mode-radio::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red-hi);
}
.rail-mode-name { font-size: .92rem; font-weight: 500; }
.rail-mode-desc { font-size: .76rem; color: var(--text-dim); line-height: 1.35; }

/* Только иконки: узкая полоса, подпись – подсказкой при наведении
   (title, ставит initRailMode). Ширина !important – перебить ширину,
   которую рельсе ставит растягивание мышью (inline style). Только на
   компьютере – на телефоне рельса и так нижняя панель. */
@media (min-width: 701px) {
  body.rail-icons nav#rail { width: 72px !important; padding: 14px 10px; align-items: stretch; }
  body.rail-icons nav#rail .logo,
  body.rail-icons .rail-sub,
  body.rail-icons .rail-resize,
  body.rail-icons nav#rail .tab-label,
  body.rail-icons .admin-link-label { display: none; }
  body.rail-icons .rail-collapse-btn { position: static; margin: 0 auto 14px; width: 30px; height: 30px; }
  body.rail-icons .rail-tabs { padding-top: 12px; border-top: 1px solid var(--border); gap: 6px; }
  body.rail-icons nav#rail .tab-btn,
  body.rail-icons #admin-settings-link:not(.hidden) {
    display: flex; align-items: center; justify-content: center;
    padding: .7rem 0; gap: 0;
  }
  body.rail-icons nav#rail .tab-icon,
  body.rail-icons .admin-link-icon { display: block; width: 22px; height: 22px; flex: none; }
  body.rail-icons nav#rail .tab-btn.active::before { left: -10px; }
}

/* Полоска-ловушка у самого края экрана: рельса, когда свёрнута, уезжает
   за пределы окна transform'ом и наводить курсор больше не на что –
   эта полоска остаётся на месте и ловит подход мыши. Видна только
   свёрнутой рельсе; на телефоне сворачивания нет (см. медиа-запрос
   ниже), поэтому там её тоже нет. */
#rail-edge-trigger { display: none; }
body.rail-collapsed #rail-edge-trigger {
  display: block;
  position: fixed; top: 0; left: 0; bottom: 0; width: 10px;
  z-index: 99;
}

/* См. комментарий у #admin-settings-link в разметке ниже: без этого
   правила класс .hidden у ссылки ничего не делал. */
.hidden { display: none; }

#admin-settings-link {
  display: block;
  font-size: .95rem;
  padding: .5rem .7rem;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 7px;
}
#admin-settings-link:hover { color: var(--text); background: var(--tint-hi); }
/* #admin-settings-link задаёт свой display (нужен для паддингов –
   голая <a> строчная, паддинг сверху/снизу на ней визуально не
   работает), а это ID-селектор – специфичнее класса .hidden выше.
   Без явного переопределения тут .hidden ничего не скрывал бы на
   этой конкретной ссылке. */
#admin-settings-link.hidden { display: none; }
.admin-link-icon { display: none; }

/* Иконка вкладки скрыта на столе намеренно: в рельсе и так достаточно
   места под подпись целиком, а рисованный значок рядом с уже говорящим
   словом только грузит рельсу шире. Нужна она ровно там, где вкладки
   сжаты в пять узких стоблцов нижней панели – то есть только под
   мобильным медиа-запросом ниже. */
.tab-icon { display: none; }

/* Телефон. 236px рельсы там съедали бы больше половины ширины – как и
   в settings-edit.html при той же проблеме, но лечится иначе: там
   всего один экран за раз, а тут пять равноценных вкладок, к которым
   возвращаются по многу раз за сессию – им лучше подходит нижняя
   панель, приклеенная к низу экрана, чем прокручиваемая строка сверху
   (тот же паттерн, что в большинстве мобильных приложений). */
@media (max-width: 700px) {
  body { display: block; }

  nav#rail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; height: auto;
    flex-direction: row; align-items: stretch;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    border-right: none; border-top: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 50;
    /* translateZ(0)/will-change – overscroll-behavior-y: none на body
       (style.css) не убрал "прыжок" панели при резком отскоке до конца
       списка на Android; похоже, дело не в самом отскоке, а в том, как
       WebView компонует именно ЭТОТ fixed-элемент во время скролла –
       у него ещё и backdrop-filter, а это сама по себе дорогая операция
       компоновки, которая на Android нередко даёт визартефакты
       (дрожание/смещение) именно у position: fixed поверх скролла.
       Явный перевод в свой composited-слой (тот же приём, что и для
       "прыгающих" fixed-панелей в other общих отчётах об Android
       WebView) отделяет её перерисовку от перерисовки скроллящегося
       контента под ней. Не проверено на реальном устройстве. */
    transform: translateZ(0);
    will-change: transform;
  }
  /* .rail-foot больше не в этом списке: раньше вся нижняя часть
     рельсы (а с ней и единственная ссылка на /settings-edit) на
     телефоне пряталась целиком, и владелец сайта не мог попасть в
     настройки со своего телефона вообще никаким путём – CSS ниже
     превращает её в компактную иконку-кнопку с краю нижней панели,
     рядом с обычными вкладками, вместо того чтобы прятать. */
  nav#rail .logo, .rail-sub { display: none; }
  .rail-resize { display: none; }
  /* Сворачивание рельсы – история про широкий экран (много вертикали,
     мало горизонтали её жалко). На телефоне рельса и так превращается
     в нижнюю панель – сворачивать там нечего, а .rail-collapse-btn при
     невидимом логотипе была бы кнопкой в пустоте. */
  .rail-collapse-btn { display: none; }
  body.rail-collapsed nav#rail { position: fixed; transform: none; }
  #rail-edge-trigger { display: none !important; }

  .rail-tabs {
    flex-direction: row; flex: 1; gap: 0;
    /* Была версия с прокруткой (overflow-x: auto + минимальная ширина
       вкладки) – на деле неудобнее самого сжатия: чтобы увидеть
       последнюю вкладку, надо было ещё и знать, что полоску можно
       листать пальцем, а место с краю занимал плавающий FAB. Вместо
       этого вкладки снова просто ужимаются (flex:1, min-width:0,
       ниже), но не «до нечитаемого», как раньше без иконок, – сама
       иконка и текст под ней теперь тоже плавно уменьшаются (см.
       .tab-icon/.tab-label ниже, clamp() от ширины экрана), поэтому
       и на маленьком телефоне, и на планшете в этой же раскладке всё
       помещается без обрезки и без прокрутки. Скрытая через
       [hidden] (см. settings-edit → «скрыть вкладку») вкладка просто
       выпадает из ряда – оставшиеся при том же flex:1 сами растягиваются
       шире, отдельного кода на этот случай не нужно. */
  }
  .tab-btn {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    /* vw, а не фиксированный размер – при прочих равных ширина вкладки
       прямо следует за шириной экрана (это в мобильной раскладке и
       есть ширина устройства целиком, здесь не бывает других широких
       соседей), так что планшет и маленький телефон получают разный,
       но всегда достаточный размер сами, без отдельных брейкпоинтов
       под конкретные устройства. */
    font-size: clamp(.56rem, 2.5vw, .68rem); letter-spacing: .01em;
    padding: .5rem .1rem;
    border-radius: 8px;
  }
  /* Раньше white-space/overflow/ellipsis висели прямо на .tab-btn – это
     работало, пока внутри был один текстовый узел. С иконкой кнопка
     стала flex-колонкой из двух детей, и обрезание переехало на сам
     текстовый span – на кнопке в целом эти свойства больше ничего не
     обрезают. Обрезание – подстраховка на случай очень длинной своей
     подписи (/settings-edit → labels.nav.*): сам текст к этому
     моменту уже уменьшен вместе с иконкой (clamp выше), до эллипсиса
     дело в обычных подписях не доходит. */
  .tab-label {
    max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab-icon {
    display: block;
    width: clamp(16px, 4.2vw, 20px); height: clamp(16px, 4.2vw, 20px);
    flex-shrink: 0;
  }
  .tab-btn.active::before {
    top: 1px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
  }

  /* ── Настройки в нижней панели ──────────────────
     .rail-foot больше не растягивается на всю высоту рельсы и не
     прижимается к низу через margin-top: auto (это было нужно только
     в вертикальной раскладке стола) – здесь это просто ещё один
     flex-элемент в общем ряду с вкладками, той же высоты, что и они,
     но flex: 0 0 auto – под одну иконку, не делит пространство
     поровну с пятью содержательными вкладками. */
  .rail-foot {
    margin-top: 0; padding-top: 0; border-top: none;
    flex: 0 0 auto;
    display: flex; align-items: stretch;
  }
  #admin-settings-link {
    display: flex; align-items: center; justify-content: center;
    width: 44px;
    padding: .5rem .2rem;
    border-radius: 8px;
  }
  #admin-settings-link.hidden { display: none; }
  /* Подпись прячем – по одной иконке в вытянутый квадрат текст уже
     не вписать так, чтобы он не наезжал на соседнюю вкладку. aria-label
     на самой ссылке (см. разметку) остаётся для скринридера. */
  .admin-link-label { display: none; }
  .admin-link-icon { display: block; width: 20px; height: 20px; }
}

/* Видимая рамка фокуса. Карточка отзыва теперь фокусируема
   (role="button" + tabindex), и без этого правила человек, идущий
   по странице с клавиатуры (по-настоящему Tab'ом – html.kb-nav,
   см. js/utils.js), не понимал бы, где находится. Мышиный клик её не
   рисует вообще: outline:none по умолчанию, а html.kb-nav включается
   только клавишей Tab и снимается любым кликом. */
.review-card-wrap:focus,
.review-modal-panel:focus {
  outline: none;
}
html.kb-nav .review-card-wrap:focus,
html.kb-nav .review-modal-panel:focus {
  outline: 2px solid var(--red-hi);
  outline-offset: 2px;
}

/* ══ LAYOUT ══════════════════════════════════════ */
main { flex: 1; min-width: 0; max-width: 1800px; margin: 0 auto; padding: 2.5rem 2.5rem 6rem; }
@media (max-width: 700px) {
  main { padding: 1.25rem 1rem calc(5.5rem + env(safe-area-inset-bottom)); }
}
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-hi);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .8rem;
  min-width: 0;
}

.year-divider {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--border2);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.year-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
.year-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ══ GRIDS ═══════════════════════════════════════ */
/* На телефоне – 4 колонки, не 2: та же правка и по той же причине,
   что уже сделана для .reviews-grid (см. её же комментарий там) –
   два тайтла в ряд отдавали пол-экрана под обложки и не показывали
   ни одного полного ряда без прокрутки. */
.grid-now { display: grid; gap: .6rem; grid-template-columns: repeat(4, 1fr); }
@media (min-width: 640px)  { .grid-now { gap: .85rem; grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars { display: grid; gap: .6rem; grid-template-columns: repeat(4, 1fr); }
@media (min-width: 640px)  { .grid-chars { gap: .85rem; grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 860px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1100px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* Колонка 1fr – это minmax(auto, 1fr), и её нижняя граница считается по
   содержимому: что-то непереносимое внутри (длинное название, ссылка,
   имя файла) молча раздвигает колонку, а с ней и весь грид за пределы
   экрана. min-width: 0 у самих ячеек снимает это правило раз и
   навсегда – обрезка и перенос внутри карточки уже настроены (см.
   .card-title), и колонка обязана слушаться экрана, а не наоборот.
   Одна строка на все три грида: попадать в неё будут и будущие
   карточки, а не только те, где это уже вылезло. */
.grid-now > *, .grid-chars > *, .reviews-grid > * { min-width: 0; }

.fav-export-modal .confirm-dialog-text { margin-bottom: .75rem; }
.fav-export-modal .fav-export-option {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .4rem 0;
  cursor: pointer;
  font-size: .9rem;
}
/* ══ CARDS ═══════════════════════════════════════ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: var(--card-border, 1px solid var(--border));
  border-radius: var(--card-radius, 2px);
  overflow: hidden;
  text-decoration: none;
  transition: border-color .25s, transform .25s, box-shadow .25s;
  position: relative;
  box-shadow: var(--card-shadow, none);
}
.card::before {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; top: 0; left: 0;
  width: 12px; height: 12px;
  /* Уголки в покое прозрачные и проявляются только при наведении (см.
     .card:hover::before ниже): красные уголки у КАЖДОЙ карточки сетки
     сливались в красную рябь по всему экрану. */
  border-top: 1px solid transparent;
  border-left: 1px solid transparent;
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card::after {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-bottom: 1px solid transparent;
  border-right: 1px solid transparent;
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover, var(--card-shadow, none));
}
.card:hover::before,
.card:hover::after {
  border-color: var(--red);
  width: 16px; height: 16px;
}

/* Оборачивает обложку вместе с type-tag/watch-badge – раньше оба бейджа
   позиционировались прямо от .card, то есть от границ ВСЕЙ карточки
   (обложка + текст под ней), и просто оказывались в её верхних углах.
   Для watch-badge-bottom ниже (мобильный перенос даты в нижний угол
   обложки, см. её же комментарий там) нужна опора именно на низ
   картинки, а не на низ карточки целиком – отсюда этот отдельный
   позиционированный контейнер. */
.card-poster {
  position: relative;
  flex-shrink: 0;
}
.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
  /* Раньше grayscale(.15) brightness(.9): обложки в покое выглядели
     пыльными, и вся сетка – мутной. Теперь почти без фильтра; при
     наведении карточка всё так же чуть «оживает» (см. :hover ниже). */
  filter: var(--card-img-filter, brightness(.96));
  transition: filter .3s;
  flex-shrink: 0;
}
.card:hover img { filter: var(--card-img-filter-hover, brightness(1.04)); }
.card-char img  { aspect-ratio: 1/1; }
.card-char { cursor: pointer; }

.card-body {
  padding: .6rem .7rem .7rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  flex: 1;
  /* Цветной полосы оценки под обложкой больше нет (была
     box-shadow: inset 0 3px 0 var(--gc)): на тёмных и цветных обложках
     она сливалась с картинкой и читалась как часть постера, а не как
     оценка. Цвет полки остался ромбом рядом с подписью оценки
     (.card-grade-dot), --gc на .card по-прежнему ставят шаблоны. */
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
  /* Название без пробелов (ссылка вместо названия, ромадзи одним
     словом) не переносится нигде и распирает карточку до своей
     ширины. -webkit-line-clamp обрезает только на вид: минимальная
     ширина колонки грида считается по самому длинному слову, и одна
     такая запись растягивала весь грид далеко за экран. На телефоне
     этим утаскивало и нижнюю панель вкладок (она position: fixed, но
     ширина у неё от того же расползшегося макета), то есть переключать
     вкладки становилось нечем. */
  overflow-wrap: anywhere;
}
.card-meta {
  margin-top: auto;
  padding-top: .3rem;
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
/* На телефоне карточка вчетверо уже настольной (4 колонки против
   плавающего числа больше), а отступы/шрифт были подобраны под неё же –
   на узкой карточке текст выглядел прижатым к краям. Отступы и кегль
   чуть меньше именно здесь, а не переопределены глобально – на
   десктопе карточка достаточно широкая, там ужимать нечего. */
@media (max-width: 700px) {
  .card-body { padding: .4rem .45rem .5rem; }
  .card-title { font-size: .82rem; line-height: 1.25; }
  .card-meta { font-size: .64rem; gap: .2rem; }
}
.card-grade-inline {
  font-family: 'Cormorant Garamond', serif;
  font-size: .92rem;
  font-style: italic;
  font-weight: 600;
  color: var(--text-hi);
  min-width: 0;
  display: inline-flex; align-items: center; gap: .35rem;
}
.card-grade-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* На узкой карточке телефона рядом с годом «Разочарование» в полный
   кегль не помещается – оценку там и так видно по цветной полосе. */
@media (max-width: 700px) {
  .card-grade-inline { font-size: .68rem; }
}

/* ══ TYPE TAGS ═══════════════════════════════════ */
.type-tag {
  position: absolute; top: 0; right: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .55rem;
  z-index: 3;
  background: var(--badge-bg, var(--poster-scrim));
  backdrop-filter: blur(8px);
  border-radius: var(--radius-btn, 0px) 0 0 var(--radius-btn, 0px);
}
.tag-anime, .tag-manga, .tag-novel, .tag-movie, .tag-show, .tag-manual, .tag-book {
  color: var(--badge-text, var(--text-hi));
  border-bottom: 1px solid var(--badge-border, rgba(240,236,230,.18));
  border-left:   1px solid var(--badge-border, rgba(240,236,230,.18));
}

/* .rewatch-badge (счётчик "↻ ×N" на карточке отзыва, reviews.js) делит
   с .watch-badge всю визуальную оболочку – но НЕ переезд в нижний угол
   на телефоне ниже (.card-poster .watch-badge): у карточки отзыва этот
   нижний угол теперь занимает сама дата (см. её же комментарий у
   reviewCard в reviews.js), а счётчик пересмотров должен остаться в
   верхнем левом углу рядом с типом тайтла, а не встать на то же место
   поверх даты. Раз в базовом правиле только .watch-badge, а не она же
   с .rewatch-badge, – мобильное переопределение адресовано по имени и
   счётчика попросту не касается. */
.watch-badge, .rewatch-badge {
  position: absolute; top: 0; left: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; font-weight: 500;
  color: var(--badge-text-dim, rgba(240,236,230,.7));
  background: var(--badge-bg, var(--poster-scrim));
  border-bottom: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-right: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-radius: 0 var(--radius-btn, 0px) var(--radius-btn, 0px) 0;
  padding: .25rem .52rem;
  /* backdrop-filter тут раньше стоял (как у .type-tag выше) – убран
     только здесь: на телефоне бейдж переезжает в нижний угол картинки
     (.card-poster .watch-badge ниже), и именно там кто-то видел зазор
     между картинкой и датой, который не удалось воспроизвести ни в
     одном браузерном прогоне (та же тема, тот же диапазон дат, с живой
     картинкой и без) – возможный виновник, которого нельзя ни
     подтвердить, ни исключить без самого устройства, это как раз
     backdrop-filter поверх ещё догружающейся картинки (известное слабое
     место старых/бюджетных Android WebView). Без него бейджу ничего не
     угрожает – background и так уже задаёт фон, только без размытия под
     текстом.
  */
  z-index: 3;
  max-width: calc(100% - 64px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* .date-badge (дата отзыва бейджем на обложке, reviews.js: reviewCard) –
   скрыт по умолчанию. На карточке отзыва рядом уже есть .rewatch-badge
   в том же верхнем левом углу (общий top:0;left:0 у .watch-badge –
   .card-poster .watch-badge ниже переносит вниз только на телефоне), и
   без этого на широких карточках ПК оба бейджа легли бы друг на друга.
   На ПК столбцы и так не тесные – дата остаётся текстом в .card-meta
   (.meta-date, видимый по умолчанию). Мобильное переопределение ниже
   меняет местами, какой из двух показан. */
.date-badge { display: none; }
/* 64px в max-width выше рассчитаны на карточку в широком гриде – они
   резервируют место под .type-tag в правом верхнем углу. На телефоне
   (4 колонки, карточка ~80-90px) это оставляло дате/значку "↻ ×N"
   почти ничего, текст обрезался в нечитаемый обрывок – собственно то,
   что "не видно". .type-tag тоже уменьшен здесь же, а не только у
   .watch-badge, – резерв в max-width посчитан именно под его уменьшенный
   размер, порознь править было бы нечем мерить. После правил выше по
   источнику той же специфичности, а не внутри (см. её же историю у
   .tl-mode-btn чуть раньше в этой сессии) – иначе безусловные правила
   ниже по каскаду просто победили бы. */
@media (max-width: 700px) {
  .watch-badge, .rewatch-badge, .type-tag { font-size: .5rem; padding: .18rem .4rem; }
  .watch-badge, .rewatch-badge { max-width: calc(100% - 30px); }
  /* Меняем местами, какая из двух версий даты видна – см. .date-badge
     выше. Специфичность у обеих та же, что у их базового правила (один
     класс), но обе стоят позже по источнику – см. её же историю в этом
     файле про .tl-mode-btn/.watch-badge: более позднее безусловное
     правило перебивает более раннее той же специфичности, даже из
     другого @media. */
  .date-badge { display: inline-block; }
  .card-meta .meta-date { display: none; }
  /* На телефоне (4 колонки, обложка ~80px) дата и type-tag делили один
     и тот же верхний ряд – на диапазоне из двух дат ("05.10–22.11", не
     одна короткая дата) им обоим просто не хватало места, и они
     наезжали друг на друга. card-poster (см. её же комментарий у него
     в этом файле выше) даёт дате свою собственную опору – нижний левый
     угол обложки вместо верхнего левого, так что весь верхний ряд
     остаётся только за type-tag. Выше по специфичности, чем правило
     .watch-badge прямо над этим блоком (два класса вместо одного) –
     побеждает независимо от порядка, но идёт следом по смыслу. */
  .card-poster .watch-badge {
    top: auto; bottom: 6px;
    /* Раньше тут была та же "флажок в углу" форма, что у настольной
       версии (два острых угла впритык к краю картинки, два скруглённых
       наружу) – на телефоне это опиралось на то, что бейдж и правда
       вплотную к нижнему левому углу картинки. На некоторых устройствах
       (не удалось воспроизвести здесь, но воспроизводится стабильно на
       реальном телефоне) между ними появляется зазор – и тогда острые
       "не в тот угол" углы выглядят просто сломанными, а не как часть
       замысла. Обычный скруглённый со всех сторон чип не завязан на то,
       вплотную он к краю или нет – смотрится правильно в обоих случаях.
       bottom: 6px, а не 0, – вплотную к самому низу обложки бейдж visually
       сливался с card-body, начинающимся сразу под картинкой (заголовок
       без единого отступа). Тот же зазор от края, что у .type-tag в
       противоположном верхнем углу (там мержиться не с чем – картинка
       кончается, и рядом с бейджем сразу пустое поле карточки).
    */
    border: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
    border-radius: var(--radius-btn, 0px);
    max-width: calc(100% - 6px);
  }
}

.progress-line {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--red-hi);
  font-weight: 500;
}

/* ══ STATE ═══════════════════════════════════════ */
/* Оформление тем переехало в themes.css – там же лежат палитры
   и структурные отличия каждой темы. */


@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══ REVIEWS GRID ════════════════════════════════ */
/* minmax(0, 1fr), а не просто 1fr: колонка по умолчанию не даёт себе стать
   уже min-content своего содержимого, а карточка отзыва с обложкой в 150px
   и текстом внутри как раз шире экрана телефона – из-за этого вся страница
   уезжала вбок примерно на 20px (см. и overflow-wrap на .card-title выше –
   тот же класс бага, вторая подстраховка). На телефоне – 4 колонки, а не
   2: две отдавали ползаписи только на обложки и не помещали ни одного
   ряда без прокрутки.*/
.reviews-grid { display: grid; gap: .6rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (min-width: 640px)  { .reviews-grid { gap: .85rem; grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .reviews-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .reviews-grid { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .reviews-grid { grid-template-columns: repeat(7, 1fr); } }

/* ══ REVIEW CARD ═════════════════════════════════
   Постер + минимум подписей – карточка теперь витрина для беглого
   просмотра коллекции, а не мини-статья. Внутри переиспользован .card
   (index.html, у него уже есть постер на всю карточку, оверлеи
   .type-tag/.watch-badge и поддержка всех тем) – та же система, что
   несёт карточки на вкладке «Статусы» (см. cards.js, manualCard).
   Полный текст отзыва по-прежнему открывается по клику – см. модалку
   (.review-modal-*, reviewModalBodyHtml). */
.review-card-wrap { position: relative; height: 100%; }
.review-card-wrap { cursor: pointer; }

.card-grade-row {
  display: flex; align-items: center; gap: .4rem;
  margin-top: .3rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem; font-weight: 600; font-style: italic;
  color: var(--text-hi);
}
/* Тот же приём отрисовки, что у .tab-btn.active::before (index.html) –
   не символ шрифта, а повёрнутый на 45° квадрат, чтобы отпечаток не
   зависел от того, какой шрифт стоит на конкретном устройстве. */
.card-grade-dot {
  width: 6px; height: 6px;
  border-radius: 1px;
  transform: rotate(45deg);
  background: var(--gc);
  flex-shrink: 0;
}

.card-fav {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  color: var(--text-dim);
  margin-top: .25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-fav span { color: var(--text); }

.card-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
.card-tags .rtag { font-size: .6rem; padding: .16rem .45rem; }

/* Нужен только модалке (reviewModalBodyHtml) – в самой карточке
   счётчик пересмотров теперь показан оверлеем .watch-badge. */
.review-rewatch {
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: .25rem .6rem;
  text-align: center;
  /* Тот же случай, что и у .grade-chip чуть ниже: обычный <div> без
     display – блочный, тянется на всю ширину родителя. Фон и рамка у
     него есть всегда, в любой теме (в отличие от .grade-chip, где это
     было заметно только в паре тем) – растянутый пустой фон был видно
     сразу, огромной полосой вместо аккуратного бейджа вокруг "↻ ×N". */
  display: inline-block;
}

.review-modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 24px;
}
.review-modal-overlay.hidden { display: none; }
.review-modal-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  max-width: 760px;
  width: 100%;
  max-height: 86vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  animation: fadeUp .25s ease both;
}
/* Три кнопки в правом верхнем углу модалки – снимок, карандаш
   (редактировать), крестик (закрыть), именно в этом порядке слева
   направо. Место под них зарезервировано .review-modal-header ниже
   через padding-right. Тот же ряд, тот же порядок и у модалки
   персонажа/персоны (.fav-modal-actions, favorites.js). */
.review-modal-actions,
.fav-modal-actions {
  position: absolute; top: 22px; right: 22px; z-index: 5;
  display: flex; gap: 6px;
}
.review-modal-header {
  display: flex; gap: 1.2rem;
  margin-bottom: 1.4rem;
  padding-right: 104px;
}
/* На узком телефоне (обложка 90px + 3 кнопки по 30px не оставляют
   почти ничего под название) кнопки уходят из угла в обычный поток –
   своей строкой НАД обложкой/названием, а не поверх них. Разница с
   десктопом просто в position: static вместо absolute – сам порядок и
   состав кнопок не меняются. */
@media (max-width: 480px) {
  .review-modal-actions,
  .fav-modal-actions {
    position: static;
    justify-content: flex-end;
    margin-bottom: .6rem;
  }
  .review-modal-header { padding-right: 0; }
}
/* Колонка с названием – второй (и единственный кроме обложки) ребёнок
   строки: без min-width: 0 flex-элемент по умолчанию не сжимается
   уже своего содержимого (min-width: auto) – на узком экране (телефон)
   заголовку не хватало места до 104px справа, и он не переносился по
   словам внутри этой ширины, а вылезал вправо, прямо под кнопки
   .review-modal-actions. Тот же приём, что и в других местах сессии
   (см. её же комментарий в CLAUDE.md про flex-min-width). */
.review-modal-header > div { min-width: 0; }
/* Обложка в развороте – крупная (170px, было 90): это главная картинка
   окна, а не значок. Без приглушающего фильтра – обложки в сетке его
   тоже лишились (см. .card img). У персонажа квадрат поменьше. */
.review-modal-cover {
  width: 170px; flex-shrink: 0;
  aspect-ratio: 2/3; object-fit: cover;
  border: 1px solid var(--border2);
  border-radius: 3px;
  box-shadow: 0 10px 30px var(--shadow, rgba(0,0,0,.55));
}
#fav-modal-body .review-modal-cover { width: 150px; aspect-ratio: 1/1; }
@media (max-width: 480px) {
  .review-modal-cover { width: 110px; }
  #fav-modal-body .review-modal-cover { width: 96px; }
}
.review-modal-cover.has-gallery { cursor: pointer; }
.review-modal-header { gap: 1.6rem; }
.review-dates {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .55rem;
  margin-top: .45rem;
  font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text);
}
.review-dates-arrow, .review-dates-note { color: var(--text-dim); }
.review-dates-note { font-size: .8rem; }
.review-modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem; font-weight: 600; line-height: 1.15;
  color: var(--text-hi);
  margin-bottom: .6rem;
}
.review-modal-tags {
  margin: 0 0 1.4rem;
}
.review-modal-tags .rtag {
  font-size: .72rem; padding: .22rem .55rem;
}
.review-modal-fulltext {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 300;
  color: var(--text); line-height: 1.8;
  margin-bottom: 1.4rem;
}
.review-modal-fulltext p { margin: 0 0 1rem; }
.review-modal-fulltext p:last-child { margin-bottom: 0; }
.review-modal-nofull-hint {
  font-family: 'DM Sans', sans-serif !important;
  font-size: .8rem !important;
  color: var(--text-dim) !important;
}

/* ══ МОДАЛКА ПЕРСОНАЖА/ПЕРСОНЫ: анкета (favorites.js) ══ */
.fav-modal-quotes { margin-bottom: 1.4rem; }
.fav-modal-quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; font-style: italic;
  color: var(--text-dim); line-height: 1.6;
  margin: 0 0 .6rem; padding-left: .8rem;
  border-left: 2px solid var(--border2);
}
.fav-modal-quote:last-child { margin-bottom: 0; }
.fav-modal-facts { margin-bottom: 1.4rem; }
.fav-modal-fact {
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem; color: var(--text);
  padding: .4rem 0; border-bottom: 1px solid var(--border);
}
.fav-modal-fact:last-child { border-bottom: none; }
.fav-modal-fact span {
  display: inline-block; min-width: 100px;
  color: var(--text-dim);
}
.fav-modal-titles-title {
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text-dim); margin: 0 0 .7rem;
}
/* 140px, а не 120: в 120-пиксельной карточке подпись оценки рядом с
   годом обрезалась до «Резона…». */
.fav-modal-titles-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
/* «Персонажи · в любимом» в модалке отзыва (appendReviewLinkedFavorites). */
.review-linked-favs { margin: 1.6rem 0 .4rem; }
.review-linked-favs .fav-modal-titles-grid { margin-bottom: 1.2rem; }

/* Пустая анкета персонажа – подсказка владельцу (favEmptyProfileHtml). */
.fav-empty-profile {
  margin: 0 0 1.4rem; padding: .9rem 1.1rem;
  border: 1px dashed var(--border2); border-radius: 4px;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text-dim);
}
.fav-empty-profile a {
  flex: none; color: var(--text-hi); text-decoration: none; font-weight: 500;
  border: 1px solid var(--border2); border-radius: var(--radius-btn, 2px); padding: .4rem .8rem;
  transition: border-color .2s;
}
.fav-empty-profile a:hover { border-color: var(--red-hi); }

/* «Персоны» разделами по ролям (favPersonsByRoleHtml) – заголовок
   раздела занимает всю строку той же сетки. */
.fav-role-head {
  grid-column: 1 / -1;
  display: flex; align-items: baseline; gap: .6rem;
  margin: 1.4rem 0 .2rem; padding-bottom: .4rem;
  border-bottom: 1px solid var(--border);
  font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.15rem;
  color: var(--text-hi);
}
.fav-role-head:first-child { margin-top: 0; }

/* ══ TAGS ════════════════════════════════════════ */
.rtag {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .55rem;
  border-radius: 1px;
  font-weight: 400;
  letter-spacing: .03em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
.rtag-visual, .rtag-plot, .rtag-chars, .rtag-special, .rtag-genre {
  background: var(--tint);
  color: var(--text);
  border: 1px solid var(--tint-line);
}
.rtag-custom {
  background: color-mix(in srgb, var(--tag-color, var(--text-hi)) 12%, transparent);
  color: var(--tag-color, var(--text));
  border: 1px solid color-mix(in srgb, var(--tag-color, var(--text-hi)) 30%, transparent);
}

/* ══ GRADE ═══════════════════════════════════════ */
.grade-chip {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gc);
  cursor: default; position: relative;
  white-space: nowrap;
  /* Обычный <div> без display – блочный, тянется на всю ширину
     родителя. В классической теме у .grade-chip нет ни фона, ни рамки,
     и этого не видно – текст просто стоит слева, пустая часть строки
     не бросается в глаза. У «рисованной» и неоморфизма chip получает
     свои фон/рамку/тень (themes.css), и та же самая пустая растянутая
     область превращается в заметную полосу через всю карточку.
     display: inline-block – чтобы ширина всегда шла ровно по
     содержимому, а не по родителю, в любой теме. Раньше здесь ещё
     стоял min-width: 80px (с тех же времён, когда без inline-block он
     ничего не решал) – с ним у коротких названий полки («Брак»,
     «Эталон») та же самая пустота оставалась, просто размером поменьше;
     раз ширина теперь и так по содержимому, свой минимум ей задавать
     незачем. flex-grow тоже был не нужен уже сейчас: единственный
     родитель chip – обычный блочный <div> в шапке модалки отзыва
     (reviewModalBodyHtml), не flex-контейнер, свойство ни на что не
     влияло и раньше.
  */
  display: inline-block;
}
/* ══ SOURCE BUTTONS ══════════════════════════════ */
.source-buttons { display: flex; gap: .4rem; flex-shrink: 0; }
.review-source-link {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .75rem; border-radius: 1px;
  flex-shrink: 0; white-space: nowrap;
  text-decoration: none;
  transition: background .2s, color .2s, border-color .2s;
  border: 1px solid;
}
.source-teletype { background: var(--tint); border-color: var(--tint-line); color: var(--text-dim); }
.source-teletype:hover { background: var(--tint-hi); border-color: var(--tint-line-hi); color: var(--text); }
.source-other    { background: var(--accent-wash);  border-color: var(--accent-fill-hi);  color: var(--red); }
.source-other:hover    { background: var(--accent-fill-hi);  border-color: var(--red-hi);   color: var(--red-hi); }

.source-dot-teletype { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
.source-dot-other    { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--red); }

/* ══ EDIT BUTTON ═════════════════════════════════ */
.review-edit-btn {
  position: absolute; top: -10px; right: -10px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-dim); font-size: .85rem;
  display: none; align-items: center; justify-content: center;
  text-decoration: none; transition: all .18s;
}
.review-card-wrap:hover .review-edit-btn { display: flex; }
.review-edit-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--text-hi); }
.review-card-wrap .card { height: 100%; }

/* ══ STATS ═══════════════════════════════════════
   Разметка – js/stats.js (statsRender). Всё резиновое:
   – #tab-stats – контейнер (container queries), раскладка карточек
     зависит от его ширины, а не от экрана;
   – --sxu – общая для всей вкладки единица размера (0.55% её ширины),
     зарегистрирована через @property, поэтому превращается в пиксели на
     .sx и наследуется готовым числом: текст и графики во ВСЕХ карточках
     одного размера, узкая карточка не мельчит свои строки;
   – clamp() держит нижнюю и верхнюю границу, чтобы на телефоне не было
     мелко, а на большом мониторе – гигантски;
   – на 2K/4K при масштабе 100% вкладка увеличивается целиком (zoom) и
     занимает ширину экрана, а не стоит узкой колонкой посередине.
   Карточки одного ряда – одной высоты, строки внутри распределяются по
   всей высоте: у соседки покороче не остаётся пустого низа.
   Оформление карточек в темах – через общие .stat-card/.section-title
   (themes.css), поэтому .sx-card – это ещё и .stat-card. */
#tab-stats { container: sxroot / inline-size; }
@property --sxu { syntax: "<length>"; inherits: true; initial-value: 8px; }

.stat-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: clamp(1.4rem, 2cqi, 2.6rem); }
.stat-year-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 0; }

.stat-grid.sx {
  --sxu: .55cqi;
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(.9rem, 1.3cqi, 2.2rem);
}
.sx .sx-card {
  grid-column: span 6; min-width: 0; margin: 0;
  display: flex; flex-direction: column;
  padding: clamp(1rem, 1.5cqi, 2.6rem) clamp(1.1rem, 1.7cqi, 2.8rem);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius, 6px);
  animation: fadeUp .4s ease both;
}
.sx .sx-card.w12, .sx .sx-card.sx-solo { grid-column: 1 / -1; }
.sx .sx-card.w7 { grid-column: span 7; }
.sx .sx-card.w5 { grid-column: span 5; }
.sx .sx-card .section-title.sx-h {
  margin: 0 0 .3rem; font-size: clamp(1.1rem, calc(3.4 * var(--sxu)), 2rem);
}
.sx-explain {
  margin: 0 0 clamp(.9rem, calc(2.4 * var(--sxu)), 1.8rem); max-width: 90ch;
  font-family: 'DM Sans', sans-serif; font-size: clamp(.74rem, calc(1.9 * var(--sxu)), 1rem);
  line-height: 1.5; color: var(--text-dim);
}
.sx-empty { font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text-dim); }

/* общие кусочки: полоса, подпись полки, легенда */
.sx-bar { display: block; height: clamp(8px, calc(1.5 * var(--sxu)), 16px); border-radius: 99px; background: var(--surface2); overflow: hidden; }
.sx-bar i { display: block; height: 100%; border-radius: 99px; background: var(--tc, var(--red-hi)); }
.sx-bar-wrap { display: block; min-width: 0; }
.sx-bar-stack { display: flex; height: clamp(10px, calc(1.7 * var(--sxu)), 18px); }
.sx-bar-stack i { border-radius: 0; }
.sx-grade {
  display: flex; align-items: center; gap: .45rem; white-space: nowrap; min-width: 0;
  font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
  font-size: clamp(.9rem, calc(2.4 * var(--sxu)), 1.45rem); color: var(--text-hi);
}
.sx-grade::before {
  content: ''; flex: none; transform: rotate(45deg); background: var(--gc);
  width: clamp(6px, calc(1 * var(--sxu)), 10px); height: clamp(6px, calc(1 * var(--sxu)), 10px);
}
.sx-grade small { font-family: 'DM Sans', sans-serif; font-style: normal; font-weight: 400; font-size: clamp(.62rem, calc(1.5 * var(--sxu)), .85rem); color: var(--text-dim); }
.sx-legend { display: flex; flex-wrap: wrap; gap: .4rem clamp(.8rem, calc(2 * var(--sxu)), 1.6rem); margin-bottom: 1rem; font-family: 'DM Sans', sans-serif; font-size: clamp(.7rem, calc(1.3 * var(--sxu)), 1rem); color: var(--text); }
.sx-legend span { display: inline-flex; align-items: center; gap: .4rem; }
.sx-legend i, .sx-type-name i { flex: none; width: clamp(8px, calc(1.3 * var(--sxu)), 13px); height: clamp(8px, calc(1.3 * var(--sxu)), 13px); border-radius: 2px; background: var(--tc); }
.sx-type-name, .sx-row-name, .sx-decade-lbl, .sx-grow-n, .sx-type-n {
  font-family: 'DM Sans', sans-serif; font-size: clamp(.8rem, calc(2.3 * var(--sxu)), 1.25rem); color: var(--text-hi);
}
.sx-grow-n, .sx-type-n { text-align: right; font-variant-numeric: tabular-nums; }
.sx-type-n small { display: block; font-size: clamp(.62rem, calc(1.5 * var(--sxu)), .85rem); color: var(--text-dim); }
.sx-row-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* строки растягиваются на всю высоту карточки */
.sx-types, .sx-grades, .sx-rows, .sx-decades, .sx-people, .sx-rewatch {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  gap: clamp(.45rem, calc(1.6 * var(--sxu)), 1.1rem);
}
/* Люди и пересмотры – списки переменной длины: при двух записях
   растягивание разнесло бы их к верху и низу карточки. */
.sx-people, .sx-rewatch { flex: 0 0 auto; justify-content: flex-start; gap: clamp(.6rem, calc(1.8 * var(--sxu)), 1.2rem); }
.sx-type { display: grid; align-items: center; grid-template-columns: minmax(5.5rem, 17%) minmax(0, 1fr) minmax(2.6rem, 8%) minmax(7rem, 21%); gap: clamp(.6rem, calc(2 * var(--sxu)), 1.6rem); }
.sx-type-name { display: flex; align-items: center; gap: .5rem; }
.sx-grow { display: grid; align-items: center; grid-template-columns: minmax(7rem, 26%) minmax(0, 1fr) minmax(2rem, 7%); gap: clamp(.6rem, calc(2 * var(--sxu)), 1.6rem); }
.sx-row { display: grid; align-items: center; grid-template-columns: minmax(7rem, 30%) minmax(0, 1fr) minmax(7rem, 28%); gap: clamp(.6rem, calc(2 * var(--sxu)), 1.6rem); }
.sx-decade { display: grid; align-items: center; grid-template-columns: minmax(4rem, 12%) minmax(0, 1fr) minmax(2rem, 6%); gap: clamp(.6rem, calc(2 * var(--sxu)), 1.6rem); }

/* Раскрывающиеся строки (js/stats.js, data-stat-expand): тип → сколько
   на каждой полке, десятилетие → по годам. Подсказки текстом нет
   (вкладкой делятся снимком) – стрелка у названия видна при наведении
   и у раскрытой строки. .sx-expand – обёртка «строка + раскрытая
   часть»: она и есть элемент колонки, растянутой на высоту карточки. */
.sx-expand { display: flex; flex-direction: column; }
[data-stat-expand] { cursor: pointer; border-radius: 3px; }
[data-stat-expand]:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 3px; }
[data-stat-expand] :is(.sx-type-name, .sx-decade-lbl)::after {
  content: ""; flex: none; display: inline-block; width: 6px; height: 6px; margin-left: .45rem;
  border-right: 1.5px solid var(--text-dim); border-bottom: 1.5px solid var(--text-dim);
  transform: rotate(-45deg); opacity: 0; transition: opacity .15s, transform .15s;
  vertical-align: .15em;
}
@media (hover: hover) {
  [data-stat-expand]:hover :is(.sx-type-name, .sx-decade-lbl)::after { opacity: .9; }
}
[data-stat-expand][aria-expanded="true"] :is(.sx-type-name, .sx-decade-lbl)::after { opacity: .9; transform: rotate(45deg); }
.sx-detail {
  display: flex; flex-direction: column; gap: clamp(.3rem, calc(1 * var(--sxu)), .7rem);
  margin: clamp(.4rem, calc(1.2 * var(--sxu)), .9rem) 0 clamp(.3rem, calc(1 * var(--sxu)), .6rem);
  padding-left: clamp(.8rem, calc(2.4 * var(--sxu)), 1.6rem);
  border-left: 1px solid var(--border2);
}
.sx-detail[hidden] { display: none; }
.sx-detail .sx-grade, .sx-decade-year .sx-decade-lbl, .sx-detail .sx-grow-n {
  font-size: clamp(.78rem, calc(1.9 * var(--sxu)), 1.05rem);
}

/* шапка: вкус в трёх словах + числа по типам (от ширины вкладки) */
.sx .sx-hero {
  grid-column: 1 / -1; margin: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(1rem, 2cqi, 3rem); align-items: center;
  padding: clamp(1.3rem, 2.4cqi, 3.6rem) clamp(1.3rem, 2.6cqi, 4rem);
  border: 1px solid var(--border); border-radius: var(--card-radius, 6px);
  background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--red) 22%, transparent), transparent 55%), var(--surface);
  animation: fadeUp .4s ease both;
}
/* Заголовок шапки не виден – по нему подписан пункт в окне выбора
   блоков для снимка («Всего» / «Итоги 2026»). */
.sx-hero .sx-hero-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
.sx-kicker { font-family: 'DM Sans', sans-serif; font-size: clamp(.64rem, .75cqi, .95rem); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
.sx-words { margin-top: .55rem; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: clamp(1.6rem, 3.5cqi, 4.6rem); line-height: 1.15; color: var(--text-hi); }
.sx-words span + span::before { content: ' · '; color: var(--red-hi); font-style: normal; }
.sx-line { margin-top: .8rem; max-width: 70ch; font-family: 'DM Sans', sans-serif; font-size: clamp(.85rem, 1cqi, 1.3rem); line-height: 1.55; color: var(--text); }
.sx-line b { color: var(--text-hi); font-weight: 500; }
.sx-covers { display: flex; padding-right: .5rem; }
.sx-covers img { width: clamp(70px, 7.5cqi, 210px); aspect-ratio: 2/3; object-fit: cover; border-radius: 3px; border: 1px solid var(--border2); box-shadow: 0 10px 30px var(--shadow, rgba(0,0,0,.5)); }
.sx-covers img + img { margin-left: calc(clamp(70px, 7.5cqi, 210px) * -0.42); }
.sx-covers img:nth-child(2) { transform: translateY(-10px); }
.sx-covers img:nth-child(3) { transform: translateY(-20px); }
.sx-total { grid-column: 1 / -1; padding-top: clamp(1rem, 1.6cqi, 2.2rem); border-top: 1px solid var(--border); }
.sx-total.solo { padding-top: 0; border-top: 0; }
.sx-total-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: .8rem; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: clamp(2.6rem, 5cqi, 6.5rem); line-height: 1; color: var(--text-hi); }
.sx-total-big span { font-family: 'DM Sans', sans-serif; font-style: normal; font-weight: 500; font-size: clamp(.7rem, .9cqi, 1.15rem); letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); }
.sx-total-big small { font-family: 'DM Sans', sans-serif; font-style: normal; font-size: clamp(.7rem, .9cqi, 1.15rem); color: var(--ok); }
.sx-total-big small.down { color: var(--err); }
.sx-tcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(78px, 9cqi, 220px), 1fr)); margin-top: clamp(.9rem, 1.4cqi, 2rem); border: 1px solid var(--border); border-radius: 3px; }
.sx-tc { padding: clamp(.7rem, 1.2cqi, 1.8rem) .4rem; text-align: center; border-right: 1px solid var(--border); }
.sx-tc:last-child { border-right: 0; }
.sx-tc-val { font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(1.35rem, 2.5cqi, 3.4rem); line-height: 1; }
.sx-tc-lbl { margin-top: .35rem; font-family: 'DM Sans', sans-serif; font-size: clamp(.58rem, .75cqi, .95rem); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

/* по годам просмотра */
.sx-years { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; height: clamp(160px, calc(30 * var(--sxu)), 440px); gap: clamp(.3rem, calc(1 * var(--sxu)), 1.2rem); }
.sx-year { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: .35rem; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
.sx-year-stack { display: flex; flex-direction: column-reverse; min-height: 2px; border-radius: 3px 3px 0 0; overflow: hidden; }
.sx-year-stack i { display: block; background: var(--tc); }
.sx-year:hover .sx-year-stack, .sx-year:focus-visible .sx-year-stack { filter: brightness(1.15); }
.sx-year-lbl { display: block; text-align: center; font-family: 'DM Sans', sans-serif; font-size: clamp(.62rem, calc(1.1 * var(--sxu)), 1rem); line-height: 1.25; color: var(--text-dim); }
.sx-year-lbl b { display: block; font-weight: 500; font-size: clamp(.72rem, calc(1.3 * var(--sxu)), 1.2rem); color: var(--text-hi); }

/* теги, пересмотры, лицо вкуса, люди, персонажи */
.sx-tags { display: flex; flex-wrap: wrap; align-content: flex-start; gap: clamp(.35rem, calc(1.2 * var(--sxu)), .8rem); position: relative; }
/* Теги заполняют карточку целиком (statsFitTags в js/stats.js): с
   flex-basis 0 список не влияет на высоту ряда сетки – карточка
   тянется до соседней, а список – на всё оставшееся в ней место; что
   не влезло целиком, прячется (.sx-tag-off). Одна в ряду – обычная
   высота по содержимому. */
.sx .sx-card[data-stat-key="tags"]:not(.sx-solo) .sx-tags { flex: 1 1 0; min-height: 5.5rem; overflow: hidden; }
.sx-tags .sx-tag.sx-tag-off { display: none; }
/* Цвет и рамку тегу даёт его категория (.rtag-* – как в отзывах),
   здесь – только размер под резиновую сетку. */
.sx-tags .sx-tag { display: inline-flex; align-items: baseline; gap: .4rem; padding: clamp(.25rem, calc(.8 * var(--sxu)), .55rem) clamp(.5rem, calc(1.6 * var(--sxu)), 1rem); border-radius: 3px; font-size: clamp(.76rem, calc(2.1 * var(--sxu)), 1.15rem); letter-spacing: 0; cursor: default; }
.sx-tags .sx-tag small { font-size: clamp(.62rem, calc(1.5 * var(--sxu)), .85rem); opacity: .65; }
.sx-rw, .sx-face, .sx-person, .sx-char { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.sx-rw { display: grid; grid-template-columns: clamp(32px, calc(6 * var(--sxu)), 60px) minmax(0, 1fr) auto; gap: .7rem; align-items: center; }
.sx-rw img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 2px; border: 1px solid var(--border); }
.sx-rw-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(.92rem, calc(2.6 * var(--sxu)), 1.35rem); color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-rw-n { font-family: 'DM Sans', sans-serif; font-size: clamp(.8rem, calc(2.3 * var(--sxu)), 1.25rem); color: var(--text); }
.sx-sum { margin-top: .9rem; font-family: 'DM Sans', sans-serif; font-size: clamp(.74rem, calc(1.9 * var(--sxu)), 1rem); color: var(--text-dim); }
.sx-faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(84px, calc(12 * var(--sxu)), 190px), 1fr)); gap: clamp(.5rem, calc(1.4 * var(--sxu)), 1.1rem); }
.sx-face img, .sx-char img { display: block; width: 100%; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); transition: border-color .2s; }
.sx-face img { aspect-ratio: 2/3; }
.sx-char img { aspect-ratio: 1/1; }
.sx-face:hover img, .sx-char:hover img { border-color: var(--border2); }
.sx-face span { display: block; margin-top: .3rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(.78rem, calc(1.7 * var(--sxu)), 1.1rem); line-height: 1.2; color: var(--text-hi); }
.sx-person { display: grid; grid-template-columns: clamp(38px, calc(8 * var(--sxu)), 72px) minmax(0, 1fr) auto; gap: .8rem; align-items: center; }
.sx-person img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 50%; border: 1px solid var(--border2); }
.sx-person-text { display: flex; flex-direction: column; min-width: 0; }
.sx-person-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(.95rem, calc(2.8 * var(--sxu)), 1.45rem); color: var(--text-hi); }
.sx-person-sub { font-family: 'DM Sans', sans-serif; font-size: clamp(.68rem, calc(1.7 * var(--sxu)), .95rem); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(96px, calc(10 * var(--sxu)), 210px), 1fr)); gap: clamp(.6rem, calc(1.4 * var(--sxu)), 1.2rem); }
.sx-char { display: flex; flex-direction: column; gap: .1rem; }
.sx-char img { margin-bottom: .25rem; }
.sx-char-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(.85rem, calc(1.3 * var(--sxu)), 1.2rem); line-height: 1.2; color: var(--text-hi); }
.sx-char-from { font-family: 'DM Sans', sans-serif; font-size: clamp(.64rem, calc(1 * var(--sxu)), .9rem); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-char .sx-grade { font-size: clamp(.8rem, calc(1.8 * var(--sxu)), 1.15rem); }

/* раскладка карточек – от ширины вкладки */
@container sxroot (max-width: 1000px) {
  .sx .sx-card, .sx .sx-card.w7, .sx .sx-card.w5 { grid-column: 1 / -1; }
}
@container sxroot (max-width: 640px) {
  .sx .sx-hero { grid-template-columns: minmax(0, 1fr); }
  .sx-covers { display: none; }
  .sx-tcs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sx-tc { border-bottom: 1px solid var(--border); }
  .sx-type { grid-template-columns: minmax(0, 1fr) auto; row-gap: .35rem; }
  .sx-type .sx-bar { grid-column: 1 / -1; grid-row: 2; }
  .sx-type .sx-type-n { display: none; }
  .sx-row { grid-template-columns: minmax(0, 1fr) auto; }
  .sx-row .sx-bar { display: none; }
  .sx-grow { grid-template-columns: minmax(6rem, 34%) minmax(0, 1fr) 2rem; }
}

/* Телефон: годы – одной строкой с прокруткой пальцем, камера – справа
   в той же строке, а не тремя строками кнопок над статистикой. */
@media (max-width: 700px) {
  #tab-stats .stat-toolbar { flex-wrap: nowrap; gap: .5rem; }
  #tab-stats .stat-year-filters {
    flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto;
    scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent);
  }
  #tab-stats .stat-year-filters::-webkit-scrollbar { display: none; }
  #tab-stats .stat-year-filters .tl-filter { flex: none; }
}

/* Очень широкие экраны (2K при масштабе 100%, 4K): вкладка
   увеличивается целиком, в пропорциях Full HD, и потолок ширины
   <main> (1800px) для статистики поднят соответственно.
   zoom масштабирует и top у прилипающей строки годов (.stat-toolbar,
   см. её же правило у .tl-mode-toggle): 38px полосы окна Electron
   превращались в 49px, и в щель между полосой и строкой при прокрутке
   было видно содержимое. Делим на тот же множитель – строка прилипает
   ровно под полосой. */
@media (min-width: 2300px) {
  main:has(> #tab-stats:not(.hidden)) { max-width: 2500px; }
  #tab-stats { zoom: 1.3; }
  main > #tab-stats > .stat-toolbar { top: calc(var(--app-titlebar, 0px) / 1.3); }
}
@media (min-width: 3200px) {
  main:has(> #tab-stats:not(.hidden)) { max-width: 3500px; }
  #tab-stats { zoom: 1.8; }
  main > #tab-stats > .stat-toolbar { top: calc(var(--app-titlebar, 0px) / 1.8); }
}

/* ══ TIERLIST ════════════════════════════════════ */
.tl-filters {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}
/* Шапка режима тир-листа (js/tierlist.js: tlTitlesHtml, tlCharsHtml):
   слева чипы типов/игр, справа «Редактор», «Подписи» и камера – одной
   высоты (32px) и одним шрифтом. flex-wrap только у чипов: иначе на
   узком экране кнопки справа целиком уезжали на отдельную строку. */
.tl-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; }
.tl-head-row > .tl-filters { min-width: 0; }
.tl-head-tools { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
.tl-head-tools #tl-export-btn { width: 32px; height: 32px; box-sizing: border-box; }
.tl-tool-btn,
#tab-tierlist .tl-head-tools .admin-add-btn {
  display: inline-flex; align-items: center; gap: .3rem;
  height: 32px; box-sizing: border-box; padding: 0 .7rem;
  font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 400;
  letter-spacing: 0; text-transform: none; white-space: nowrap;
  color: var(--text-dim); background: none;
  border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; text-decoration: none;
  transition: color .15s, border-color .15s, background .15s;
}
@media (hover: hover) {
  .tl-tool-btn:hover,
  #tab-tierlist .tl-head-tools .admin-add-btn:hover { color: var(--text-hi); border-color: var(--border2); }
}
.tl-tool-btn.active { color: var(--text-hi); background: var(--accent-fill); border-color: var(--accent-line); }

/* Игры коллекции – одной строкой с прокруткой (их бывает десяток). */
.tl-filters.tl-games { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.tl-filters .now-chip { flex-shrink: 0; white-space: nowrap; }

/* Годы – тихой строкой текста под чипами типов. */
.tl-years { display: flex; flex-wrap: wrap; gap: .15rem .9rem; margin: .45rem 0 1rem; }
/* На телефоне чипы типов и годы – тоже одной строкой с прокруткой:
   рядом с «Подписи» и камерой чипам остаётся полэкрана, и переносом
   они вставали в пять строк над первым же тиром. */
@media (max-width: 700px) {
  /* Кнопки («Редактор», «Подписи», камера) – своей строкой сверху
     справа, чипы – во всю ширину под ними: рядом с тремя кнопками
     играм персонажей оставалось место на один чип. */
  .tl-head-row { flex-wrap: wrap; gap: .5rem; }
  .tl-head-tools { order: -1; margin-left: auto; }
  .tl-head-row > .tl-filters { flex: 1 1 100%; }
  .tl-head-row > .tl-filters,
  .tl-years { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tl-head-row > .tl-filters::-webkit-scrollbar,
  .tl-years::-webkit-scrollbar { display: none; }
  .tl-year { flex-shrink: 0; }
}
.tl-year {
  font-family: 'DM Sans', sans-serif; font-size: .8rem;
  color: var(--text-dim); background: none; border: 0;
  border-bottom: 1px solid transparent; padding: .15rem 0; cursor: pointer;
}
@media (hover: hover) { .tl-year:hover { color: var(--text); } }
.tl-year.active { color: var(--text-hi); border-bottom-color: var(--red); }

/* Персонажи: списки игры слева, размер справа – одна строка вместо двух. */
.tl-char-sub { display: flex; align-items: center; gap: .6rem; margin: .4rem 0 1rem; }
.tl-char-sub .tl-char-lists { margin: 0; }
.tl-size { position: relative; margin-left: auto; }
.tl-size-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
  display: flex; align-items: center; gap: .7rem; width: 260px;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px;
  padding: .6rem .8rem; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
}
.tl-size-pop[hidden] { display: none; }
.tl-size-lbl { font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--text-dim); }
.tl-size-pop input { flex: 1; accent-color: var(--red); cursor: pointer; }

/* «Подписи»: название под обложкой тайтла (до двух строк) и имя поверх
   низа картинки персонажа – у них картинка во всю высоту, места под
   ней нет. Текст берётся из того же data-tl-title, что у подсказки. */
#tab-tierlist.tl-captions .tl-poster { overflow: visible; border-color: transparent; }
#tab-tierlist.tl-captions .tl-poster img { border: 1px solid var(--border); }
#tab-tierlist.tl-captions .tl-poster::after {
  content: attr(data-tl-title);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-family: 'DM Sans', sans-serif; font-size: .68rem; line-height: 1.25;
  color: var(--text-dim); margin-top: .3rem; min-height: 2.5em;
}
#tab-tierlist.tl-captions .tl-poster:hover { transform: none; }
#tab-tierlist.tl-captions .tl-poster:hover::after { color: var(--text-hi); }
#tab-tierlist.tl-captions .tl-char-poster::after {
  content: attr(data-tl-title);
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 1.2rem .35rem .3rem; text-align: center;
  font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-hi);
  background: linear-gradient(transparent, color-mix(in srgb, var(--surface) 92%, transparent));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Пустой тир – тонкая полоса, а не полная строка с «–»: при фильтре по
   году пустых бывает половина, и заполненные уезжали за экран. */
.tl-row-empty .tl-label { flex-direction: row; justify-content: flex-start; gap: .45rem; padding-top: .3rem; padding-bottom: .3rem; }
.tl-row-empty .tl-label-name { font-size: .85rem; opacity: .75; }
.tl-row-empty .tl-cards { min-height: 0; padding-top: .3rem; padding-bottom: .3rem; }
.tl-row-empty .tl-empty { padding: 0; font-size: .8rem; }

/* Классическая тема угловатая (вкладки, фильтры, метки тиров – 1–2px):
   круглые «таблетки» чипов и скруглённые кнопки в ней выбивались.
   Чипы те же, что в «Статусах» (.now-chip), – там они становятся
   угловатыми тоже, чтобы оба раздела выглядели одинаково. Другие темы
   оставляют своё скругление. */
:is(html:not([data-skin]), html[data-skin^="classic"]) .now-chip,
:is(html:not([data-skin]), html[data-skin^="classic"]) .tl-tool-btn,
:is(html:not([data-skin]), html[data-skin^="classic"]) #tab-tierlist .tl-head-tools .admin-add-btn,
:is(html:not([data-skin]), html[data-skin^="classic"]) .tl-head-tools #tl-export-btn,
:is(html:not([data-skin]), html[data-skin^="classic"]) .tl-size-pop,
:is(html:not([data-skin]), html[data-skin^="classic"]) .now-search,
:is(html:not([data-skin]), html[data-skin^="classic"]) .now-sort { border-radius: 2px; }
.tl-filter {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .4rem .9rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-filter:hover { color: var(--text); border-color: var(--border2); }
.tl-filter.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }

.tl-rows { display: flex; flex-direction: column; gap: .7rem; }

.tl-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: visible;
  animation: fadeUp .35s ease both;
  position: relative;
}
.tl-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--tl-color, var(--red-dim));
  opacity: .6;
}

/* 150px, а не 120: в 120 «Аттракцион» и «Разочарование» не помещались
   и рвались посреди слова («Аттракци‑он»). Перенос внутри слова
   (overflow-wrap ниже) остался только страховкой для своих длинных
   названий тиров персонажей, которые не влезут и в 150. */
.tl-label {
  width: 150px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem .7rem;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--tl-color, #888) 8%, var(--surface));
  position: relative;
  overflow: hidden;
  gap: .3rem;

}

.tl-label-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1rem;
  color: var(--tl-color, var(--text-hi));
  text-align: center;
  line-height: 1.2;
  overflow-wrap: break-word;
  word-break: normal;
  white-space: normal;
}
.tl-label-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  letter-spacing: .1em;
  color: var(--text-dim);
}

.tl-cards {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding: .7rem;
  background: var(--surface);
  min-height: 72px;
  align-content: flex-start;
}

.tl-empty {
  display: flex;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: .9rem;
  font-style: italic;
  color: var(--text-dim);
  padding: .5rem;
}

/* ── Постер в тир-листе ── */
.tl-poster {
  width: 100px;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s, z-index 0s;
  animation: fadeUp .25s ease both;
}
.tl-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-poster:hover::before { opacity: 1; width: 13px; height: 13px; }

.tl-poster img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  /* Было grayscale(.2) brightness(.82) – весь тир-лист выглядел мутным,
     будто под тёмной вуалью. Тот же почти нейтральный фильтр, что у
     карточек (.card img выше). */
  filter: brightness(.96);
  transition: filter .25s;
}
.tl-poster:hover img { filter: brightness(1.04); }

/* ── Тултип тир-листа – расширен и текст переносится ── */
.tl-tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .85rem 1.05rem;
  pointer-events: none;
  z-index: 9999;
  max-width: 260px;
  min-width: 160px;
  width: max-content;
  box-shadow: 0 12px 40px var(--shadow);
  opacity: 0;
  transition: opacity .12s;
}
.tl-tooltip.visible { opacity: 1; }

/* ── Быстрая панель «Размер шрифта»/«Масштаб» по правому клику
   (js/quick-appearance.js) ── */
.quick-appearance-menu {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: .85rem 1rem;
  z-index: 9999;
  box-shadow: 0 12px 40px var(--shadow);
  display: flex;
  flex-direction: column;
  gap: .6rem;
  min-width: 220px;
}
.qa-row { display: flex; align-items: center; gap: .6rem; }
.qa-label {
  font-family: 'DM Sans', sans-serif; font-size: .62rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim); flex-shrink: 0; width: 90px;
}
.qa-row input[type="range"] { flex: 1; accent-color: var(--red); cursor: pointer; }
.qa-value {
  font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); min-width: 34px; text-align: right;
}
.qa-reset {
  align-self: flex-start; background: none; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .65rem; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-dim); padding: 0; text-decoration: underline;
  text-underline-offset: 2px;
}
.qa-reset:hover { color: var(--red-hi); }
.tl-tt-title {
  font-family: 'Playfair Display', serif;
  font-size: .92rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.3;
  margin-bottom: .28rem;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
}
.tl-tt-grade {
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-style: italic; font-weight: 600;
  margin-bottom: .2rem;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem; color: var(--text-dim);
  font-style: italic; line-height: 1.5;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-meta {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; color: var(--text-dim);
  margin-top: .28rem; letter-spacing: .04em;
  white-space: normal;
  overflow-wrap: break-word;
}

/* ══ MOBILE TIERLIST – ИСПРАВЛЕНО ════════════════ */
@media (max-width: 600px) {
  .tl-label {
    width: 68px;
    padding: .6rem .35rem;
  }
  .tl-label-name { font-size: .72rem; }
  .tl-label-count { font-size: .5rem; }

  .tl-poster { width: 70px; }

  .tl-cards {
    gap: .35rem;
    padding: .5rem .45rem;
    min-height: 60px;
  }

  .tl-tooltip {
    max-width: calc(100vw - 24px);
    min-width: 160px;
  }

  .tl-filter {
    font-size: .58rem;
    padding: .32rem .7rem;
  }

  /* На телефоне 2.5rem полей с каждой стороны съедали пятую часть экрана,
     а обложка в 150px оставляла тексту отзыва колонку в два слова. */
  main { padding-left: 1.1rem; padding-right: 1.1rem; }
  .review-top { gap: .8rem; padding: .9rem; }
  .review-cover-col { width: 108px; }
}

/* ══ REVIEW FILTERS ══════════════════════════════ */
.rv-filter-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem;
}
.rv-filter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 70px;
  flex-shrink: 0;
}
.rv-filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .76rem;
  padding: .3rem .75rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .03em;
}
.rv-filter-btn:hover { color: var(--text); border-color: var(--border2); }
.rv-filter-btn.active {
  background: var(--accent-fill);
  border-color: var(--red);
  color: var(--text-hi);
}
.rv-search-input {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  padding: .28rem .75rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-hi);
  outline: none;
  width: 180px;
  transition: border-color .2s, background .2s;
  letter-spacing: .02em;
}
.rv-search-input:focus {
  border-color: var(--red);
  background: var(--bg2);
}
.rv-search-input::placeholder {
  color: var(--text-dim);
}
/* ══ ADMIN ADD BUTTON ════════════════════════════ */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
