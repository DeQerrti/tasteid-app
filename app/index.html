<!DOCTYPE html>
<html lang="ru">
<head>
<script>
// Тема из кэша — синхронно, до первой отрисовки. theme.js ниже тоже её
// применяет, но только после fetch("/site-settings.json") — а это сеть,
// пусть и локальная. При быстрой повторной навигации (пара кликов по
// логотипу подряд) окно между первой отрисовкой и ответом сервера иногда
// растягивается настолько, что на долю секунды видна тема по умолчанию
// из :root, прежде чем встанет настоящая. localStorage читается без
// сети, поэтому успевает всегда. Ключ пишет и обновляет applyTheme() в
// theme.js.
(function () {
  try {
    var cached = JSON.parse(localStorage.getItem("tasteid-skin-cache"));
    if (!cached) return;
    if (cached.skin) document.documentElement.setAttribute("data-skin", cached.skin);
    if (cached.declarations) {
      var s = document.createElement("style");
      s.id = "theme-overrides";
      s.textContent = ":root { " + cached.declarations + " }";
      document.head.appendChild(s);
    }
  } catch {}
})();
</script>

<style>
/* ══ NOIR PALETTE ════════════════════════════════ */

/* ══ HEADER ══════════════════════════════════════ */

/* ══ ОБОЛОЧКА: БОКОВАЯ ПАНЕЛЬ ═════════════════════
   Раньше здесь был бренд-хиро на всю ширину (логотип, подзаголовок,
   декоративные точки) и под ним — горизонтальная строка вкладок,
   пришитая к верху. Это работало как первая страница сайта: витрина,
   которую видят один раз. Для окна, которое открывают по многу раз в
   день, это означало заново скроллить мимо одного и того же хиро на
   каждой перезагрузке — и вкладки, актуальные только на десктопе.

   Ниже — тот же приём, что уже работает в settings-edit.html
   (#sidebar): липкая колонка слева, а не строка сверху. Логотип
   переиспользует класс .logo — он же нужен JS-перехвату клика на
   логотипе (см. скрипт в конце файла), поэтому просто переопределяем
   его размер здесь, а не заводим новый класс. */
body { display: flex; }

nav#rail {
  width: 236px; flex: 0 0 auto;
  display: flex; flex-direction: column;
  padding: 18px 14px;
  border-right: 1px solid var(--border);
  background: var(--nav-bg);
  position: sticky; top: 0;
  /* var(--app-titlebar) — только в Electron: chrome.js поднимает верх
     колонки ниже полосы для перетаскивания окна (см. её же комментарий
     про top у nav). В браузере и на телефоне переменная не задана,
     calc() тогда просто вычитает 0. */
  height: calc(100vh - var(--app-titlebar, 0px));
  overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
}

/* Растягивание рельсы мышью — см. js/utils.js, makeResizablePanel().
   Полоска на 3px шире своей видимой части (border-right у самой nav)
   — чтобы попасть курсором было проще, чем в ровно 1px. */
.rail-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 5;
}

/* Логотип и подпись под ним — один визуальный блок с одной чертой
   снизу, а не два раздельных (раньше у каждого была своя граница и
   свой отступ, а между ними — отрицательный margin, чтобы стянуть их
   обратно: две линии почти впритык читались как двойная рамка). */
nav#rail .logo {
  font-size: 1.2rem;
  letter-spacing: .02em;
  display: block;
  padding: 4px 6px 2px;
}
.rail-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-dim);
  padding: 0 6px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}

.rail-tabs { display: flex; flex-direction: column; gap: 2px; }

.tab-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-dim);
  background: none;
  border: none;
  border-radius: 7px;
  /* Раньше left: подсветка неактивной вкладки не видна (background:
     none), поэтому смещение к краю не бросалось в глаза. Но стоило
     вкладке стать активной — background заливал всю ширину кнопки, а
     слово оставалось прижато к левому краю, и «вмятина» подсветки
     читалась заметно шире самого слова. Центр — по всем вкладкам сразу,
     а не только у активной: иначе при наведении текст на миг прыгал бы
     между двумя выравниваниями. Так уже сделано в рисованной теме —
     здесь то же самое стало базовым, а не только её особенностью. */
  text-align: center;
  padding: .6rem .7rem;
  cursor: pointer;
  transition: color .15s, background .15s;
  position: relative;
}
.tab-btn:hover { color: var(--text); background: var(--tint-hi); }
.tab-btn.active { color: var(--text-hi); background: var(--tint-hi); }
/* Ромб слева от активной вкладки раньше рисовался в базовой теме (не
   берётся символом '◆' из шрифта: ни один из самохостящихся файлов
   Cormorant Garamond не содержит этот знак, проверено по cmap, и
   браузер молча подставлял системный запасной — на Android он рисуется
   заметно крупнее и грубее, чем на компьютере). С центрированием текста
   выше он держался бы за левый край кнопки отдельно от слова, поэтому
   скрыт — ровно как во всех остальных темах, которые задают то же
   правило сами (themes.css). */
.tab-btn.active::before {
  display: none;
}

.rail-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

/* ── Полное сворачивание рельсы ──────────────────
   По просьбе из обратной связи: раздел можно свернуть целиком (место
   отдаётся контенту), а вернуть его — наведением у левого края, как
   автоскрытая панель задач Windows. Состояние живёт в localStorage —
   см. скрипт в конце файла (initRailCollapse).

   Приём: position: fixed снимает рельсу из flex-потока — main, будучи
   единственным оставшимся flex-элементом, сам растягивается на всю
   ширину, никакой отдельной правки под main не нужно. transform, а не
   left/width — так поверх скольжение анимируется дёшево (GPU), а не
   перекладкой макета на каждый кадр. */
.rail-collapse-btn {
  position: absolute; top: 16px; right: 10px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 5px;
  background: none; color: var(--text-dim);
  cursor: pointer;
}
.rail-collapse-btn:hover { color: var(--text); background: var(--tint-hi); }
.rail-collapse-btn svg { transition: transform .18s ease; }

body.rail-collapsed nav#rail {
  position: fixed; top: 0; left: 0;
  transform: translateX(-100%);
  z-index: 100;
  box-shadow: 4px 0 24px rgba(0, 0, 0, .25);
  transition: transform .16s ease;
}
body.rail-collapsed nav#rail.rail-peek { transform: translateX(0); }
body.rail-collapsed .rail-collapse-btn svg { transform: rotate(180deg); }

/* Полоска-ловушка у самого края экрана: рельса, когда свёрнута, уезжает
   за пределы окна transform'ом и наводить курсор больше не на что —
   эта полоска остаётся на месте и ловит подход мыши. Видна только
   свёрнутой рельсе; на телефоне сворачивания нет (см. медиа-запрос
   ниже), поэтому там её тоже нет. */
#rail-edge-trigger { display: none; }
body.rail-collapsed #rail-edge-trigger {
  display: block;
  position: fixed; top: 0; left: 0; bottom: 0; width: 10px;
  z-index: 99;
}

/* См. комментарий у #admin-settings-link в разметке ниже: без этого
   правила класс .hidden у ссылки ничего не делал. */
.hidden { display: none; }

#admin-settings-link {
  display: block;
  font-size: .85rem;
  padding: .5rem .7rem;
  color: var(--text-dim);
  text-decoration: none;
  border-radius: 7px;
}
#admin-settings-link:hover { color: var(--text); background: var(--tint-hi); }
/* #admin-settings-link задаёт свой display (нужен для паддингов —
   голая <a> строчная, паддинг сверху/снизу на ней визуально не
   работает), а это ID-селектор — специфичнее класса .hidden выше.
   Без явного переопределения тут .hidden ничего не скрывал бы на
   этой конкретной ссылке, специфичность есть специфичность: тот же
   приём, что уже применён к #mobile-fab-add.hidden ниже. */
#admin-settings-link.hidden { display: none; }
.admin-link-icon { display: none; }

/* Иконки вкладок и сама FAB скрыты на столе намеренно: в рельсе и так
   достаточно места под подпись целиком, а рисованный значок рядом с
   уже говорящим словом только грузит рельсу шире. Нужны они ровно там,
   где вкладки сжаты в пять узких стоблцов нижней панели — то есть
   только под мобильным медиа-запросом ниже. */
.tab-icon { display: none; }
#mobile-fab-add { display: none; }

/* Телефон. 236px рельсы там съедали бы больше половины ширины — как и
   в settings-edit.html при той же проблеме, но лечится иначе: там
   всего один экран за раз, а тут пять равноценных вкладок, к которым
   возвращаются по многу раз за сессию — им лучше подходит нижняя
   панель, приклеенная к низу экрана, чем прокручиваемая строка сверху
   (тот же паттерн, что в большинстве мобильных приложений). */
@media (max-width: 700px) {
  body { display: block; }

  nav#rail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: auto; height: auto;
    flex-direction: row; align-items: stretch;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    border-right: none; border-top: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 50;
  }
  /* .rail-foot больше не в этом списке: раньше вся нижняя часть
     рельсы (а с ней и единственная ссылка на /settings-edit) на
     телефоне пряталась целиком, и владелец сайта не мог попасть в
     настройки со своего телефона вообще никаким путём — CSS ниже
     превращает её в компактную иконку-кнопку с краю нижней панели,
     рядом с обычными вкладками, вместо того чтобы прятать. */
  nav#rail .logo, .rail-sub { display: none; }
  .rail-resize { display: none; }
  /* Сворачивание рельсы — история про широкий экран (много вертикали,
     мало горизонтали её жалко). На телефоне рельса и так превращается
     в нижнюю панель — сворачивать там нечего, а .rail-collapse-btn при
     невидимом логотипе была бы кнопкой в пустоте. */
  .rail-collapse-btn { display: none; }
  body.rail-collapsed nav#rail { position: fixed; transform: none; }
  #rail-edge-trigger { display: none !important; }

  .rail-tabs {
    flex-direction: row; flex: 1; gap: 0;
    /* Была версия с прокруткой (overflow-x: auto + минимальная ширина
       вкладки) — на деле неудобнее самого сжатия: чтобы увидеть
       последнюю вкладку, надо было ещё и знать, что полоску можно
       листать пальцем, а место с краю занимал плавающий FAB. Вместо
       этого вкладки снова просто ужимаются (flex:1, min-width:0,
       ниже), но не «до нечитаемого», как раньше без иконок, — сама
       иконка и текст под ней теперь тоже плавно уменьшаются (см.
       .tab-icon/.tab-label ниже, clamp() от ширины экрана), поэтому
       и на маленьком телефоне, и на планшете в этой же раскладке всё
       помещается без обрезки и без прокрутки. Скрытая через
       [hidden] (см. settings-edit → «скрыть вкладку») вкладка просто
       выпадает из ряда — оставшиеся при том же flex:1 сами растягиваются
       шире, отдельного кода на этот случай не нужно. */
  }
  .tab-btn {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
    /* vw, а не фиксированный размер — при прочих равных ширина вкладки
       прямо следует за шириной экрана (это в мобильной раскладке и
       есть ширина устройства целиком, здесь не бывает других широких
       соседей), так что планшет и маленький телефон получают разный,
       но всегда достаточный размер сами, без отдельных брейкпоинтов
       под конкретные устройства. */
    font-size: clamp(.56rem, 2.5vw, .68rem); letter-spacing: .01em;
    padding: .5rem .1rem;
    border-radius: 8px;
  }
  /* Раньше white-space/overflow/ellipsis висели прямо на .tab-btn — это
     работало, пока внутри был один текстовый узел. С иконкой кнопка
     стала flex-колонкой из двух детей, и обрезание переехало на сам
     текстовый span — на кнопке в целом эти свойства больше ничего не
     обрезают. Обрезание — подстраховка на случай очень длинной своей
     подписи (/settings-edit → labels.nav.*): сам текст к этому
     моменту уже уменьшен вместе с иконкой (clamp выше), до эллипсиса
     дело в обычных подписях не доходит. */
  .tab-label {
    max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab-icon {
    display: block;
    width: clamp(16px, 4.2vw, 20px); height: clamp(16px, 4.2vw, 20px);
    flex-shrink: 0;
  }
  .tab-btn.active::before {
    top: 1px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
  }

  /* ── Настройки в нижней панели ──────────────────
     .rail-foot больше не растягивается на всю высоту рельсы и не
     прижимается к низу через margin-top: auto (это было нужно только
     в вертикальной раскладке стола) — здесь это просто ещё один
     flex-элемент в общем ряду с вкладками, той же высоты, что и они,
     но flex: 0 0 auto — под одну иконку, не делит пространство
     поровну с пятью содержательными вкладками. */
  .rail-foot {
    margin-top: 0; padding-top: 0; border-top: none;
    flex: 0 0 auto;
    display: flex; align-items: stretch;
  }
  #admin-settings-link {
    display: flex; align-items: center; justify-content: center;
    width: 44px;
    padding: .5rem .2rem;
    border-radius: 8px;
  }
  #admin-settings-link.hidden { display: none; }
  /* Подпись прячем — по одной иконке в вытянутый квадрат текст уже
     не вписать так, чтобы он не наезжал на соседнюю вкладку. aria-label
     на самой ссылке (см. разметку) остаётся для скринридера. */
  .admin-link-label { display: none; }
  .admin-link-icon { display: block; width: 20px; height: 20px; }

  /* ── Плавающая кнопка «Добавить» ──────────────────
     Висит над нижней панелью, а не внутри неё — шестой вкладкой она
     не была бы: «Добавить» не раздел с собственным содержимым, а
     действие, и role="tab" ей не подходит по смыслу. Отступ снизу
     считает высоту самой панели (см. её же комментарий у nav#rail:
     padding 4px сверху и снизу + safe-area, плюс сама кнопка вкладки)
     с запасом, чтобы не наезжать на неё даже на iPhone с самой узкой
     жестовой полосой. */
  #mobile-fab-add {
    display: flex; align-items: center; justify-content: center;
    position: fixed;
    right: 16px;
    bottom: calc(68px + env(safe-area-inset-bottom));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--red);
    color: var(--text-hi);
    box-shadow: 0 6px 18px var(--shadow-soft);
    z-index: 51;
    transition: background .15s, transform .12s;
  }
  #mobile-fab-add:active { transform: scale(.94); }
  #mobile-fab-add.hidden { display: none; }
  #mobile-fab-add svg { width: 24px; height: 24px; }
}

/* Видимая рамка фокуса. Карточка отзыва теперь фокусируема
   (role="button" + tabindex), и без этого правила человек, идущий
   по странице с клавиатуры (по-настоящему Tab'ом — html.kb-nav,
   см. js/utils.js), не понимал бы, где находится. Мышиный клик её не
   рисует вообще: outline:none по умолчанию, а html.kb-nav включается
   только клавишей Tab и снимается любым кликом. */
.review-card-wrap:focus,
.review-modal-panel:focus {
  outline: none;
}
html.kb-nav .review-card-wrap:focus,
html.kb-nav .review-modal-panel:focus {
  outline: 2px solid var(--red-hi);
  outline-offset: 2px;
}

/* ══ LAYOUT ══════════════════════════════════════ */
main { flex: 1; min-width: 0; max-width: 1800px; margin: 0 auto; padding: 2.5rem 2.5rem 6rem; }
@media (max-width: 700px) {
  main { padding: 1.25rem 1rem calc(5.5rem + env(safe-area-inset-bottom)); }
}
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-hi);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}

.year-divider {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--border2);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.year-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
.year-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ══ GRIDS ═══════════════════════════════════════ */
.grid-now { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .grid-now { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars { display: grid; gap: .85rem; grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 860px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1100px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* Колонка 1fr — это minmax(auto, 1fr), и её нижняя граница считается по
   содержимому: что-то непереносимое внутри (длинное название, ссылка,
   имя файла) молча раздвигает колонку, а с ней и весь грид за пределы
   экрана. min-width: 0 у самих ячеек снимает это правило раз и
   навсегда — обрезка и перенос внутри карточки уже настроены (см.
   .card-title), и колонка обязана слушаться экрана, а не наоборот.
   Одна строка на все три грида: попадать в неё будут и будущие
   карточки, а не только те, где это уже вылезло. */
.grid-now > *, .grid-chars > *, .reviews-grid > * { min-width: 0; }

/* ══ CARDS ═══════════════════════════════════════ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: var(--card-border, 1px solid var(--border));
  border-radius: var(--card-radius, 2px);
  overflow: hidden;
  text-decoration: none;
  transition: border-color .25s, transform .25s, box-shadow .25s;
  position: relative;
  box-shadow: var(--card-shadow, none);
}
.card::before {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; top: 0; left: 0;
  width: 12px; height: 12px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card::after {
  content: '';
  display: var(--card-corner-display, block);
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover, var(--card-shadow, none));
}
.card:hover::before,
.card:hover::after {
  border-color: var(--red);
  width: 16px; height: 16px;
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
  filter: var(--card-img-filter, grayscale(.15) brightness(.9));
  transition: filter .3s;
  flex-shrink: 0;
}
.card:hover img { filter: var(--card-img-filter-hover, grayscale(0) brightness(.98)); }
.card-char img  { aspect-ratio: 1/1; }

.card-body {
  padding: .6rem .7rem .7rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
  /* Название без пробелов (ссылка вместо названия, ромадзи одним
     словом) не переносится нигде и распирает карточку до своей
     ширины. -webkit-line-clamp обрезает только на вид: минимальная
     ширина колонки грида считается по самому длинному слову, и одна
     такая запись растягивала весь грид далеко за экран. На телефоне
     этим утаскивало и нижнюю панель вкладок (она position: fixed, но
     ширина у неё от того же расползшегося макета), то есть переключать
     вкладки становилось нечем. */
  overflow-wrap: anywhere;
}
.card-meta {
  margin-top: auto;
  padding-top: .3rem;
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
.card-grade-inline {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem;
  font-style: italic;
  font-weight: 600;
}

/* ══ TYPE TAGS ═══════════════════════════════════ */
.type-tag {
  position: absolute; top: 0; right: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .55rem;
  z-index: 3;
  background: var(--badge-bg, var(--poster-scrim));
  backdrop-filter: blur(8px);
  border-radius: var(--radius-btn, 0px) 0 0 var(--radius-btn, 0px);
}
.tag-anime, .tag-manga, .tag-novel, .tag-movie, .tag-show, .tag-manual, .tag-book {
  color: var(--badge-text, var(--text-hi));
  border-bottom: 1px solid var(--badge-border, rgba(240,236,230,.18));
  border-left:   1px solid var(--badge-border, rgba(240,236,230,.18));
}

.watch-badge {
  position: absolute; top: 0; left: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; font-weight: 500;
  color: var(--badge-text-dim, rgba(240,236,230,.7));
  background: var(--badge-bg, var(--poster-scrim));
  border-bottom: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-right: 1px solid var(--badge-accent-border, var(--accent-fill-hi));
  border-radius: 0 var(--radius-btn, 0px) var(--radius-btn, 0px) 0;
  padding: .25rem .52rem;
  backdrop-filter: blur(8px);
  z-index: 3;
  max-width: calc(100% - 64px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.progress-line {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--red-hi);
  font-weight: 500;
}

/* ══ STATE ═══════════════════════════════════════ */
/* Оформление тем переехало в themes.css — там же лежат палитры
   и структурные отличия каждой темы. */


@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══ REVIEWS GRID ════════════════════════════════ */
/* minmax(0, 1fr), а не просто 1fr: колонка по умолчанию не даёт себе стать
   уже min-content своего содержимого, а карточка отзыва с обложкой в 150px
   и текстом внутри как раз шире экрана телефона — из-за этого вся страница
   уезжала вбок примерно на 20px. */
.reviews-grid { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .reviews-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .reviews-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .reviews-grid { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .reviews-grid { grid-template-columns: repeat(7, 1fr); } }

/* ══ REVIEW CARD ═════════════════════════════════
   Постер + минимум подписей — карточка теперь витрина для беглого
   просмотра коллекции, а не мини-статья. Внутри переиспользован .card
   (index.html, у него уже есть постер на всю карточку, оверлеи
   .type-tag/.watch-badge и поддержка всех тем) — та же система, что
   несёт карточки на вкладке «Статусы» (см. cards.js, manualCard).
   Полный текст отзыва по-прежнему открывается по клику — см. модалку
   (.review-modal-*, reviewModalBodyHtml). */
.review-card-wrap { position: relative; height: 100%; }
.review-card-wrap { cursor: pointer; }

.card-grade-row {
  display: flex; align-items: center; gap: .4rem;
  margin-top: .3rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-weight: 600; font-style: italic;
  color: var(--text-hi);
}
/* Тот же приём отрисовки, что у .tab-btn.active::before (index.html) —
   не символ шрифта, а повёрнутый на 45° квадрат, чтобы отпечаток не
   зависел от того, какой шрифт стоит на конкретном устройстве. */
.card-grade-dot {
  width: 6px; height: 6px;
  border-radius: 1px;
  transform: rotate(45deg);
  background: var(--gc);
  flex-shrink: 0;
}

.card-fav {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  color: var(--text-dim);
  margin-top: .25rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-fav span { color: var(--text); }

.card-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .4rem; }
.card-tags .rtag { font-size: .6rem; padding: .16rem .45rem; }

/* Нужен только модалке (reviewModalBodyHtml) — в самой карточке
   счётчик пересмотров теперь показан оверлеем .watch-badge. */
.review-rewatch {
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: .25rem .6rem;
  text-align: center;
}

.review-modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 24px;
}
.review-modal-overlay.hidden { display: none; }
.review-modal-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  max-width: 680px;
  width: 100%;
  max-height: 86vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  animation: fadeUp .25s ease both;
}
.review-modal-header {
  display: flex; gap: 1.2rem;
  margin-bottom: 1.4rem;
  padding-right: 40px;
}
.review-modal-cover {
  width: 90px; flex-shrink: 0;
  aspect-ratio: 2/3; object-fit: cover;
  border: 1px solid var(--border2);
  filter: grayscale(.1) brightness(.88);
}
.review-modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 600;
  color: var(--text-hi);
  margin-bottom: .3rem;
}
.review-modal-tags {
  margin: 0 0 1.4rem;
}
.review-modal-tags .rtag {
  font-size: .72rem; padding: .22rem .55rem;
}
.review-modal-fulltext {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem; font-weight: 300;
  color: var(--text); line-height: 1.8;
  margin-bottom: 1.4rem;
}
.review-modal-fulltext p { margin: 0 0 1rem; }
.review-modal-fulltext p:last-child { margin-bottom: 0; }
.review-modal-nofull-hint {
  font-family: 'DM Sans', sans-serif !important;
  font-size: .8rem !important;
  color: var(--text-dim) !important;
}

/* ══ TAGS ════════════════════════════════════════ */
.rtag {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .55rem;
  border-radius: 1px;
  font-weight: 400;
  letter-spacing: .03em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
.rtag-visual, .rtag-plot, .rtag-chars, .rtag-special, .rtag-genre {
  background: var(--tint);
  color: var(--text);
  border: 1px solid var(--tint-line);
}
.rtag-custom {
  background: color-mix(in srgb, var(--tag-color, var(--text-hi)) 12%, transparent);
  color: var(--tag-color, var(--text));
  border: 1px solid color-mix(in srgb, var(--tag-color, var(--text-hi)) 30%, transparent);
}

/* ══ GRADE ═══════════════════════════════════════ */
.grade-chip {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gc); flex: 1;
  cursor: default; position: relative;
  min-width: 80px; white-space: nowrap;
}
/* ══ SOURCE BUTTONS ══════════════════════════════ */
.source-buttons { display: flex; gap: .4rem; flex-shrink: 0; }
.review-source-link {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .75rem; border-radius: 1px;
  flex-shrink: 0; white-space: nowrap;
  text-decoration: none;
  transition: background .2s, color .2s, border-color .2s;
  border: 1px solid;
}
.source-teletype { background: var(--tint); border-color: var(--tint-line); color: var(--text-dim); }
.source-teletype:hover { background: var(--tint-hi); border-color: var(--tint-line-hi); color: var(--text); }
.source-other    { background: var(--accent-wash);  border-color: var(--accent-fill-hi);  color: var(--red); }
.source-other:hover    { background: var(--accent-fill-hi);  border-color: var(--red-hi);   color: var(--red-hi); }

.source-dot-teletype { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
.source-dot-other    { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--red); }

/* ══ EDIT BUTTON ═════════════════════════════════ */
.review-edit-btn {
  position: absolute; top: -10px; right: -10px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-dim); font-size: .85rem;
  display: none; align-items: center; justify-content: center;
  text-decoration: none; transition: all .18s;
}
.review-card-wrap:hover .review-edit-btn { display: flex; }
.review-edit-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--text-hi); }
.review-card-wrap .card { height: 100%; }

/* ══ STATS ═══════════════════════════════════════ */
.stat-section { margin-bottom: 3.5rem; animation: fadeUp .4s ease both; }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.4rem;
}
.stat-grid .stat-card {
  margin-bottom: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.6rem 1.8rem;
  min-width: 0; /* allow children (year-bars-wrap etc.) to shrink inside grid cell */
}
.stat-grid .stat-card.wide { grid-column: 1 / -1; }
@media (max-width: 780px) {
  .stat-grid { grid-template-columns: 1fr; }
}

.stat-total { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 2rem; }
.stat-total-num {
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-style: italic;
  font-size: clamp(3.5rem, 8vw, 6rem);
  color: var(--text-hi); line-height: 1;
}
.stat-total-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem; letter-spacing: .2em;
  text-transform: uppercase; color: var(--text-dim);
}

.stat-counters { display: flex; flex-wrap: wrap; gap: 1px; border: 1px solid var(--border); }
.stat-rewatch-top {
  margin-top: 1.2rem;
  padding: .9rem 1.1rem;
  background: var(--tint);
  border: 1px solid var(--tint-line);
  border-radius: 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--text-dim);
}
.stat-rewatch-top b {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 600;
  color: var(--text-hi);
}
.stat-counter {
  flex: 1; min-width: 80px; padding: 1rem 1.2rem;
  background: var(--surface); text-align: center;
  border-right: 1px solid var(--border);
}
.stat-counter:last-child { border-right: none; }
.stat-counter-val {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 900; color: var(--text-hi); line-height: 1;
}
.stat-counter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim); margin-top: .35rem;
}

.stat-donut-wrap { display: flex; align-items: center; gap: 3rem; flex-wrap: wrap; }
.stat-donut-svg { width: 200px; height: 200px; flex-shrink: 0; }
.donut-center-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; fill: var(--text-hi); }
.donut-center-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; fill: var(--text-dim); }
.donut-legend { display: flex; flex-direction: column; gap: .65rem; }
.donut-legend-item { display: flex; align-items: center; gap: .6rem; font-family: 'DM Sans', sans-serif; font-size: .8rem; }
.donut-dot { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); flex-shrink: 0; }
.donut-legend-label { color: var(--text); flex: 1; }
.donut-legend-val   { color: var(--text-hi); font-weight: 500; min-width: 24px; text-align: right; }
.donut-legend-pct   { color: var(--text-dim); min-width: 36px; text-align: right; }

.year-bars-wrap {
  display: flex; align-items: flex-end; gap: 6px;
  overflow-x: auto; padding-bottom: .5rem;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
  min-height: 180px;
}
.year-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.year-bar-track {
  width: 32px; height: 140px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
}
.year-bar-stack {
  width: 100%;
  border-radius: 1px 1px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  min-height: 2px;
}
.year-bar-seg { width: 100%; min-height: 1px; }
.year-bar-val   { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); line-height: 1; }
.year-bar-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .05em; }

.grade-bars { display: flex; flex-direction: column; gap: .75rem; }
.grade-row  { display: flex; align-items: center; gap: 1rem; }
.grade-row-label { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; font-style: italic; min-width: 140px; text-align: right; flex-shrink: 0; }
.grade-row-track { flex: 1; height: 6px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
.grade-row-bar   { height: 100%; width: 0%; }
.grade-row-val   { font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--text-dim); min-width: 20px; text-align: right; }

.stat-tag-cloud { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.stat-tag { transition: opacity .2s, transform .2s; cursor: default; }
.stat-tag:hover { opacity: .8; transform: translateY(-1px); }
.stat-tag-cnt { font-size: .65em; opacity: .6; margin-left: .2em; }

/* ── Дайджест года ── */
.stat-year-filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 2.5rem; }

.year-spotlight-grid { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: flex-start; }
.year-spotlight-item { width: 160px; }
.year-spotlight-item .card {
  box-shadow: 0 0 0 1px var(--red-dim), 0 0 28px var(--accent-fill-hi);
}

.stat-export-row { margin-top: -1.5rem; margin-bottom: 3.5rem; }


/* ══ TIERLIST ════════════════════════════════════ */
.tl-filters {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.8rem;
}
.tl-year-select-wrap { margin: -1.2rem 0 1.8rem; }
.tl-year-select {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  letter-spacing: .03em;
  padding: .4rem .7rem;
  border-radius: 4px;
  cursor: pointer;
}
.tl-year-select:hover { border-color: var(--red); }
.tl-filter {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .4rem .9rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-filter:hover { color: var(--text); border-color: var(--border2); }
.tl-filter.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }

.tl-rows { display: flex; flex-direction: column; gap: .7rem; }

.tl-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: visible;
  animation: fadeUp .35s ease both;
  position: relative;
}
.tl-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--tl-color, var(--red-dim));
  opacity: .6;
}

.tl-label {
  width: 120px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem .7rem;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--tl-color, #888) 8%, var(--surface));
  position: relative;
  overflow: hidden;
  gap: .3rem;

}

.tl-label-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: .92rem;
  color: var(--tl-color, var(--text-hi));
  text-align: center;
  line-height: 1.2;
  overflow-wrap: break-word;
  word-break: break-word;
  white-space: normal;
}
.tl-label-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  letter-spacing: .1em;
  color: var(--text-dim);
}

.tl-cards {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding: .7rem;
  background: var(--surface);
  min-height: 72px;
  align-content: flex-start;
}

.tl-empty {
  display: flex;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: .9rem;
  font-style: italic;
  color: var(--text-dim);
  padding: .5rem;
}

/* ── Постер в тир-листе ── */
.tl-poster {
  width: 100px;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s, z-index 0s;
  animation: fadeUp .25s ease both;
}
.tl-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-poster:hover::before { opacity: 1; width: 13px; height: 13px; }

.tl-poster img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: grayscale(.2) brightness(.82);
  transition: filter .25s;
}
.tl-poster:hover img { filter: grayscale(0) brightness(.98); }

/* ── Тултип тир-листа — расширен и текст переносится ── */
.tl-tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .85rem 1.05rem;
  pointer-events: none;
  z-index: 9999;
  max-width: 260px;
  min-width: 160px;
  width: max-content;
  box-shadow: 0 12px 40px var(--shadow);
  opacity: 0;
  transition: opacity .12s;
}
.tl-tooltip.visible { opacity: 1; }
.tl-tt-title {
  font-family: 'Playfair Display', serif;
  font-size: .92rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.3;
  margin-bottom: .28rem;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
}
.tl-tt-grade {
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-style: italic; font-weight: 600;
  margin-bottom: .2rem;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem; color: var(--text-dim);
  font-style: italic; line-height: 1.5;
  white-space: normal;
  overflow-wrap: break-word;
}
.tl-tt-meta {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; color: var(--text-dim);
  margin-top: .28rem; letter-spacing: .04em;
  white-space: normal;
  overflow-wrap: break-word;
}

/* ══ MOBILE TIERLIST — ИСПРАВЛЕНО ════════════════ */
@media (max-width: 600px) {
  .tl-label {
    width: 68px;
    padding: .6rem .35rem;
  }
  .tl-label-name { font-size: .72rem; }
  .tl-label-count { font-size: .5rem; }

  .tl-poster { width: 70px; }

  .tl-cards {
    gap: .35rem;
    padding: .5rem .45rem;
    min-height: 60px;
  }

  .tl-tooltip {
    max-width: calc(100vw - 24px);
    min-width: 160px;
  }

  .tl-filter {
    font-size: .58rem;
    padding: .32rem .7rem;
  }

  /* На телефоне 2.5rem полей с каждой стороны съедали пятую часть экрана,
     а обложка в 150px оставляла тексту отзыва колонку в два слова. */
  main { padding-left: 1.1rem; padding-right: 1.1rem; }
  .review-top { gap: .8rem; padding: .9rem; }
  .review-cover-col { width: 108px; }
}

/* ══ REVIEW FILTERS ══════════════════════════════ */
.rv-filter-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem;
}
.rv-filter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 70px;
  flex-shrink: 0;
}
.rv-filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .65rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .03em;
}
.rv-filter-btn:hover { color: var(--text); border-color: var(--border2); }
.rv-filter-btn.active {
  background: var(--accent-fill);
  border-color: var(--red);
  color: var(--text-hi);
}
.rv-search-input {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  padding: .28rem .75rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text-hi);
  outline: none;
  width: 180px;
  transition: border-color .2s, background .2s;
  letter-spacing: .02em;
}
.rv-search-input:focus {
  border-color: var(--red);
  background: var(--bg2);
}
.rv-search-input::placeholder {
  color: var(--text-dim);
}
/* ══ ADMIN ADD BUTTON ════════════════════════════ */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}
.section-header .section-title {
  margin-bottom: 0;
  flex: 1;
}
.admin-add-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .3rem .75rem;
  text-decoration: none;
  transition: all .18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.admin-add-btn:hover {
  border-color: var(--red-dim);
  color: var(--red-hi);
}

/* ══ REVIEW TOOLBAR ══════════════════════════════ */
.rv-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.rv-filters {
  display: inline-flex;
  flex-direction: column;
  gap: .75rem;
  padding: 1.1rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
}
  /* ══ TIERLIST MODE TOGGLE ════════════════════════ */
.tl-mode-toggle {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.8rem;
}
@media (max-width: 700px) {
  /* На телефоне тут может оказаться несколько своих тир-листов
     (см. tl-mode-add-btn) плюс "Тайтлы" — без переноса и без
     прокрутки лишние кнопки просто уезжали бы за край экрана
     (body { overflow-x: hidden } прячет уехавшее, а не показывает
     по свайпу). Тот же приём, что у .rail-tabs на телефоне и у
     .side-tab в settings-edit: своя прокрутка со скрытой полосой,
     кнопки не сжимаются. */
  .tl-mode-toggle {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tl-mode-toggle::-webkit-scrollbar { display: none; }
  .tl-mode-btn, .tl-mode-add-btn { flex-shrink: 0; }
}
.tl-mode-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .55rem 1.4rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-mode-btn:hover { color: var(--text); border-color: var(--border2); }
.tl-mode-btn.active {
  color: var(--text-hi);
  border-color: var(--red);
  background: var(--surface2);
}
.tl-mode-add-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: 0 1rem;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-mode-add-btn:hover { color: var(--red-hi); border-color: var(--red-dim); }

/* ══ МОДАЛКА: новый тир-лист (коллекция) ═════════ */
.modal-overlay.hidden { display: none; }
.modal-close:hover { color: var(--text-hi); }
.modal .field { margin-bottom: 1rem; }
.modal .field label {
  font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .4rem;
}
.modal .field input[type="text"] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px;
  padding: .65rem .85rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; outline: none; transition: border-color .2s, background .2s;
}
.modal .field input[type="text"]:focus { border-color: var(--red); background: var(--bg2); }
.modal .btn-save {
  width: 100%; background: var(--accent-fill); border: 1px solid var(--accent-line);
  border-radius: 2px; color: var(--text-hi); font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700; font-style: italic; letter-spacing: .06em;
  padding: .8rem; cursor: pointer; transition: background .2s, border-color .2s;
}
.modal .btn-save:hover { background: var(--accent-fill-hi); border-color: var(--red); }
.modal .btn-save:disabled { opacity: .4; cursor: not-allowed; }
.modal .status-msg {
  font-family: 'DM Sans', sans-serif; font-size: .78rem; text-align: center;
  margin-top: .85rem; min-height: 1.2rem; letter-spacing: .03em;
}
.modal .status-msg.ok  { color: var(--green-hi); }
.modal .status-msg.err { color: var(--err); }

/* ── Переключатель тир-листов внутри игры ── */
.tl-char-lists {
  display: flex;
  gap: .4rem;
  margin-bottom: 1.4rem;
  flex-wrap: wrap;
}
.tl-list-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 1px;
  padding: .3rem .85rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-list-btn:hover { color: var(--text); border-color: var(--border2); }
.tl-list-btn.active {
  color: var(--text-hi);
  border-color: var(--red-dim);
  background: var(--surface2);
}

/* Постеры персонажей — квадратные (1/1 вместо 2/3) */
.tl-poster img.char-img {
  aspect-ratio: 1/1;
}
  /* ══ ПОСТЕРЫ ПЕРСОНАЖЕЙ В ТИР-ЛИСТЕ ════════════ */
.tl-char-poster {
  width: auto;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s;
  animation: fadeUp .25s ease both;
  /* Фон совпадает с фоном ряда — убирает "чёрные блоки" вокруг прозрачных PNG */
  background: var(--surface);
}
.tl-char-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-char-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-char-poster:hover::before { opacity: 1; width: 13px; height: 13px; }
.tl-char-poster img {
  height: 100%;
  width: auto;
  max-width: 100%;
  display: block;
  filter: grayscale(.15) brightness(.85);
  transition: filter .25s;
  background: var(--surface);
}
.tl-char-poster:hover img { filter: grayscale(0) brightness(.98); }

/* ══ РОУТЕР SPA (см. план перехода, фаза 2) ═══════
   #shell-root — рельса и вкладки, всё, что было в этом файле раньше.
   #view-root — куда роутер (js/router.js) подставляет содержимое
   отдельных маршрутов вроде #/reviews-order, вместо полной перезагрузки
   на отдельный HTML-файл. display: contents у #shell-root, а не просто
   div, — иначе рельса и <main> перестанут быть прямыми flex-детьми body
   (body { display: flex } выше) и раскладка сломается. */
#shell-root { display: contents; }
/* #shell-root.hidden, а не только .hidden — специфичность id-селектора
   (#shell-root) выше специфичности класса (.hidden) сама по себе, и
   правило display: contents выше побеждало бы обычный .hidden{display:
   none} независимо от порядка в файле: рельса оставалась в раскладке
   (просто «прозрачным» контейнером) поверх/рядом с показанным
   маршрутом — заметно на мобильной ширине, где рельса становится
   нижней панелью вкладок и никак не перекрывается видом маршрута. */
#shell-root.hidden { display: none; }
#view-root { flex: 1; min-width: 0; }

/* Маршрут #/reviews-order — та же вёрстка/CSS, что раньше жили в
   app/reviews-order.html (файл удалён в фазе 4 — вся его вёрстка и
   логика теперь здесь и в js/routes/reviews-order.js). .ro-view
   вместо голого main — иначе
   правило ниже задело бы <main> самой рельсы тоже, он остаётся в DOM
   (просто скрыт через #shell-root.hidden), пока активен другой маршрут. */
.ro-view { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

.dnd-grid {
  display: grid;
  gap: .75rem;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  margin-bottom: 2.5rem;
  min-height: 60px;
}
.dnd-item {
  position: relative;
  cursor: grab;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s, opacity .2s;
  user-select: none;
}
.dnd-item:active { cursor: grabbing; }
.dnd-item.dragging { opacity: .4; }
.dnd-item.drag-over { border-color: var(--red); box-shadow: 0 0 0 1px var(--red-dim); }
.dnd-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: brightness(.88);
  pointer-events: none;
}
.dnd-item-body { padding: .45rem .5rem .55rem; }
.dnd-item-title {
  font-family: 'Cormorant Garamond', serif; font-size: .85rem; font-weight: 600;
  color: var(--text-hi); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.dnd-item-type {
  font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim);
  margin-top: .2rem; text-transform: uppercase; letter-spacing: .08em;
}
.dnd-item-num {
  position: absolute; top: 4px; left: 4px; background: var(--poster-scrim);
  color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: .6rem;
  padding: .15rem .4rem; border-radius: 1px; pointer-events: none;
}
.save-bar { display: flex; align-items: center; gap: 1.5rem; margin-top: 1rem; }
.save-status { font-family: 'DM Sans', sans-serif; font-size: .78rem; }
.save-status.ok  { color: var(--green-hi); }
.save-status.err { color: var(--err); }

/* Маршрут #/chars-edit (см. план перехода, фаза 3.1) — та же вёрстка,
   что раньше жила в app/chars-edit.html. .ce-view вместо голого main —
   та же причина, что у .ro-view выше. .field/.status-msg/.modal ниже
   переопределены через #modal-overlay/#view-root, а не голым классом:
   у index.html эти же классы уже используются его собственными
   модалками (коллекция, горячие клавиши) — без такого прицела правки
   ниже задели бы и их тоже. */
.ce-view {
  max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 6rem;
  display: grid; grid-template-columns: 280px 1fr; gap: 2rem;
}
@media (max-width: 800px) { .ce-view { grid-template-columns: 1fr; } }

.sidebar { display: flex; flex-direction: column; gap: 1rem; }
.section-label {
  font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: .4rem;
}
.title-list { display: flex; flex-direction: column; gap: .35rem; }
.title-item {
  display: flex; align-items: center; gap: .6rem; padding: .55rem .75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.title-item:hover { border-color: var(--border2); }
.title-item.active { border-color: var(--red-dim); background: var(--surface2); }
.title-item-cover { width: 32px; height: 48px; object-fit: cover; border-radius: 1px; flex-shrink: 0; background: var(--surface2); }
.title-item-name { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; color: var(--text-hi); flex: 1; line-height: 1.3; }
.title-item-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .8rem; padding: .2rem; transition: color .15s; flex-shrink: 0; }
.title-item-del:hover { color: var(--red-hi); }
.title-item.dragging     { opacity: .35; }
.title-item.drag-over-up { border-top: 2px solid var(--red); }
.title-item.drag-over-dn { border-bottom: 2px solid var(--red); }
.title-item-edit { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .75rem; padding: .2rem; transition: color .15s; flex-shrink: 0; }
.title-item-edit:hover { color: var(--green-hi); }

.new-title-form { display: flex; flex-direction: column; gap: .5rem; padding: .85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; }
.new-title-form.hidden { display: none; }

.editor { display: flex; flex-direction: column; gap: 1.5rem; }
.editor-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.editor-title { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: 1.3rem; color: var(--text-hi); }

.list-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.list-tab {
  font-family: 'DM Sans', sans-serif; font-size: .62rem; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border);
  border-radius: 1px; padding: .3rem .75rem; cursor: pointer; transition: all .15s;
}
.list-tab:hover { color: var(--text); border-color: var(--border2); }
.list-tab.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }
.list-tab-add { color: var(--text-dim); border-style: dashed; }
.list-tab-add:hover { color: var(--green-hi); border-color: var(--green-hi); }

.tl-editor-rows { display: flex; flex-direction: column; gap: .6rem; }
.tl-editor-row {
  display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 2px; overflow: visible;
  position: relative; min-height: 90px;
}
.tl-editor-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--tl-color, var(--red-dim)); opacity: .6;
}
.tl-editor-label {
  width: 100px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: .75rem .5rem;
  border-right: 1px solid var(--border); background: var(--surface); gap: .3rem; position: relative;
}
.tl-editor-label::after { content: ''; position: absolute; inset: 0; background: var(--tl-color, #888); opacity: .12; pointer-events: none; }

.tl-label-input {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: .85rem;
  color: var(--tl-color, var(--text-hi)); text-align: center; background: none; border: none;
  outline: none; width: 100%; cursor: pointer; line-height: 1.2; padding: 0;
}
.tl-label-input:focus { background: var(--tint-hi); border-radius: 2px; }
.tl-color-input { width: 20px; height: 20px; border: 1px solid var(--border2); border-radius: 2px; padding: 0; cursor: pointer; background: none; }

.tl-editor-cards {
  flex: 1; display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem;
  background: var(--surface); align-content: flex-start; min-height: 90px; position: relative;
}
.tl-editor-cards.drag-over { background: var(--accent-wash); }

.drop-indicator {
  width: 2px; align-self: stretch; min-height: 72px; background: var(--red-hi);
  border-radius: 2px; flex-shrink: 0; pointer-events: none; opacity: .8;
}

.char-card {
  width: 72px; flex-shrink: 0; position: relative; cursor: grab;
  border-radius: 1px; overflow: hidden; border: 1px solid var(--border);
  transition: border-color .15s, transform .15s; background: var(--surface2); animation: ceFadeUp .2s ease both;
}
.char-card:active { cursor: grabbing; }
.char-card.dragging { opacity: .3; }
.char-card img { width: 100%; height: 108px; object-fit: contain; object-position: center top; display: block; filter: brightness(.85); pointer-events: none; background: var(--surface); }
.char-card-name { font-family: 'DM Sans', sans-serif; font-size: .52rem; color: var(--text); padding: .2rem .3rem; text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-card-del {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--poster-scrim); border: none; color: var(--text-dim); font-size: .65rem; cursor: pointer;
  display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; transition: color .15s;
}
.char-card:hover .char-card-del { display: flex; }
.char-card-del:hover { color: var(--red-hi); }

.add-char-btn {
  width: 72px; height: 108px; flex-shrink: 0; border: 1px dashed var(--border2);
  border-radius: 1px; background: none; color: var(--text-dim); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .06em; text-transform: uppercase;
  line-height: 1.3; padding: .3rem; text-align: center;
  transition: border-color .15s, color .15s; display: flex; align-items: center; justify-content: center;
}
.add-char-btn:hover { border-color: var(--red-dim); color: var(--red-hi); }

.tl-row-del {
  position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); font-size: .6rem;
  cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; transition: all .15s;
}
.tl-editor-row:hover .tl-row-del { display: flex; }
.tl-row-del:hover { border-color: var(--red); color: var(--red-hi); }

#modal-overlay .modal { max-width: 560px; }

.folder-select-wrap { position: relative; margin-bottom: 1rem; }
.folder-select-wrap::after {
  content: ''; position: absolute; right: .75rem; top: 50%;
  margin-top: -2px; width: 0; height: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--text-dim); pointer-events: none;
}
.folder-select-wrap select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .6rem .8rem; padding-right: 2rem; color: var(--text-hi);
  font-family: 'DM Sans', sans-serif; font-size: .85rem; outline: none; transition: border-color .2s;
  appearance: none; -webkit-appearance: none;
}
.folder-select-wrap select:focus { border-color: var(--red); }
.folder-select-wrap select option { background: var(--bg2); }
.folder-select-label {
  font-family: 'DM Sans', sans-serif; font-size: .62rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .35rem;
}

.gallery-status { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin-bottom: 1rem; font-style: italic; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: .5rem; margin-bottom: 1.25rem; min-height: 60px; }
.gallery-item {
  position: relative; cursor: pointer; border-radius: 1px; border: 2px solid transparent;
  overflow: hidden; transition: border-color .15s, transform .15s, opacity .15s; background: var(--surface2);
}
.gallery-item:hover { border-color: var(--border2); transform: translateY(-2px); }
.gallery-item.selected { border-color: var(--red-hi); }
.gallery-item.used { opacity: .4; }
.gallery-item.used:hover { opacity: .65; }
.gallery-item img { width: 100%; height: 120px; object-fit: contain; object-position: center top; display: block; filter: brightness(.85); background: var(--surface); }
.gallery-item-name { font-family: 'DM Sans', sans-serif; font-size: .52rem; color: var(--text); padding: .2rem .3rem; text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery-item.selected .gallery-item-name { color: var(--text-hi); }
.gallery-check {
  position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--red-hi); display: none; align-items: center; justify-content: center; font-size: .6rem; color: #fff;
}
.gallery-item.selected .gallery-check { display: flex; }

.manual-toggle { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; margin-bottom: .75rem; display: inline-block; }
.manual-toggle:hover { color: var(--text); }
.manual-section { display: none; }
.manual-section.visible { display: block; }

#modal-overlay .field { margin-bottom: .85rem; }
#modal-overlay .status-msg { font-size: .75rem; }
.img-preview { width: 60px; height: 90px; object-fit: cover; border-radius: 1px; border: 1px solid var(--border2); margin-top: .5rem; display: none; }

.add-tier-row { display: flex; align-items: center; gap: .5rem; padding: .6rem; border: 1px dashed var(--border2); border-radius: 2px; flex-wrap: wrap; }
.add-tier-row input {
  flex: 1; min-width: 120px; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .5rem .7rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif; font-size: .95rem; outline: none;
}

@keyframes ceFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.editor-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic; border: 1px dashed var(--border); border-radius: 2px; }

/* Маршрут #/favorites-edit (см. план перехода, фаза 3.2) — та же
   вёрстка, что раньше жила в app/favorites-edit.html. .fe-view input,
   .fe-view select, а не голые input/select — на исходной странице это
   была вся страница целиком, а тут — общий документ, и без прицела
   правило задело бы вообще все поля ввода приложения, вплоть до
   поиска в «Отзывах». */
.fe-view input, .fe-view select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .65rem .85rem; color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; outline: none;
  transition: border-color .2s, background .2s; appearance: none; -webkit-appearance: none;
}
.fe-view input:focus, .fe-view select:focus { border-color: var(--red); background: var(--bg2); }
.fe-view input::placeholder { color: var(--text-dim); }

.field-subtype { display: none; }
.field-subtype.visible { display: block; }
#field-from.hidden-field { display: none; }

.avatar-preview {
  width: 80px; height: 80px; object-fit: cover; border-radius: 50%;
  border: 1px solid var(--border2); margin-top: .6rem; display: none;
}

.btn-save::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-top: 1px solid var(--red-dim); border-left: 1px solid var(--red-dim); }
.btn-save::after  { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-bottom: 1px solid var(--red-dim); border-right: 1px solid var(--red-dim); }

.divider-title {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: 1.15rem;
  color: var(--text-hi); margin: 3rem 0 1.25rem; display: flex; align-items: center; gap: .8rem;
}
.divider-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.divider-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

.list-header { display: flex; align-items: center; justify-content: space-between; margin: 3rem 0 1.25rem; gap: 1rem; }
.list-header .divider-title { margin: 0; flex: 1; }

.btn-save-order {
  font-family: 'DM Sans', sans-serif; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase;
  color: var(--green-hi); background: var(--ok-wash); border: 1px solid var(--ok-line); border-radius: 2px;
  padding: .35rem .85rem; cursor: pointer; transition: all .15s; white-space: nowrap; display: none;
}
.btn-save-order:hover { background: var(--ok-fill); border-color: var(--green-hi); }
.btn-save-order.visible { display: block; }
.btn-save-order:disabled { opacity: .4; cursor: not-allowed; }

.entries-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 2rem; }

.entry-row {
  display: flex; align-items: center; gap: .85rem; padding: .6rem .85rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
  transition: border-color .15s, opacity .15s, box-shadow .15s;
}
.entry-row:hover { border-color: var(--border2); }
.entry-row.dragging { opacity: .4; }
.entry-row.drag-over { border-color: var(--red); box-shadow: 0 -1px 0 var(--red); }

.entry-drag-handle { flex-shrink: 0; cursor: grab; color: var(--text-dim); font-size: 1rem; line-height: 1; padding: 0 2px; user-select: none; }
.entry-drag-handle:active { cursor: grabbing; }

.entry-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border2); flex-shrink: 0; background: var(--surface2); }
.entry-name {
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: var(--text-hi);
  flex: 1; min-width: 0; overflow-wrap: anywhere;
}
.entry-type { font-family: 'DM Sans', sans-serif; font-size: .62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; }
.entry-edit {
  font-family: 'DM Sans', sans-serif; font-size: .7rem; color: var(--text-dim); background: none;
  border: 1px solid var(--border2); border-radius: 2px; padding: .25rem .6rem; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.entry-edit:hover { border-color: var(--red-dim); color: var(--red-hi); }

.order-hint { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); text-align: center; margin-top: .75rem; display: none; }
.order-hint.visible { display: block; }

.entries-empty { font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text-dim); padding: 1rem .85rem; border: 1px dashed var(--border); border-radius: 2px; }

/* Маршрут #/backup-history (см. план перехода, фаза 3.5) — .bh-view
   вместо голого main, та же причина, что у .ro-view/.ce-view/.fe-view
   выше: не задевать <main> самой рельсы. Остального CSS для этого
   маршрута не требуется — .file-tabs/.history-retention/.state-box/
   .spinner уже общие (admin.css/style.css). */
.bh-view { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

/* ══ Маршрут #/add — редактор отзыва (план перехода, фаза 3.3) ══
   Тот же CSS, что раньше жил в <style> самой app/add.html (файл никуда
   не делся: он по-прежнему грузится отдельным документом в iframe
   модалки «Добавить себе» на чужом паспорте — см. шапку
   js/routes/add.js). .add-view вместо голых селекторов — та же причина,
   что у .ro-view/.ce-view/.fe-view/.bh-view выше: здесь один документ
   на всё приложение, и правило вроде «input, textarea, select» без
   прицела перекрасило бы вообще все поля ввода, вплоть до поиска в
   «Отзывах» и полей на других маршрутах.

   Ширина/поля <main> — как на исходной странице (style.css, main), а не
   как у рельсы (main выше в этом файле переопределён на 1800px). */
.add-view { max-width: 860px; margin: 0 auto; padding: 3rem 2rem 6rem; }

.add-view .section-title .sub { font-size: .8rem; font-weight: 400; font-style: italic; color: var(--text-dim); }

.add-view input, .add-view textarea, .add-view select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .65rem .85rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
.add-view input:focus, .add-view textarea:focus, .add-view select:focus { border-color: var(--red); background: var(--bg2); }
.add-view input::placeholder, .add-view textarea::placeholder { color: var(--text-dim); }

.add-view textarea { resize: vertical; min-height: 100px; line-height: 1.7; }

/* ══ ПЕРЕКЛЮЧАТЕЛЬ «Любимое» ═════════════════════
   Вместо системного чекбокса (белый квадрат, который на тёмном фоне
   выбивался) — кнопка со всей надписью. Сам <input type="checkbox">
   остался, но скрыт: на его .checked завязаны заполнение и сохранение
   формы. Вид берёт у обычной .btn .btn-ghost, чтобы участвовать в темах. */
.add-view .btn.fav-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .7rem .85rem;
  text-transform: none;
  font-size: .75rem;
  letter-spacing: .05em;
  user-select: none;
}
/* Сердце — svg, а не символ '♡'/'♥' из шрифта: ни один из
   самохостящихся шрифтов их не содержит (проверено по cmap). */
.add-view .fav-toggle-icon { flex-shrink: 0; }
.add-view .fav-toggle.on .fav-toggle-icon { fill: currentColor; }
.add-view .btn.fav-toggle.on { border-color: var(--accent-line); background: var(--accent-fill); color: var(--red-hi); }
.add-view .btn.fav-toggle.on:hover { background: var(--accent-fill-hi); color: var(--red-hi); }

/* ══ СВОРАЧИВАЕМЫЕ РАЗДЕЛЫ ═══════════════════════
   Свёрнутый раздел — одна строка-кнопка, ровно как у обложки и
   источников. Состояние держится классом на обёртке, так открытая и
   закрытая части не могут разъехаться. */
.add-view .sec { margin-bottom: .75rem; }
.add-view .sec > .sec-toggle { display: none; }
.add-view .sec.collapsed > .sec-toggle { display: block; }
.add-view .sec.collapsed > .sec-body { display: none; }

.add-view .sec-body { border: 1px solid var(--border); border-radius: 2px; padding: .9rem 1rem 1rem; background: var(--tint); }

.add-view .sec-head { display: flex; align-items: center; gap: .8rem; margin-bottom: .9rem; }
.add-view .sec-head .sec-title {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
  font-size: 1.05rem; color: var(--text-hi);
}
.add-view .sec-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }
.add-view .sec-head .icon-btn { flex-shrink: 0; order: 3; }

/* Внутри раздела нижний отступ последнего поля лишний */
.add-view .sec-body > .field:last-child,
.add-view .sec-body > .grid:last-child { margin-bottom: 0; }

.add-view .hint {
  font-size: .68rem;
  padding: .55rem .85rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--tint-hi);
  margin-bottom: 1.25rem;
  margin-top: -.25rem;
}

.add-view .preview-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--red-dim);
  border-radius: 2px;
  padding: .85rem 1rem;
  margin-top: .5rem;
  font-size: .95rem;
  line-height: 1.7;
  color: var(--text);
  font-style: italic;
  min-height: 60px;
}

.add-view .cover-preview {
  width: 64px; height: 96px;
  object-fit: cover;
  border: 1px solid var(--border2);
  border-radius: 2px;
  display: none;
  flex-shrink: 0;
}

.add-view .cover-block {
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1.1rem;
  margin-top: .75rem;
}
.add-view .cover-block.hidden { display: none; }
.add-view .cover-controls { flex: 1; min-width: 0; }
.add-view .cover-controls-head { display: flex; align-items: flex-end; gap: .6rem; margin-bottom: .6rem; }
.add-view .cover-upload-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

/* ══ ОЦЕНКИ ══════════════════════════════════════ */
.add-view .grades-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
.add-view .grade-btn {
  font-family: 'Playfair Display', serif;
  font-size: .82rem;
  font-weight: 700;
  padding: .35rem .85rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  background: var(--tint-hi);
  position: relative;
}
.add-view .grade-btn::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 6px; height: 6px;
  border-top: 1px solid currentColor;
  border-left: 1px solid currentColor;
  opacity: 0;
  transition: opacity .15s;
}
.add-view .grade-btn.active::before { opacity: 1; }
.add-view .grade-btn.active { filter: brightness(1.4); }

.add-view button.icon-btn {
  background: none; border: 1px solid var(--border2); color: var(--text-dim);
  width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 4px; font-size: .8rem; cursor: pointer; flex-shrink: 0;
}
.add-view button.icon-btn:hover { color: var(--text-hi); border-color: var(--red); background: none; }

/* ══ МОДАЛКА: новый тег / новая категория ════════ */
.add-view .tag-modal-tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
.add-view .tag-modal-tab {
  flex: 1; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px;
  color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: .72rem; letter-spacing: .05em;
  text-transform: uppercase; padding: .55rem; cursor: pointer; transition: all .15s;
}
.add-view .tag-modal-tab:hover { color: var(--text); }
.add-view .tag-modal-tab.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--accent-wash); }
#tag-modal-status { margin-top: .75rem; }

/* Модалка одновременно и форма, и список существующих записей —
   в 420px это уже тесно. */
#tag-modal-overlay .modal { max-width: 520px; }

.add-view .tm-actions { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: .5rem; }
.add-view .tm-link {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim);
  text-decoration: underline; text-underline-offset: 3px;
}
.add-view .tm-link:hover { color: var(--text-hi); }
.add-view .tm-danger { color: var(--err); }
.add-view .tm-danger:hover { color: #e8a4a4; }

.add-view .danger-zone {
  margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .7rem;
}
.add-view .danger-hint { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim); flex: 1; min-width: 12rem; }

.add-view .tm-color-row { display: flex; align-items: center; gap: .9rem; }
.add-view .tm-color-row input[type=color] { width: 64px; height: 42px; padding: .2rem; cursor: pointer; }
.add-view .tm-note { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim); }

.add-view .tm-list-head {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  margin: 1.5rem 0 .6rem; padding-top: 1.1rem; border-top: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim);
}
.add-view .tm-list-head input { width: 140px; font-size: .7rem; padding: .25rem .5rem; }

.add-view .tm-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: .1rem; }
.add-view .tm-group {
  font-family: 'DM Sans', sans-serif; font-size: .58rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-dim); margin: .7rem 0 .2rem;
}
.add-view .tm-group:first-child { margin-top: 0; }
.add-view .tm-row {
  display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 3px; padding: .3rem .5rem;
  cursor: pointer; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .74rem;
}
.add-view .tm-row:hover { border-color: var(--border2); color: var(--text-hi); }
.add-view .tm-row.active { border-color: var(--red-dim); background: var(--accent-wash); color: var(--text-hi); }
.add-view .tm-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add-view .tm-row-note { font-size: .64rem; color: var(--text-dim); flex-shrink: 0; }
.add-view .tm-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--border2); }
.add-view .tm-empty { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); padding: .4rem 0; }

/* ── Массовое удаление тегов ──
   Тот же список (#tm-tag-list), просто в другом режиме: форма
   добавления/правки и переключатель «Тег/Категория» прячутся, а у строк
   вместо ✎ появляется галочка выбора. */
.add-view .btn-new-danger { border-color: var(--err); color: var(--err); }
.add-view .btn-new-danger:hover { background: var(--err-wash, rgba(163,51,51,.12)); border-color: var(--err); }

#tag-modal-tag-panel.bulk-mode .field,
#tag-modal-tag-panel.bulk-mode .tm-actions,
#tag-modal-overlay.bulk-mode .tag-modal-tabs { display: none; }

.add-view .tm-bulk-bar {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  margin-bottom: .8rem; padding: .55rem .8rem;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 3px;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim);
}
.add-view .tm-bulk-bar.hidden { display: none; }
.add-view .tm-bulk-actions { display: flex; align-items: center; gap: .9rem; }
.add-view .tm-row-check {
  width: 14px; height: 14px; flex-shrink: 0; border-radius: 3px;
  border: 1px solid var(--border2); position: relative;
}
.add-view .tm-row.selected .tm-row-check { border-color: var(--red); background: var(--red-dim); }
.add-view .tm-row.selected .tm-row-check::after {
  content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
  border: solid var(--text-hi); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.add-view .tm-row.selected { border-color: var(--red-dim); background: var(--accent-wash); color: var(--text-hi); }

/* ── Какие теги показывать на карточке ── */
.add-view .card-tags-hint { font-family: 'DM Sans', sans-serif; font-size: .7rem; color: var(--text-dim); margin: .3rem 0 .7rem; }
.add-view .card-tags-count { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin: .5rem .1rem 0; }
.add-view .card-tag-row {
  display: flex; align-items: center; gap: .6rem; cursor: pointer;
  padding: .4rem .1rem; border-bottom: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text);
}
.add-view .card-tag-row:last-child { border-bottom: none; }
.add-view .card-tag-row.selected { color: var(--text-hi); }
.add-view .card-tag-row.selected .tm-row-check { border-color: var(--red); background: var(--red-dim); }
.add-view .card-tag-row.selected .tm-row-check::after {
  content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
  border: solid var(--text-hi); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.add-view .card-tag-row.disabled { opacity: .4; cursor: not-allowed; }
.add-view .card-tag-row-name { flex: 1; }
.add-view .card-tags-none-row { border-bottom: 1px solid var(--border); margin-bottom: .2rem; }
#card-tags-list.disabled { opacity: .35; pointer-events: none; }

.add-view .tm-cat-delete-choice {
  margin: 1rem 0; padding: .9rem 1rem;
