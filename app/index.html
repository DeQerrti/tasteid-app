  margin-bottom: 1.5rem;
}
.section-header .section-title {
  margin-bottom: 0;
  flex: 1;
}
.admin-add-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .3rem .75rem;
  text-decoration: none;
  transition: all .18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.admin-add-btn:hover {
  border-color: var(--red-dim);
  color: var(--red-hi);
}

/* ══ REVIEW TOOLBAR ══════════════════════════════ */
.rv-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}
.rv-filters {
  display: inline-flex;
  flex-direction: column;
  gap: .75rem;
  padding: 1.1rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
}

/* ── Мобильная панель «Отзывов» ────────────────────
   На столе есть место под всегда открытые фильтры (.rv-filters
   выше) – на телефоне то же самое заняло бы полэкрана до самих
   карточек. Вместо этого – поиск сверху и одна кнопка «Фильтры»,
   открывающая модалку с тем же набором плюс полным списком тегов
   (js/reviews.js: rvTagToggleHtml) вместо поиска по подстроке –
   тапнуть по паре нужных проще, чем печатать на телефонной
   клавиатуре. Обе панели рисуются всегда, показ/скрытие решает только
   media-запрос ниже – тот же приём, что у рельсы/нижней панели вкладок. */
.rv-mobile-toolbar { display: none; }
@media (max-width: 700px) {
  .rv-filters { display: none; }
  .rv-mobile-toolbar {
    display: flex;
    gap: .6rem;
    width: 100%;
  }
  .rv-mobile-toolbar .rv-search-input { flex: 1; width: auto; }
}
.rv-filters-open-btn { position: relative; white-space: nowrap; }
.rv-filters-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  color: var(--red-hi);
}
.rv-filters-modal .rv-filters-modal-body {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  max-height: 60vh;
  overflow-y: auto;
  margin: 1rem 0;
}
.rv-tag-cloud { display: flex; flex-wrap: wrap; gap: .4rem; }
.rv-filters-modal-actions {
  display: flex;
  justify-content: space-between;
  gap: .75rem;
}

  /* ══ TIERLIST MODE TOGGLE ════════════════════════ */
.tl-mode-toggle {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-bottom: 1.8rem;
}
/* Верхняя строка раздела остаётся на месте при прокрутке: в длинном
   списке переключиться на соседнюю вкладку (статус, раздел «Любимого»,
   тир-лист, год в Статистике) можно, не листая назад наверх. Только
   прямые дети вкладки раздела: sticky держится, пока на экране его
   родитель, а родитель здесь – весь раздел целиком. Фон сплошной,
   иначе карточки просвечивают сквозь строку, когда уезжают под неё;
   padding + такой же отрицательный margin дают зазор сверху у
   прилипшей строки и не сдвигают её в обычном положении. «Отзывы» не
   здесь: их панель фильтров – четыре строки, прилипшей она съела бы
   пол-экрана. */
#tab-now > .tl-mode-toggle,
#tab-tierlist > .tl-mode-toggle,
#tab-favorites > .fav-head,
#tab-stats > .stat-toolbar {
  position: sticky;
  top: var(--app-titlebar, 0px);
  z-index: 20;
  background: var(--bg);
  padding-top: .75rem;
  margin-top: -.75rem;
}
@media (max-width: 700px) {
  /* На телефоне тут может оказаться несколько своих тир-листов
     (см. tl-mode-add-btn) плюс "Тайтлы" – без переноса и без
     прокрутки лишние кнопки просто уезжали бы за край экрана
     (body { overflow-x: hidden } прячет уехавшее, а не показывает
     по свайпу). Тот же приём, что у .rail-tabs на телефоне и у
     .side-tab в settings-edit: своя прокрутка со скрытой полосой,
     кнопки не сжимаются. */
  .tl-mode-toggle {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
    gap: .35rem;
  }
  .tl-mode-toggle::-webkit-scrollbar { display: none; }
  .tl-mode-btn, .tl-mode-add-btn { flex-shrink: 0; }
}
.tl-mode-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .55rem 1.4rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
/* (hover: hover) – не просто эстетика: на сенсорном экране :hover
   часто "залипает" после касания (тач вообще не умеет по-настоящему
   отменять hover без наведения мышью) – это и было тем самым "подсветка
   на двух вкладках сразу" при свайпе (см. её же историю в этой сессии):
   активная вкладка получала свой класс .active честно, а та, где
   пальцем задело или закончился свайп, застревала в :hover и выглядела
   почти так же подсвеченной. На устройстве с мышью ничего не меняется –
   там (hover: hover) истинно всегда. */
@media (hover: hover) {
  .tl-mode-btn:hover { color: var(--text); border-color: var(--border2); }
}
.tl-mode-btn.active {
  color: var(--text-hi);
  border-color: var(--red);
  background: var(--surface2);
}
/* Меньше, чтобы обычный набор (Статусы: 4 кнопки, Любимое: 3-4)
   помещался в один экран без прокрутки – она остаётся страховкой на
   случай, если своих тир-листов/разделов заведено много (см. её же
   комментарий у .tl-mode-toggle выше), а не обычным способом
   посмотреть соседнюю кнопку. После, а не внутри того @media –
   иначе безусловное правило .tl-mode-btn ниже по файлу и с той же
   специфичностью побеждает как более позднее в каскаде. */
@media (max-width: 700px) {
  .tl-mode-btn {
    font-size: .64rem;
    letter-spacing: 0;
    padding: .45rem .4rem;
  }
}
.tl-mode-add-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: 0 1rem;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-mode-add-btn:hover { color: var(--red-hi); border-color: var(--red-dim); }
/* «Новый тир-лист» – в конце строки, а не вплотную к вкладкам: рядом
   с ними «Создать» читалось третьей вкладкой. */
#tl-add-collection-btn { margin-left: auto; }

/* Счётчик записей на кнопке переключателя (js/now.js, js/favorites.js
   – та же .tl-mode-btn, что и у тир-листа) – раньше жил инлайновым
   <style> внутри renderNow(), общим стал вместе с самим переключателем. */
.section-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  font-weight: 400;
  font-style: normal;
  color: var(--text-dim);
  letter-spacing: .05em;
  margin-left: .1rem;
}

/* ══ СТАТУСЫ: поиск, фильтр по типу, сортировка ══
   Ряд под вкладками статусов (js/now.js: nowToolsHtml). Слева чипы
   типов, справа поиск и сортировка; на узком экране правая часть
   переносится на свою строку. */
#tab-now .tl-mode-toggle { margin-bottom: 1rem; }
.now-tools {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: .6rem 1rem;
  margin-bottom: 1.3rem;
}
.now-chips { display: flex; flex-wrap: wrap; gap: .4rem; flex: 1 1 320px; min-width: 0; }
.now-chip {
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: .32rem .8rem;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
@media (hover: hover) {
  .now-chip:hover { color: var(--text); border-color: var(--border2); }
}
.now-chip.active {
  color: var(--text-hi);
  background: var(--accent-fill);
  border-color: var(--accent-line);
}
.now-chip .section-count { margin-left: .15rem; }
.now-tools-right { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; margin-left: auto; min-width: 0; }
.now-search, .now-sort {
  font-family: 'DM Sans', sans-serif;
  font-size: .82rem;
  color: var(--text-hi);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: .45rem .7rem;
}
.now-search { width: 220px; min-width: 0; }
.now-search::placeholder { color: var(--text-dim); }
.now-search:focus, .now-sort:focus { outline: none; border-color: var(--accent-line); }
.now-sort { color: var(--text-dim); cursor: pointer; }
/* Класс, а не атрибут hidden – см. nowApplyFilter в js/now.js. */
.now-hidden { display: none !important; }
@media (max-width: 700px) {
  .now-tools { gap: .5rem; margin-bottom: .9rem; }
  .now-tools-right { width: 100%; margin-left: 0; }
  .now-search { flex: 1; width: auto; }
  .now-chip { font-size: .72rem; padding: .28rem .6rem; }
}

/* Заголовок года в списке (js/now.js: yearGroupsHtml). Счётчик рядом с
   годом – сколько карточек этого года видно сейчас. scroll-margin –
   чтобы «Перейти к году» не прятал заголовок под полосу окна в Electron
   и под прилипшую строку вкладок (см. её же комментарий у
   .tl-mode-toggle). */
.year-divider { scroll-margin-top: calc(var(--app-titlebar, 0px) + 4.5rem); }
.year-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem;
  font-weight: 400;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
/* Классическая тема: год слева, читаемым цветом, линия уходит вправо.
   Раньше он стоял по центру между двумя линиями цветом рамки (почти не
   виден на тёмном фоне) и с отступом сверху в два с половиной ряда
   текста – разделы архива выглядели оторванными друг от друга. Только
   классическая: у остальных тем линии заголовка свои (themes.css). */
:is(html:not([data-skin]), html[data-skin^="classic"]) .year-divider {
  align-items: baseline;
  gap: .7rem;
  margin: 2rem 0 .9rem;
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--text-hi);
}
:is(html:not([data-skin]), html[data-skin^="classic"]) .year-divider:first-child { margin-top: .2rem; }
:is(html:not([data-skin]), html[data-skin^="classic"]) .year-divider::before { display: none; }
:is(html:not([data-skin]), html[data-skin^="classic"]) .year-divider::after {
  align-self: center;
  background: linear-gradient(90deg, var(--border2), transparent);
}

/* Подпись карточки статусов (js/cards.js: manualCard): тип и год слева,
   дата справа – раньше тип и дата были плашками поверх обложки. Оценка,
   когда она есть (архив), – своей строкой ниже. */
.card-meta-now { align-items: baseline; }
.card-meta-main { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta-date { flex: none; font-variant-numeric: tabular-nums; }
.card-grade-line { display: flex; min-width: 0; padding-top: .2rem; }
/* Карандаш – не только при наведении мышью: и когда карточка в фокусе
   с клавиатуры (иначе до него было не добраться вовсе). */
.review-card-wrap:focus-within .review-edit-btn { display: flex; }

/* ══ Классическая тема на компьютере: рельса и вкладки ══
   Только классическая (тёмная и светлая): у остальных тем рельса и
   вкладки нарисованы по-своему в themes.css, и их не трогаем. Только
   шире 700px: на телефоне у рельсы и у .tl-mode-btn свои правила ниже
   и выше по файлу, а эти селекторы специфичнее и перебили бы их.

   Рельса – пункты по левому краю с иконкой (иконки уже были в разметке,
   но показывались только на телефоне). Вкладки статусов/любимого/
   тир-листа – строкой с подчёркиванием активной вместо ряда рамок
   заглавными: рамки были самым громким элементом экрана, громче самих
   обложек. */
@media (min-width: 701px) {
  /* Крупнее, чем было (1.1rem, иконка 17px): пункты рельсы терялись в
     её пустоте. Активный – ещё и красная полоса у левого края рельсы. */
  :is(html:not([data-skin]), html[data-skin^="classic"]) nav#rail { width: 236px; }
  :is(html:not([data-skin]), html[data-skin^="classic"]) nav#rail .logo { font-size: 1.45rem; }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .rail-tabs { gap: 4px; }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tab-btn {
    display: flex; align-items: center; gap: .85rem;
    text-align: left;
    font-size: 1.32rem; letter-spacing: .01em;
    padding: .7rem .85rem;
    color: var(--text);
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tab-btn.active { color: var(--text-hi); }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tab-icon {
    display: block; flex: none;
    width: 20px; height: 20px;
    opacity: .8;
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tab-btn.active .tab-icon { opacity: 1; color: var(--red-hi); }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tab-btn.active::before {
    display: block; content: ''; position: absolute;
    left: -14px; top: 22%; bottom: 22%; width: 3px; height: auto;
    border-radius: 0 3px 3px 0; background: var(--red-hi); transform: none;
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) #admin-settings-link:not(.hidden) {
    display: flex; align-items: center; gap: .85rem;
    font-size: 1.05rem;
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .admin-link-icon {
    display: block; flex: none;
    width: 18px; height: 18px;
  }

  :is(html:not([data-skin]), html[data-skin^="classic"]) .tl-mode-toggle {
    gap: 0 1.6rem;
    border-bottom: 1px solid var(--border);
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tl-mode-btn {
    font-size: 1.2rem;
    letter-spacing: .02em;
    text-transform: none;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: .25rem 0 .6rem;
    margin-bottom: -1px;
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tl-mode-btn.active {
    background: none;
    border-bottom-color: var(--red-hi);
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) .tl-mode-add-btn {
    align-self: center;
    padding: .2rem .8rem;
    margin-bottom: .45rem;
  }
  /* Одного вида с «Подписи»/«Редактор» в шапке режима (.tl-tool-btn),
     а не засечным текстом в рамке – так это читается кнопкой. */
  :is(html:not([data-skin]), html[data-skin^="classic"]) #tl-add-collection-btn {
    display: inline-flex; align-items: center; height: 32px; box-sizing: border-box;
    padding: 0 .8rem; border-radius: 2px; border-color: var(--border2);
    font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 400; color: var(--text);
  }
  :is(html:not([data-skin]), html[data-skin^="classic"]) #tl-add-collection-btn:hover {
    color: var(--text-hi); border-color: var(--accent-line);
  }
}

/* ══ МОДАЛКА: новый тир-лист (коллекция) ═════════ */
.modal-overlay.hidden { display: none; }
.modal-close:hover { color: var(--text-hi); }
.modal .field { margin-bottom: 1rem; }
.modal .field label {
  font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .4rem;
}
.modal .field input[type="text"] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px;
  padding: .65rem .85rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; outline: none; transition: border-color .2s, background .2s;
}
.modal .field input[type="text"]:focus { border-color: var(--red); background: var(--bg2); }
.modal .btn-save {
  width: 100%; background: var(--accent-fill); border: 1px solid var(--accent-line);
  border-radius: 2px; color: var(--text-hi); font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700; font-style: italic; letter-spacing: .06em;
  padding: .8rem; cursor: pointer; transition: background .2s, border-color .2s;
}
.modal .btn-save:hover { background: var(--accent-fill-hi); border-color: var(--red); }
.modal .btn-save:disabled { opacity: .4; cursor: not-allowed; }
.modal .status-msg {
  font-family: 'DM Sans', sans-serif; font-size: .78rem; text-align: center;
  margin-top: .85rem; min-height: 1.2rem; letter-spacing: .03em;
}
.modal .status-msg.ok  { color: var(--green-hi); }
.modal .status-msg.err { color: var(--err); }

/* ── Переключатель тир-листов внутри игры ── */
.tl-char-lists {
  display: flex;
  gap: .4rem;
  margin-bottom: 1.4rem;
  flex-wrap: wrap;
}
.tl-list-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 1px;
  padding: .3rem .85rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-list-btn:hover { color: var(--text); border-color: var(--border2); }
.tl-list-btn.active {
  color: var(--text-hi);
  border-color: var(--red-dim);
  background: var(--surface2);
}

/* Постеры персонажей – квадратные (1/1 вместо 2/3) */
.tl-poster img.char-img {
  aspect-ratio: 1/1;
}
  /* ══ ПОСТЕРЫ ПЕРСОНАЖЕЙ В ТИР-ЛИСТЕ ════════════ */
.tl-char-poster {
  width: auto;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s;
  animation: fadeUp .25s ease both;
  /* Фон совпадает с фоном ряда – убирает "чёрные блоки" вокруг прозрачных PNG */
  background: var(--surface);
}
.tl-char-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-char-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-char-poster:hover::before { opacity: 1; width: 13px; height: 13px; }
.tl-char-poster img {
  height: 100%;
  width: auto;
  max-width: 100%;
  display: block;
  filter: grayscale(.15) brightness(.85);
  transition: filter .25s;
  background: var(--surface);
}
.tl-char-poster:hover img { filter: grayscale(0) brightness(.98); }

/* ══ РОУТЕР SPA (см. план перехода, фаза 2) ═══════
   #shell-root – рельса и вкладки, всё, что было в этом файле раньше.
   #view-root – куда роутер (js/router.js) подставляет содержимое
   отдельных маршрутов вроде #/reviews-order, вместо полной перезагрузки
   на отдельный HTML-файл. display: contents у #shell-root, а не просто
   div, – иначе рельса и <main> перестанут быть прямыми flex-детьми body
   (body { display: flex } выше) и раскладка сломается. */
#shell-root { display: contents; }
/* #shell-root.hidden, а не только .hidden – специфичность id-селектора
   (#shell-root) выше специфичности класса (.hidden) сама по себе, и
   правило display: contents выше побеждало бы обычный .hidden{display:
   none} независимо от порядка в файле: рельса оставалась в раскладке
   (просто «прозрачным» контейнером) поверх/рядом с показанным
   маршрутом – заметно на мобильной ширине, где рельса становится
   нижней панелью вкладок и никак не перекрывается видом маршрута. */
#shell-root.hidden { display: none; }
#view-root { flex: 1; min-width: 0; }

/* Маршрут #/reviews-order – та же вёрстка/CSS, что раньше жили в
   app/reviews-order.html (файл удалён в фазе 4 – вся его вёрстка и
   логика теперь здесь и в js/routes/reviews-order.js). .ro-view
   вместо голого main – иначе
   правило ниже задело бы <main> самой рельсы тоже, он остаётся в DOM
   (просто скрыт через #shell-root.hidden), пока активен другой маршрут. */
.ro-view { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

.dnd-grid {
  display: grid;
  gap: .75rem;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  margin-bottom: 2.5rem;
  min-height: 60px;
}
.dnd-item {
  position: relative;
  cursor: grab;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s, opacity .2s;
  user-select: none;
}
.dnd-item:active { cursor: grabbing; }
.dnd-item.dragging { opacity: .4; }
.dnd-item.drag-over { border-color: var(--red); box-shadow: 0 0 0 1px var(--red-dim); }
.dnd-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: brightness(.88);
  pointer-events: none;
}
.dnd-item-body { padding: .45rem .5rem .55rem; }
.dnd-item-title {
  font-family: 'Cormorant Garamond', serif; font-size: .85rem; font-weight: 600;
  color: var(--text-hi); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.dnd-item-type {
  font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim);
  margin-top: .2rem; text-transform: uppercase; letter-spacing: .08em;
}
.dnd-item-num {
  position: absolute; top: 4px; left: 4px; background: var(--poster-scrim);
  color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: .6rem;
  padding: .15rem .4rem; border-radius: 1px; pointer-events: none;
}
/* Персонажи, персоны и свои разделы «Любимого» – квадратные карточки,
   как во вкладке (#/favorites-order). */
.dnd-grid-square .dnd-item img { aspect-ratio: 1/1; }
.ro-view .fav-role-head { margin: 1.6rem 0 .8rem; }
.save-bar { display: flex; align-items: center; gap: 1.5rem; margin-top: 1rem; }
.save-status { font-family: 'DM Sans', sans-serif; font-size: .78rem; }
.save-status.ok  { color: var(--green-hi); }
.save-status.err { color: var(--err); }

/* Маршрут #/chars-edit (см. план перехода, фаза 3.1) – та же вёрстка,
   что раньше жила в app/chars-edit.html. .ce-view вместо голого main –
   та же причина, что у .ro-view выше. .field/.status-msg/.modal ниже
   переопределены через #modal-overlay/#view-root, а не голым классом:
   у index.html эти же классы уже используются его собственными
   модалками (коллекция, горячие клавиши) – без такого прицела правки
   ниже задели бы и их тоже. */
.ce-view {
  max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 6rem;
  display: grid; grid-template-columns: 280px 1fr; gap: 2rem;
}
/* На телефоне папок в chars/ не видно и не нужно, а колонка-сайдбар
   рядом с редактором тиров попросту не помещается – раньше обе
   складывались в одну колонку одна над другой (список тайтлов, а под
   ним редактор), что означало лишнюю прокрутку и путаницу, какая
   часть экрана сейчас активна. Вместо этого – обычный drill-down:
   виден либо список тайтлов, либо открытый редактор, никогда оба
   сразу; переключает .ce-mobile-editor-open (см. selectTitle()/
   closeMobileEditor() в js/routes/chars-edit.js). */
@media (max-width: 800px) {
  .ce-view { grid-template-columns: 1fr; }
  .ce-view .editor { display: none; }
  .ce-view.ce-mobile-editor-open .sidebar { display: none; }
  .ce-view.ce-mobile-editor-open .editor { display: flex; }
}

.sidebar { display: flex; flex-direction: column; gap: 1rem; }
.section-label {
  font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: .4rem;
}
.title-list { display: flex; flex-direction: column; gap: .35rem; }
.title-item {
  display: flex; align-items: center; gap: .6rem; padding: .55rem .75rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 2px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.title-item:hover { border-color: var(--border2); }
.title-item.active { border-color: var(--red-dim); background: var(--surface2); }
.title-item-cover { width: 32px; height: 48px; object-fit: cover; border-radius: 1px; flex-shrink: 0; background: var(--surface2); }
.title-item-name { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; color: var(--text-hi); flex: 1; line-height: 1.3; }
.title-item-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .8rem; padding: .2rem; transition: color .15s; flex-shrink: 0; }
.title-item-del:hover { color: var(--red-hi); }
.title-item.dragging     { opacity: .35; }
.title-item.drag-over-up { border-top: 2px solid var(--red); }
.title-item.drag-over-dn { border-bottom: 2px solid var(--red); }
.title-item-edit { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .75rem; padding: .2rem; transition: color .15s; flex-shrink: 0; }
.title-item-edit:hover { color: var(--green-hi); }

.new-title-form { display: flex; flex-direction: column; gap: .5rem; padding: .85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; }
.new-title-form.hidden { display: none; }

.editor { display: flex; flex-direction: column; gap: 1.5rem; }
.editor-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.editor-title { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: 1.3rem; color: var(--text-hi); }
/* Только для мобильного drill-down (см. .ce-view выше) – на десктопе
   обе колонки видны всегда, возвращаться и редактировать название
   можно прямо в списке слева, кнопки там не нужны. */
.editor-back-btn, .editor-edit-btn {
  display: none; background: none; border: 1px solid var(--border); border-radius: 2px;
  color: var(--text-dim); font-size: .85rem; padding: .35rem .6rem; cursor: pointer; flex-shrink: 0;
}
.editor-back-btn:hover, .editor-edit-btn:hover { color: var(--text-hi); border-color: var(--border2); }
@media (max-width: 800px) {
  .editor-back-btn, .editor-edit-btn { display: inline-flex; align-items: center; }
  .editor-title { flex: 1; text-align: center; }
}

.list-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.list-tab {
  font-family: 'DM Sans', sans-serif; font-size: .62rem; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border);
  border-radius: 1px; padding: .3rem .75rem; cursor: pointer; transition: all .15s;
}
.list-tab:hover { color: var(--text); border-color: var(--border2); }
.list-tab.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }
.list-tab-add { color: var(--text-dim); border-style: dashed; }
.list-tab-add:hover { color: var(--green-hi); border-color: var(--green-hi); }
.list-tab-edit { margin-left: auto; padding: .3rem .55rem; color: var(--text-dim); }
.list-tab-edit:hover { color: var(--green-hi); border-color: var(--green-hi); }
.list-tab-del { padding: .3rem .55rem; color: var(--text-dim); }
.list-tab-del:hover { color: var(--red-hi); border-color: var(--red-dim); }
/* :hover не наступает от касания вообще никогда – на телефоне эти две
   кнопки поэтому всегда оставались в приглушённом --text-dim, что в
   светлых темах (например, "Мягкий ботанический") читалось как просто
   серые, неотличимые от неактивных. На устройстве без мыши (hover:none)
   красим их сразу, а не только по наведению, которого там не будет. */
@media (hover: none) {
  .list-tab-edit { color: var(--green-hi); }
  .list-tab-del { color: var(--red-hi); }
}

.tl-editor-rows { display: flex; flex-direction: column; gap: .6rem; }
.tl-editor-row {
  display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 2px; overflow: visible;
  position: relative; min-height: 90px;
}
.tl-editor-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--tl-color, var(--red-dim)); opacity: .6;
}
.tl-editor-label {
  width: 100px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: .75rem .5rem;
  border-right: 1px solid var(--border); background: var(--surface); gap: .3rem; position: relative;
  cursor: grab;
}
.tl-editor-label:active { cursor: grabbing; }
.tl-editor-label::after { content: ''; position: absolute; inset: 0; background: var(--tl-color, #888); opacity: .12; pointer-events: none; }

.tl-label-input {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: .85rem;
  color: var(--tl-color, var(--text-hi)); text-align: center; background: none; border: none;
  outline: none; width: 100%; cursor: pointer; line-height: 1.2; padding: 0;
}
.tl-label-input:focus { background: var(--tint-hi); border-radius: 2px; }
.tl-color-input { width: 20px; height: 20px; border: 1px solid var(--border2); border-radius: 2px; padding: 0; cursor: pointer; background: none; }

.tl-editor-cards {
  flex: 1; display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem;
  background: var(--surface); align-content: flex-start; min-height: 90px; position: relative;
}
.tl-editor-cards.drag-over { background: var(--accent-wash); }

.drop-indicator {
  width: 2px; align-self: stretch; min-height: 72px; background: var(--red-hi);
  border-radius: 2px; flex-shrink: 0; pointer-events: none; opacity: .8;
}

.char-card {
  width: auto; flex-shrink: 0; position: relative; cursor: grab;
  border-radius: 1px; overflow: hidden; border: 1px solid var(--border);
  transition: border-color .15s, transform .15s; background: var(--surface2); animation: ceFadeUp .2s ease both;
}
.char-card:active { cursor: grabbing; }
.char-card.dragging { opacity: .3; }
/* Высота – инлайн-стилем с самого <img> (ползунок размера, см. её же
   комментарий у ceCharHeight в chars-edit.js) – ширина картинки auto,
   пропорции сохраняются, а не растягиваются/обрезаются в фиксированную
   рамку, как было раньше при постоянных 72×108. */
.char-card img { width: auto; max-width: 100%; display: block; filter: brightness(.85); pointer-events: none; background: var(--surface); }
.char-card-name { font-family: 'DM Sans', sans-serif; font-size: .52rem; color: var(--text); padding: .2rem .3rem; text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-card-del {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--poster-scrim); border: none; color: var(--text-dim); font-size: .65rem; cursor: pointer;
  display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; transition: color .15s;
}
.char-card:hover .char-card-del { display: flex; }
.char-card-del:hover { color: var(--red-hi); }

.add-char-btn {
  width: 72px; height: 108px; flex-shrink: 0; border: 1px dashed var(--border2);
  border-radius: 1px; background: none; color: var(--text-dim); cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .06em; text-transform: uppercase;
  line-height: 1.3; padding: .3rem; text-align: center;
  transition: border-color .15s, color .15s; display: flex; align-items: center; justify-content: center;
}
.add-char-btn:hover { border-color: var(--red-dim); color: var(--red-hi); }

.tl-row-del {
  position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); font-size: .6rem;
  cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; transition: all .15s;
}
.tl-editor-row:hover .tl-row-del { display: flex; }
.tl-row-del:hover { border-color: var(--red); color: var(--red-hi); }

.tl-editor-row.dragging { opacity: .35; }
.tl-editor-row.drag-over-up { box-shadow: inset 0 2px 0 var(--red-hi); }
.tl-editor-row.drag-over-dn { box-shadow: inset 0 -2px 0 var(--red-hi); }

#modal-overlay .modal { max-width: 560px; }

.folder-select-row { display: flex; gap: .5rem; align-items: flex-start; margin-bottom: 1rem; }
#m-folder-open-btn { flex-shrink: 0; white-space: nowrap; }
.folder-select-wrap { position: relative; flex: 1; }
.folder-select-wrap::after {
  content: ''; position: absolute; right: .75rem; top: 50%;
  margin-top: -2px; width: 0; height: 0;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--text-dim); pointer-events: none;
}
.folder-select-wrap select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .6rem .8rem; padding-right: 2rem; color: var(--text-hi);
  font-family: 'DM Sans', sans-serif; font-size: .85rem; outline: none; transition: border-color .2s;
  appearance: none; -webkit-appearance: none;
}
.folder-select-wrap select:focus { border-color: var(--red); }
.folder-select-wrap select option { background: var(--bg2); }
.folder-select-label {
  font-family: 'DM Sans', sans-serif; font-size: .62rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .35rem;
}

.gallery-status { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin-bottom: 1rem; font-style: italic; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: .5rem; margin-bottom: 1.25rem; min-height: 60px; }
.gallery-item {
  position: relative; cursor: pointer; border-radius: 1px; border: 2px solid transparent;
  overflow: hidden; transition: border-color .15s, transform .15s, opacity .15s; background: var(--surface2);
}
.gallery-item:hover { border-color: var(--border2); transform: translateY(-2px); }
.gallery-item.selected { border-color: var(--red-hi); }
.gallery-item.used { opacity: .4; }
.gallery-item.used:hover { opacity: .65; }
.gallery-item img { width: 100%; height: 120px; object-fit: contain; object-position: center top; display: block; filter: brightness(.85); background: var(--surface); }
.gallery-item-name { font-family: 'DM Sans', sans-serif; font-size: .52rem; color: var(--text); padding: .2rem .3rem; text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery-item.selected .gallery-item-name { color: var(--text-hi); }
.gallery-check {
  position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--red-hi); display: none; align-items: center; justify-content: center; font-size: .6rem; color: #fff;
}
.gallery-item.selected .gallery-check { display: flex; }

/* Массовое добавление сразу нескольких (см. её же комментарий у
   toggleGalleryBulkMode в chars-edit.js) – свой чекбокс в другом углу,
   чтобы не путать с одиночным выбором выше (.gallery-check): у него
   своя отметка "выбран для добавления одним", у этого – "в списке на
   массовое добавление", оба могли бы стоять одновременно. Виден только
   в режиме массового выбора, а не всегда, как .gallery-check. */
.gallery-bulk-check {
  position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--surface2);
  display: none; align-items: center; justify-content: center; font-size: .6rem; color: var(--text-dim);
}
.gallery-grid.bulk-mode .gallery-bulk-check { display: flex; }
.gallery-item.bulk-selected .gallery-bulk-check { background: var(--red-hi); border-color: var(--red-hi); color: #fff; }
.gallery-item.bulk-selected { border-color: var(--red-hi); }

/* Пакетная загрузка нескольких фото разом (см. её же комментарий у
   onUploadFilesPicked в chars-edit.js) – список строк "превью + имя",
   а не сетка как у .gallery-item выше: там просто выбор среди уже
   загруженного, тут для каждой строки ещё нужно набрать текст. */
.batch-upload-list { display: flex; flex-direction: column; gap: .4rem; margin-top: .75rem; max-height: 260px; overflow-y: auto; }
.batch-item { display: flex; align-items: center; gap: .6rem; padding: .35rem; border: 1px solid var(--border); border-radius: 2px; background: var(--surface); }
.batch-item.batch-item-error { border-color: var(--red-hi); }
.batch-item-preview { width: 36px; height: 54px; object-fit: cover; border-radius: 1px; background: var(--surface2); flex-shrink: 0; }
.batch-item-name {
  flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .4rem .6rem; color: var(--text-hi); font-family: 'DM Sans', sans-serif; font-size: .8rem; outline: none;
}
.batch-item-name:focus { border-color: var(--red); }
.batch-item-status { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); flex-shrink: 0; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch-item-error .batch-item-status { color: var(--red-hi); }
.batch-item-remove { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .8rem; padding: .2rem; flex-shrink: 0; }
.batch-item-remove:hover { color: var(--red-hi); }

.manual-toggle { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; margin-bottom: .75rem; display: inline-block; }
.manual-toggle:hover { color: var(--text); }
.manual-section { display: none; }
.manual-section.visible { display: block; }

/* На телефоне (см. isNativeMobile в chars-edit.js) папка-источник и
   галерея уже загруженных картинок только путают – там ничего не
   раскладывают по папкам руками. Оставляем только "Имя персонажа",
   ссылку и загрузку файла, оба сразу видны – без лишнего тапа по
   переключателю ("Ввести URL вручную"/"⬆ Загрузить файл"), скрытому
   вместе с остальным. #m-folder остаётся в разметке и работает как
   раньше (шлёт загрузку в папку текущей темы) – скрыт только выбор. */
.ce-mobile-add-char #folder-field,
.ce-mobile-add-char #gallery-status,
.ce-mobile-add-char #gallery-grid,
.ce-mobile-add-char .manual-toggle { display: none; }
.ce-mobile-add-char .manual-section { display: block; }

#modal-overlay .field { margin-bottom: .85rem; }
#modal-overlay .status-msg { font-size: .75rem; }
.img-preview { width: 60px; height: 90px; object-fit: cover; border-radius: 1px; border: 1px solid var(--border2); margin-top: .5rem; display: none; }

.add-tier-row { display: flex; align-items: center; gap: .5rem; padding: .6rem; border: 1px dashed var(--border2); border-radius: 2px; flex-wrap: wrap; }
.add-tier-row input {
  flex: 1; min-width: 120px; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .5rem .7rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif; font-size: .95rem; outline: none;
}
/* Правило выше (flex: 1; min-width: 120px) задевало и поле цвета –
   вместо квадратика с цветом выходила серая полоса на всю ширину. */
.add-tier-row input[type="color"] { flex: none; min-width: 0; width: 34px; height: 34px; padding: 2px; }

@keyframes ceFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.editor-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic; border: 1px dashed var(--border); border-radius: 2px; }

/* Маршрут #/favorites-edit (см. план перехода, фаза 3.2) – та же
   вёрстка, что раньше жила в app/favorites-edit.html. .fe-view input,
   .fe-view select, а не голые input/select – на исходной странице это
   была вся страница целиком, а тут – общий документ, и без прицела
   правило задело бы вообще все поля ввода приложения, вплоть до
   поиска в «Отзывах». */
.fe-view input, .fe-view select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .65rem .85rem; color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; outline: none;
  transition: border-color .2s, background .2s; appearance: none; -webkit-appearance: none;
}
.fe-view input:focus, .fe-view select:focus { border-color: var(--red); background: var(--bg2); }
.fe-view input::placeholder { color: var(--text-dim); }
/* textarea здесь не было в списке выше – «Биография» и «Цитаты» в
   анкете персонажа рисовались браузерным полем по умолчанию: узкое
   окошко моноширинным шрифтом посреди формы с антиквой. Те же правила,
   что у input, плюс высота под абзац и растягивание только по высоте. */
.fe-view textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .65rem .85rem; color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; line-height: 1.6; outline: none;
  transition: border-color .2s, background .2s; resize: vertical;
}
.fe-view #f-profile-bio { min-height: 8rem; }
.fe-view textarea:focus { border-color: var(--red); background: var(--bg2); }
.fe-view textarea::placeholder { color: var(--text-dim); font-family: inherit; }

.field-subtype { display: none; }
.field-subtype.visible { display: block; }
#field-from.hidden-field { display: none; }

/* Редактор записи «Любимого» в две колонки (favorites-edit.js, mount):
   слева – превью карточки и всё про картинку (прилипает при прокрутке),
   справа – поля. Шапка с «Сохранить» – общие .app-topbar.ed-bar из
   admin.css, как у редактора отзыва. */
main.fe-view { max-width: 1180px; margin: 0 auto; padding: 1.6rem 2rem 6rem; }
main.fe-view > .status-msg { text-align: left; margin: 0 0 1rem; min-height: 0; }
main.fe-view > .status-msg:empty { display: none; }
.fe-cols { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 0 3rem; align-items: start; }
.fe-side {
  position: sticky; top: 1.2rem;
  display: flex; flex-direction: column; gap: .9rem; min-width: 0;
}
.fe-side-label {
  font-family: 'DM Sans', sans-serif; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-dim);
}
.fe-preview .card { max-width: 220px; animation: none; cursor: default; }
.fe-imgbox {
  display: flex; flex-direction: column; gap: .8rem;
  padding: .95rem; border: 1px solid var(--border); border-radius: 4px; background: var(--surface);
}
.fe-imgbox .field { margin: 0; }
.fe-imgbox #avatar-img { display: none !important; }
.fe-img-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.fe-main { min-width: 0; }
/* Поиск на AniList над формой (feLookup* в favorites-edit.js). */
.fe-lookup { margin-bottom: 2rem; padding: .9rem 1rem; border: 1px dashed var(--border2); border-radius: 4px; }
.fe-lookup[hidden] { display: none; }
.fe-lookup-row { display: flex; gap: .6rem; }
.fe-lookup-row input { flex: 1; min-width: 0; }
.fe-lookup-hint { margin-top: .5rem; font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--text-dim); line-height: 1.45; }
.fe-lookup-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: .6rem; margin-top: .8rem; }
.fe-lookup-results:empty { display: none; }
.fe-lookup-item {
  display: flex; flex-direction: column; gap: .25rem; text-align: left; padding: 0 0 .5rem; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; color: inherit; font: inherit;
  transition: border-color .15s;
}
.fe-lookup-item:hover, .fe-lookup-item:focus-visible { border-color: var(--red-hi); outline: none; }
.fe-lookup-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: 50% 20%; display: block; }
.fe-lookup-name { padding: 0 .5rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: .9rem; color: var(--text-hi); line-height: 1.25; }
.fe-lookup-sub { padding: 0 .5rem; font-family: 'DM Sans', sans-serif; font-size: .66rem; color: var(--text-dim); line-height: 1.3; }
.fe-lookup-msg { grid-column: 1 / -1; font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text-dim); }
.fe-lookup-msg.err { color: var(--err); }
.fe-main > .section-title:first-child { margin-top: 0; }
.fe-main #linked-titles-list:not(:empty) { margin-bottom: .8rem; }
/* Кнопка «Добавить источник» стояла вплотную к следующему заголовку
   («Персонажи», «Персоны» – группы связей ниже). */
.fe-main #linked-favorites-groups { margin-top: 2.4rem; }
.fe-danger {
  margin-top: 3rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1rem;
  font-family: 'DM Sans', sans-serif; font-size: .78rem; color: var(--text-dim);
}
.fe-danger[hidden] { display: none; }
.fe-danger .link-danger {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-size: .85rem; color: var(--err); text-decoration: underline; text-underline-offset: 3px;
}
@media (max-width: 900px) {
  main.fe-view { padding: 1.2rem 1rem 6rem; }
  .fe-cols { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; }
  .fe-side { position: static; }
  .fe-preview .card { max-width: 160px; }
}

.avatar-preview-row { display: flex; align-items: center; gap: .8rem; margin-top: .6rem; }
.avatar-preview {
  width: 80px; height: 80px; object-fit: cover; border-radius: 50%;
  border: 1px solid var(--border2); display: none; flex-shrink: 0;
  cursor: pointer;
}

.btn-save::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-top: 1px solid var(--red-dim); border-left: 1px solid var(--red-dim); }
.btn-save::after  { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-bottom: 1px solid var(--red-dim); border-right: 1px solid var(--red-dim); }

/* Маршрут #/backup-history (см. план перехода, фаза 3.5) – .bh-view
   вместо голого main, та же причина, что у .ro-view/.ce-view/.fe-view
   выше: не задевать <main> самой рельсы. Остального CSS для этого
   маршрута не требуется – .file-tabs/.history-retention/.state-box/
   .spinner уже общие (admin.css/style.css). */
.bh-view { max-width: 900px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

/* ══ Маршрут #/add – редактор отзыва (план перехода, фаза 3.3) ══
   Тот же CSS, что раньше жил в <style> самой app/add.html (файл никуда
   не делся: он по-прежнему грузится отдельным документом в iframe
   модалки «Добавить себе» на чужом паспорте – см. шапку
   js/routes/add.js). .add-view вместо голых селекторов – та же причина,
   что у .ro-view/.ce-view/.fe-view/.bh-view выше: здесь один документ
   на всё приложение, и правило вроде «input, textarea, select» без
   прицела перекрасило бы вообще все поля ввода, вплоть до поиска в
   «Отзывах» и полей на других маршрутах.

   Ширина/поля <main> – как на исходной странице (style.css, main), а не
   как у рельсы (main выше в этом файле переопределён на 1800px). */
.add-view { max-width: 860px; margin: 0 auto; padding: 3rem 2rem 6rem; }

.add-view .section-title .sub { font-size: .8rem; font-weight: 400; font-style: italic; color: var(--text-dim); }

.add-view input, .add-view textarea, .add-view select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .65rem .85rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
.add-view input:focus, .add-view textarea:focus, .add-view select:focus { border-color: var(--red); background: var(--bg2); }
.add-view input::placeholder, .add-view textarea::placeholder { color: var(--text-dim); }

.add-view textarea { resize: vertical; min-height: 100px; line-height: 1.7; }

/* ══ ПЕРЕКЛЮЧАТЕЛЬ «Любимое» ═════════════════════
   Вместо системного чекбокса (белый квадрат, который на тёмном фоне
   выбивался) – кнопка со всей надписью. Сам <input type="checkbox">
   остался, но скрыт: на его .checked завязаны заполнение и сохранение
   формы. Вид берёт у обычной .btn .btn-ghost, чтобы участвовать в темах. */
.add-view .btn.fav-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .7rem .85rem;
  text-transform: none;
  font-size: .75rem;
  letter-spacing: .05em;
  user-select: none;
}
/* Сердце – svg, а не символ '♡'/'♥' из шрифта: ни один из
   самохостящихся шрифтов их не содержит (проверено по cmap). */
.add-view .fav-toggle-icon { flex-shrink: 0; }
.add-view .fav-toggle.on .fav-toggle-icon { fill: currentColor; }
.add-view .btn.fav-toggle.on { border-color: var(--accent-line); background: var(--accent-fill); color: var(--red-hi); }
.add-view .btn.fav-toggle.on:hover { background: var(--accent-fill-hi); color: var(--red-hi); }

/* ══ СВОРАЧИВАЕМЫЕ РАЗДЕЛЫ ═══════════════════════
   Свёрнутый раздел – одна строка-кнопка, ровно как у обложки и
   источников. Состояние держится классом на обёртке, так открытая и
   закрытая части не могут разъехаться. */
.add-view .sec { margin-bottom: .75rem; }
.add-view .sec > .sec-toggle { display: none; }
.add-view .sec.collapsed > .sec-toggle { display: block; }
.add-view .sec.collapsed > .sec-body { display: none; }

.add-view .sec-body { border: 1px solid var(--border); border-radius: 2px; padding: .9rem 1rem 1rem; background: var(--tint); }

.add-view .sec-head { display: flex; align-items: center; gap: .8rem; margin-bottom: .9rem; }
.add-view .sec-head .sec-title {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
  font-size: 1.05rem; color: var(--text-hi);
}
.add-view .sec-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }
.add-view .sec-head .icon-btn { flex-shrink: 0; order: 3; }

/* Внутри раздела нижний отступ последнего поля лишний */
.add-view .sec-body > .field:last-child,
.add-view .sec-body > .grid:last-child { margin-bottom: 0; }

.add-view .hint {
  font-size: .68rem;
  padding: .55rem .85rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--tint-hi);
  margin-bottom: 1.25rem;
  margin-top: -.25rem;
}

.add-view .preview-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 2px solid var(--red-dim);
  border-radius: 2px;
  padding: .85rem 1rem;
  margin-top: .5rem;
  font-size: .95rem;
  line-height: 1.7;
  color: var(--text);
  font-style: italic;
  min-height: 60px;
}

.add-view .cover-preview-col { display: flex; flex-direction: column; align-items: center; gap: .4rem; flex-shrink: 0; }
.add-view .cover-preview {
  width: 64px; height: 96px;
  object-fit: cover;
  border: 1px solid var(--border2);
  border-radius: 2px;
  display: none;
  flex-shrink: 0;
  cursor: pointer;
}
.add-view .cover-focus-btn { font-size: .62rem; padding: .3rem .5rem; white-space: nowrap; }

.add-view .cover-block {
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1.1rem;
  margin-top: .75rem;
}
.add-view .cover-block.hidden { display: none; }
.add-view .cover-controls { flex: 1; min-width: 0; }
.add-view .cover-controls-head { display: flex; align-items: flex-end; gap: .6rem; margin-bottom: .6rem; }
.add-view .cover-upload-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

/* ══ ОЦЕНКИ ══════════════════════════════════════ */
.add-view .grades-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
.add-view .grade-btn {
  font-family: 'Playfair Display', serif;
  font-size: .82rem;
  font-weight: 700;
  padding: .35rem .85rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  background: var(--tint-hi);
  position: relative;
}
.add-view .grade-btn::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 6px; height: 6px;
  border-top: 1px solid currentColor;
  border-left: 1px solid currentColor;
  opacity: 0;
  transition: opacity .15s;
}
.add-view .grade-btn.active::before { opacity: 1; }
.add-view .grade-btn.active { filter: brightness(1.4); }

.add-view button.icon-btn {
  background: none; border: 1px solid var(--border2); color: var(--text-dim);
  width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 4px; font-size: .8rem; cursor: pointer; flex-shrink: 0;
}
.add-view button.icon-btn:hover { color: var(--text-hi); border-color: var(--red); background: none; }

/* ══ ССЫЛКИ-КНОПКИ, ОПАСНАЯ ЗОНА ══════════════════
   Окно «Теги и категории» оформлено в admin.css (.tm-panel и соседи) –
   там же, где весь обновлённый редактор. Здесь – то, чем пользуются и
   окно, и сама форма. */
.add-view .tm-link {
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim);
  text-decoration: underline; text-underline-offset: 3px;
}
.add-view .tm-link:hover { color: var(--text-hi); }
.add-view .tm-link:disabled { opacity: .45; cursor: default; }
.add-view .tm-danger { color: var(--err); }
.add-view .tm-danger:hover { color: #e8a4a4; }

.add-view .danger-zone {
  margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .7rem;
}
.add-view .danger-hint { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim); flex: 1; min-width: 12rem; }

.add-view .btn-new-danger { border-color: var(--err); color: var(--err); }
.add-view .btn-new-danger:hover { background: var(--err-wash, rgba(163,51,51,.12)); border-color: var(--err); }

/* Квадратик-галочка у строк «Какие теги показывать на карточке». */
.add-view .tm-row-check {
  width: 14px; height: 14px; flex-shrink: 0; border-radius: 3px;
  border: 1px solid var(--border2); position: relative;
}

/* ── Какие теги показывать на карточке ── */
.add-view .card-tags-hint { font-family: 'DM Sans', sans-serif; font-size: .7rem; color: var(--text-dim); margin: .3rem 0 .7rem; }
.add-view .card-tags-count { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin: .5rem .1rem 0; }
.add-view .card-tag-row {
  display: flex; align-items: center; gap: .6rem; cursor: pointer;
  padding: .4rem .1rem; border-bottom: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text);
}
.add-view .card-tag-row:last-child { border-bottom: none; }
.add-view .card-tag-row.selected { color: var(--text-hi); }
.add-view .card-tag-row.selected .tm-row-check { border-color: var(--red); background: var(--red-dim); }
.add-view .card-tag-row.selected .tm-row-check::after {
  content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
  border: solid var(--text-hi); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.add-view .card-tag-row.disabled { opacity: .4; cursor: not-allowed; }
.add-view .card-tag-row-name { flex: 1; }
.add-view .card-tags-none-row { border-bottom: 1px solid var(--border); margin-bottom: .2rem; }
#card-tags-list.disabled { opacity: .35; pointer-events: none; }

/* ══ ТЕГИ ════════════════════════════════════════ */
.add-view .tags-grid { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
.add-view .tag-toggle {
  font-family: 'DM Sans', sans-serif;
  font-size: .63rem;
  padding: .25rem .65rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--tint-line);
  background: var(--tint);
  color: var(--text-dim);
  transition: all .15s;
  user-select: none;
  letter-spacing: .03em;
}
.add-view .tag-toggle:hover { color: var(--text); border-color: var(--tint-line-hi); }
.add-view .tag-toggle.active { background: var(--accent-fill); border-color: rgba(192,57,43,.4); color: var(--err); }

/* Уголки у «Сохранить» уже описаны выше (маршрут #/favorites-edit) –
   здесь только то, чем версия из add.html от неё отличалась: плавный
   переход цвета и подсветка на наведение. Общими их не делаем, чтобы не
   менять поведение кнопки на других маршрутах. */
.add-view .btn-save::before, .add-view .btn-save::after { transition: border-color .2s; }
.add-view .btn-save:hover::before, .add-view .btn-save:hover::after { border-color: var(--red-hi); }

/* Маршрут #/settings-edit (см. план перехода, фаза 3.4) – та же
   вёрстка, что раньше жила в app/settings-edit.html (файл удалён в
   фазе 4, см. js/routes/settings-edit.js).
   :where(.set-view) вместо голых селекторов – та же причина, что у .add-view
   выше: у настроек «label», «input, select», «h1» и «.row» были
   глобальными правилами отдельного документа и никого не задевали, а
   здесь задели бы вообще все поля ввода приложения.
   Селекторы по id (#app/#main/#sidebar/#locked) оставлены как были,
   БЕЗ префикса :where(.set-view) – нарочно: themes.css красит #sidebar через
   [data-skin="…"] #sidebar, и префикс поднял бы специфичность до той
   же, а этот <style> идёт в <head> позже темы – сайдбар в «Брутализме»
   потерял бы свою рамку. Эти id всё равно есть только внутри маршрута. */
.set-view { display: flex; }

#locked { width: 100%; }
#locked a { color: var(--red-hi); }
/* Утилитарный класс должен побеждать любые другие правила отображения
   (в т.ч. #app { display:flex } ниже) – иначе элемент с id может
   остаться видимым несмотря на добавленный класс .hidden (баг:
   настройки на миг показывались разлогиненным пользователям).
   В отличие от исходной страницы правило прицелено внутрь .set-view:
   общий .hidden { display: none } у index.html трогать нельзя. */
:where(.set-view) .hidden { display: none !important; }

/* padding-left держит место под #sidebar (position: fixed, вне потока
   – см. её комментарий ниже) так, чтобы #main центрировался в
   ОСТАВШЕЙСЯ после сайдбара ширине, а не прилипал прямо к его краю.
   Значение по умолчанию – 220px, дефолтная ширина колонки; при
   resize мышью его пересчитывает тот же скрипт, что раньше двигал
   margin-left у #main напрямую (см. ResizeObserver у #sidebar). */
#app { display: flex; width: 100%; padding-left: 220px; }

#sidebar {
  width: 220px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 24px 0;
  position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  background: var(--bg);
  z-index: 2;
}
/* Раньше здесь был position: sticky с явной height: 100vh (вместо
   auto/stretch по флексу – тот вариант ломал sticky совсем: контейнер
   и колонка одной высоты, «стянуть» некуда). Но и sticky с явной
   высотой всё равно уезжала вместе со страницей – воспроизвелось у
   пользователя на видео, хотя в этой же вёрстке без масштабирования
   страницы всё было на месте. Причина – в Chromium известно ломается
   расчёт position: sticky, когда масштаб страницы (webContents.
   setZoomFactor в electron/main.js, ползунок «Масштаб» в этой же
   панели) отличается от 100%. Sticky тут вообще не нужен: колонка
   всегда занимает весь экран по высоте – fixed делает ровно то же
   самое визуально, но не зависит от этого расчёта. #app получает
   соответствующий padding-left по скрипту (см. ResizeObserver у
   #sidebar в js/routes/settings-edit.js), а overflow-y: auto здесь по
   прежней причине: список разделов может не поместиться в невысокое
   окно – тогда его можно прокрутить, но не колесом мыши (см.
   обработчик wheel там же). */
/* Растягивание мышью – см. js/utils.js, makeResizablePanel(); тот же
   приём, что и у рельсы на главной (.rail-resize выше). */
:where(.set-view) .sidebar-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 5;
}
#sidebar a.back {
  display: block; margin: 0 20px 20px;
  color: var(--text); text-decoration: none; font-size: .95rem; font-weight: 600;
  padding: 6px 10px 6px 4px;
  position: sticky; top: 0; z-index: 1; background: var(--bg);
}
#sidebar a.back:hover { color: var(--text-hi); }
:where(.set-view) .side-tab {
  display: block; width: 100%; text-align: left;
  background: none; border: none; margin: 0;
  padding: 10px 20px; font-size: .85rem;
  color: var(--text-dim); cursor: pointer;
  border-left: 2px solid transparent;
}
:where(.set-view) .side-tab:hover { color: var(--text); background: var(--surface2); }
:where(.set-view) .side-tab.active { color: var(--text-hi); border-left-color: var(--red); background: var(--surface2); }

/* Подписи групп пунктов: «Вид», «Данные», «Перенос» (js/routes/
   settings-edit.js, settingsViewHtml). Раньше двенадцать пунктов шли
   одним списком, «История версий» – отдельно, под чертой; теперь она
   в «Данных» рядом с папкой, синхронизацией и хранилищами. */
:where(.set-view) .side-group {
  font-family: 'DM Sans', sans-serif; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); opacity: .75; padding: 16px 18px 6px;
}
:where(.set-view) #sidebar .back + .side-group { padding-top: 6px; }

/* Заголовок влитого раздела внутри панели («Подписи» в «Оформлении»,
   «Хранилища» в синхронизации) – с чертой, чтобы читался отдельным. */
:where(.set-view) .set-merged-h {
  font-family: 'Playfair Display', serif; font-size: 1.15rem; margin: 40px 0 14px;
  padding-top: 24px; border-top: 1px solid var(--border);
}

/* Разделы в колонки («Вкладки», «Горячие клавиши», группы «Подписей»)
   и сетки вместо длинных списков в одну строку (палитра, цвета типов,
   блоки статистики) – в окне настроек под них есть ширина. min() –
   на узком экране колонка не шире самого экрана. */
:where(.set-view) .set-cols {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr));
  gap: 28px 40px; align-items: start;
}
:where(.set-view) .set-cols > * { min-width: 0; }
:where(.set-view) .set-cols .set-sec .set-sec-toggle,
:where(.set-view) .set-cols > div > h2.section-h:first-child { margin-top: 0; }
:where(.set-view) #paletteList,
:where(.set-view) #typeColorsList,
:where(.set-view) #statsList {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); column-gap: 28px;
}
/* Пояснения длинными строками не читаются – держим около 75 знаков. */
:where(.set-view) .panel-intro,
:where(.set-view) #syncPanel p,
:where(.set-view) #panel-app p { max-width: 74ch; }

/* Одна полоса «Сохранить» (settings-edit.js, #set-savebar) – прилипает
   к низу прокручиваемой области, видна, пока есть несохранённое. */
.set-savebar {
  display: flex; align-items: center; gap: 14px;
  position: sticky; bottom: 16px; z-index: 50; margin: 28px 0 16px;
  background: var(--surface2); border: 1px solid var(--accent-line); border-radius: 2px;
  padding: 10px 12px 10px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  font-family: 'DM Sans', sans-serif; font-size: .82rem; color: var(--text);
}
.set-savebar[hidden] { display: none; }
.set-savebar-text { flex: 1; }
:where(.set-view) .set-savebar .btn { margin: 0; }
.set-savebar-save {
  font-family: 'DM Sans', sans-serif; font-size: .82rem; height: 34px; padding: 0 18px;
  background: var(--accent-fill); color: var(--text-hi); border: 1px solid var(--accent-line); border-radius: 2px; cursor: pointer;
}
.set-savebar-save:hover { border-color: var(--red-hi); }
.set-savebar-save:disabled { opacity: .6; cursor: default; }

/* ✕ окна настроек – виден только в режиме окна (см. ниже). */
.set-close {
  display: none; position: absolute; top: 12px; right: 14px; z-index: 5;
  width: 32px; height: 32px; align-items: center; justify-content: center;
  background: none; border: 1px solid transparent; border-radius: 2px;
  color: var(--text-dim); font-size: 1.1rem; cursor: pointer;
}
.set-close:hover { color: var(--text-hi); border-color: var(--border2); }

/* min-width: 0 – иначе колонка не даёт себе стать уже содержимого,
   и на узком экране за край уезжает вся страница, а не отдельный
   широкий блок внутри. margin: 0 auto центрирует узкую (max-width:
   680px) колонку в пространстве, которое #app оставляет под неё –
   то есть во всей ширине ЗА ВЫЧЕТОМ padding-left под #sidebar. */
#main { flex: 1; min-width: 0; max-width: 680px; padding: 40px 32px; margin: 0 auto; }
:where(.set-view) h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin: 0 0 24px; }
/* Видна только на телефоне (см. её же правило в самом низу мобильного
   блока ниже) – на ПК сайдбар и так открыт целиком, возвращаться
   в список неоткуда и незачем. */
.settings-panel-back { display: none; }

/* Телефон. Сайдбар в 220px тут съедал больше половины ширины, и на
   содержимое оставалось около сотни пикселей – уезжали все панели
   без исключения. Раньше вместо колонки делали прокручиваемую пальцем
   строку сверху, как вкладки на главной – но 12+ разделов в одну
   строку то же самое узкое место просто сдвигали в другую сторону:
   часть подписей всё равно приходилось обрезать или листать вбок
   вслепую. Вместо этого – тот же приём, что у iOS/Telegram/большинства
   мобильных приложений: список разделов и открытая панель показываются
   по очереди, не одновременно. #app.mobile-panel-open – единственный
   переключатель между двумя состояниями (ставит/снимает его клик по
   .side-tab и «Все настройки», см. js/routes/settings-edit.js), а не
   отдельные видимость+ширина+padding, как было при горизонтальной
   строке. */
@media (max-width: 720px) {
  #app { flex-direction: column; padding-left: 0; }
  #app.mobile-panel-open #sidebar { display: none; }
  #app:not(.mobile-panel-open) #main { display: none; }

  #sidebar {
    width: auto; height: auto; position: static;
    border-right: none;
    padding: 4px 0 24px;
    display: block;
  }
  :where(.set-view) .sidebar-resize { display: none; }
  #sidebar a.back {
    margin: 0; position: static; background: none;
    padding: 16px; font-size: 1rem;
  }
  :where(.set-view) .side-tab {
    display: flex; align-items: center; gap: 12px;
    width: 100%; white-space: normal; text-align: left;
    padding: 13px 16px;
    border-left: none; border-bottom: 1px solid var(--border);
    font-size: .95rem;
  }
  :where(.set-view) .side-tab-icon {
    display: block; width: 20px; height: 20px; flex-shrink: 0;
    color: var(--text-dim);
  }
  :where(.set-view) .side-tab.active { border-left-color: transparent; background: var(--surface2); }
  :where(.set-view) .side-tab.active .side-tab-icon { color: var(--red); }
  /* Шеврон списка – тот же смысл, что «>» в iOS Settings: пункт
     открывает подэкран, а не просто выделяется как вкладка. */
  :where(.set-view) .side-tab::after {
    content: "›"; margin-left: auto; padding-left: 8px; flex-shrink: 0;
    font-size: 1.3rem; line-height: 1; color: var(--text-dim); opacity: .6;
  }

  /* margin: 0 auto в базовом правиле (десктоп, #app – ряд) центрирует
     #main против широкого экрана. На телефоне #app становится колонкой
     (см. выше) – в колоночном флексе те же auto-отступы уже не растягивают
     элемент на всю ширину, а центрируют его ПО СОДЕРЖИМОМУ (margin: auto
     на поперечной оси означает «не тянуться», а не «тянуться и центрировать
     остаток»). #main схлопывался до ширины своего самого широкого ряда –
     этим объяснялась вся кривая вёрстка списков настроек на телефоне: не
     сами строки были неправильными, а контейнер вокруг них был вдвое уже
     экрана. */
  #main { max-width: none; margin: 0; padding: 0 16px 64px; }
  .settings-panel-back {
    display: flex; align-items: center; gap: 8px;
    width: calc(100% + 32px); margin: 0 -16px 8px; padding: 16px;
    background: none; border: none; border-bottom: 1px solid var(--border);
    color: var(--text); font-size: .95rem; font-weight: 600;
    cursor: pointer;
  }
  .settings-panel-back svg { width: 18px; height: 18px; flex-shrink: 0; }
}
@media (min-width: 721px) {
  /* Иконки пунктов – и на ПК тоже: в окне настроек сайдбар не тесный,
     а пункты с иконками находятся глазом быстрее (как в рельсе). */
  :where(.set-view) .side-tab { display: flex; align-items: center; gap: 10px; }
  :where(.set-view) .side-tab-icon { width: 15px; height: 15px; flex: none; color: var(--text-dim); }
  :where(.set-view) .side-tab.active .side-tab-icon { color: var(--red); }

  /* Полки «Оценок»: название и описание – в одну строку, а не
     описание отдельной строкой под каждой полкой. */
  :where(.set-view) .shelf-row {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center;
  }
  :where(.set-view) .shelf-row > * { margin: 0; }

  /* ── Настройки окном поверх приложения (как в Obsidian) ──
     router.js вешает .route-overlay на #view-root у маршрутов с
     overlay: true и при этом не прячет #shell-root – рельса и вкладки
     остаются под затемнением. Раньше настройки занимали весь экран:
     колонка в 680px посередине широкого монитора и пустота по бокам.
     z-index ниже .modal-overlay (1000): свои вопросы («Сохранить?»,
     «Удалить?») настройки показывают поверх себя. */
  #view-root.route-overlay:not(.hidden) {
    position: fixed; inset: 0; z-index: 900;
    display: flex; align-items: center; justify-content: center;
    background: var(--scrim, rgba(0, 0, 0, .62));
    padding: calc(var(--app-titlebar, 0px) + 24px) 24px 24px;
  }
  #view-root.route-overlay > .set-view { width: min(1180px, 100%); height: min(860px, 100%); }
  #view-root.route-overlay #app,
  #view-root.route-overlay #locked:not(.hidden) {
    position: relative; display: flex; width: 100%; height: 100%;
    padding-left: 0 !important;
    background: var(--bg); border: 1px solid var(--border2); border-radius: 2px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6); overflow: hidden;
  }
  #view-root.route-overlay #locked:not(.hidden) { display: block; padding: 32px; }
  #view-root.route-overlay #sidebar {
    position: static; height: auto; flex: none; background: var(--surface); padding: 18px 0;
  }
  /* Выход – ✕ в углу, Escape и клик по затемнению; «На главную» и
     ручка ширины сайдбара в окне лишние. */
  #view-root.route-overlay #sidebar .back,
  #view-root.route-overlay .sidebar-resize { display: none; }
  #view-root.route-overlay #sidebar .back + .side-group { padding-top: 6px; }
  #view-root.route-overlay #main {
    max-width: none; margin: 0; overflow-y: auto; padding: 28px 40px 0; scrollbar-width: thin;
  }
  #view-root.route-overlay #main h1 { margin-right: 44px; }
  #view-root.route-overlay .set-close { display: flex; }
}

/* Стрелка у сворачиваемых разделов (.set-sec): без неё свёрнутый
   раздел выглядел пустым заголовком – так «Блоки статистики» в
   «Подписях» казались разделом без единого поля. */
:where(.set-view) .set-sec .set-sec-toggle::before {
  content: ""; width: 7px; height: 7px; flex: none; margin: 0 4px 0 2px;
  border-right: 1.5px solid var(--text-dim); border-bottom: 1.5px solid var(--text-dim);
  transform: rotate(-45deg); transition: transform .15s;
}
:where(.set-view) .set-sec:not(.collapsed) .set-sec-toggle::before { transform: rotate(45deg); }

/* Классическая тема: кнопки одним видом (без капса и разрядки, как
   «Изменить»/«Скачать» рядом), пояснения – читаемым рубленым шрифтом
   вместо мелкой тусклой антиквы. Другие темы оформляют это по-своему. */
:is(html:not([data-skin]), html[data-skin^="classic"]) :where(.set-view) :is(.btn.btn-ghost, .btn-mini, .btn-dashed) {
  font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 400;
  text-transform: none; letter-spacing: 0; border-radius: 2px;
}
:is(html:not([data-skin]), html[data-skin^="classic"]) :where(.set-view) :is(.panel-intro, .pal-hint, #syncPanel p, #panel-app p, #passportsPanel p) {
  font-family: 'DM Sans', sans-serif; font-size: .82rem; line-height: 1.55; color: var(--text-dim);
}
:is(html:not([data-skin]), html[data-skin^="classic"]) :where(.set-view) .pal-hint { font-size: .72rem; }
:is(html:not([data-skin]), html[data-skin^="classic"]) :where(.set-view) .pal-name {
  font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text);
}

:where(.set-view) .panel { display: none; }
:where(.set-view) .panel.active { display: block; }
:where(.set-view) .panel-intro { color: var(--text-dim); font-size: .9rem; margin-bottom: 20px; }
:where(.set-view) .panel-intro a { color: var(--red-hi); text-decoration: none; }
:where(.set-view) .panel-intro a:hover { text-decoration: underline; }
/* --text-dim в классической, мягкой ботанической, неоморфизме и
   рисованной темах слишком близок к фону – рядом с обычным текстом
   (.sync-intro, тот же по сути пояснительный абзац, просто другого
   класса) читается заметно тусклее. В брутализме та же пара цветов
   на предельно чёрно-белом фоне ещё держит контраст, там не трогаем. */
[data-skin="classic"] :where(.set-view) .panel-intro,
[data-skin="soft"] :where(.set-view) .panel-intro,
[data-skin="soft-dark"] :where(.set-view) .panel-intro,
[data-skin="neomorphism"] :where(.set-view) .panel-intro,
[data-skin="neomorphism-dark"] :where(.set-view) .panel-intro,
[data-skin="doodle"] :where(.set-view) .panel-intro,
[data-skin="doodle-dark"] :where(.set-view) .panel-intro {
  color: var(--text);
}

:where(.set-view) .sync-intro { color: var(--text); font-size: .9rem; margin-bottom: 20px; }
:where(.set-view) .sync-intro a { color: var(--red-hi); text-decoration: none; }
:where(.set-view) .sync-intro a:hover { text-decoration: underline; }

:where(.set-view) .theme-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
:where(.set-view) .theme-option {
  border: 1px solid var(--border2); border-radius: 2px; padding: 10px 14px;
  cursor: pointer; font-size: .85rem; background: var(--surface); color: var(--text);
  font-family: 'DM Sans', sans-serif; transition: all .15s;
}
:where(.set-view) .theme-option:hover { border-color: var(--red-dim); color: var(--text-hi); }
:where(.set-view) .theme-option.selected { border-color: var(--red); color: var(--text-hi); background: var(--accent-wash); }

/* Попап выбора тёмная/светлая под пилюлей стиля. Позиционируется от
   .theme-group, а не от самой пилюли, – так рамка попапа не скачет,
   если пилюля меняет ширину (например, у неё появляется подпись
   "– тёмная" после выбора). */
:where(.set-view) .theme-group { position: relative; }
:where(.set-view) .theme-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  display: flex; flex-direction: column; gap: 2px; min-width: 150px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 2px;
  padding: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
:where(.set-view) .theme-popover.hidden { display: none; }
:where(.set-view) .theme-popover button {
  background: none; border: none; text-align: left; padding: 8px 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .82rem; color: var(--text);
  border-radius: 1px; transition: background .12s, color .12s;
}
:where(.set-view) .theme-popover button:hover { background: var(--surface2); color: var(--text-hi); }
:where(.set-view) .theme-popover button.current { color: var(--red-hi); }

:where(.set-view) label { display: block; font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; margin: 16px 0 6px; }
/* Голый input, а не input[type="text"]: у [data-skin="…"] input в
   themes.css специфичность выше (добавлен атрибутный селектор), и
   он спокойно перебивает эту строку в темах, которые сами её не
   задают. Префикс :where(.set-view) поднимает специфичность на один класс –
   ровно столько же добавляет и .add-view выше, и там это уже
   проверено: тема по-прежнему побеждает (у неё атрибут + элемент). */
:where(.set-view) input, :where(.set-view) select {
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text-hi);
  border-radius: 2px; padding: 8px 10px; font-size: .9rem; font-family: 'Cormorant Garamond', serif;
  outline: none; transition: border-color .2s, background .2s;
}
:where(.set-view) input[type="text"]:focus, :where(.set-view) input[type="number"]:focus { border-color: var(--red); background: var(--bg2); }
:where(.set-view) input[type="color"] { width: 60px; height: 34px; padding: 2px; cursor: pointer; }
:where(.set-view) input[type="text"] { width: 100%; box-sizing: border-box; }

:where(.set-view) .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 4px; }
:where(.set-view) .row > div { flex: 1; min-width: 160px; }

/* Кнопки – .btn/.btn-primary/.btn-ghost/.btn-save/.icon-btn общие
   (style.css), уголки .btn-save::before/::after уже описаны выше в
   этом же файле (фаза #/add) – дублировать не нужно. */

/* Фон/рамка/радиус – уже в общем правиле input, select выше;
   здесь только то, что нужно именно select. */
:where(.set-view) select {
  width: 100%; box-sizing: border-box; font-size: .95rem;
}
:where(.set-view) select:focus { border-color: var(--red); }

:where(.set-view) .status-msg { margin-top: 12px; font-size: .83rem; }

/* margin явно, а не браузерный дефолт у <h2> – он у разных браузеров/
   элементов вокруг разный (em от собственного font-size, схлопывается
   с соседями по-разному), из-за чего между разделами настроек то почти
   не было отступа, то оказывался почти сантиметр пустоты. Первый
   заголовок панели – без отступа сверху, ему не с чем схлопываться. */
:where(.set-view) h2.section-h { font-size: 1.05rem; color: var(--text-hi); margin: 28px 0 12px; }
:where(.set-view) .panel > h2.section-h:first-child { margin-top: 0; }

/* ── ПЕРЕКЛЮЧАТЕЛЬ «Скрыть теги на всех карточках» ──
   Тот же приём, что у .fav-toggle в редакторе отзыва (add-view: кнопка
   на всю ширину вместо системного чекбокса), но свои правила здесь, а
   не переиспользование класса .fav-toggle – это две разные страницы,
   и .add-view/.set-view нарочно не делят классы между собой (см. шапку
   этого файла про :where()). Глаз – та же svg из eyeIcon() (js/utils.js),
   что и у остальных «скрыть/показать» на этой же странице. */
:where(.set-view) .btn.hide-tags-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .7rem .85rem;
  text-transform: none;
  font-size: .75rem;
  letter-spacing: .05em;
  user-select: none;
  margin-top: 4px;
}
:where(.set-view) .hide-tags-toggle-icon { flex-shrink: 0; }
/* Включённое состояние – спокойная подсветка, а не красная плашка:
   во всю ширину красным это читалось как ошибка, хотя это просто
   включённая настройка. */
:where(.set-view) .btn.hide-tags-toggle.on { border-color: var(--accent-line); background: var(--tint-hi); color: var(--text-hi); }
:where(.set-view) .btn.hide-tags-toggle.on:hover { background: var(--accent-fill); color: var(--text-hi); }

/* ── Сворачиваемые разделы настроек ──────────────
   Тот же приём, что у .sec/.sec-toggle в редакторе отзыва: каждый
   h2.section-h в «Вкладках» и «Подписях» и всё, что следует за ним до
   следующего заголовка, оборачивается в .set-sec (см.
   collapsibleizeSettingsSections() в js/routes/settings-edit.js) и по
   умолчанию сворачивается – открывается кликом по заголовку. */
:where(.set-view) .set-sec { margin-bottom: 6px; }
:where(.set-view) .set-sec .set-sec-toggle {
  cursor: pointer;
  display: flex; align-items: center; gap: .55rem;
  user-select: none;
  padding: 6px 4px;
  margin: 22px -4px 0;
  border-radius: 6px;
}
:where(.set-view) .set-sec:first-child .set-sec-toggle { margin-top: 0; }
:where(.set-view) .set-sec .set-sec-toggle:hover { background: var(--tint-hi); }
:where(.set-view) .set-sec .set-sec-body { padding-top: 10px; }
:where(.set-view) .set-sec.collapsed .set-sec-body { display: none; }
:where(.set-view) .set-sec-toggle:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

/* ── Модалка «добавить себе» из чужого паспорта ──
   Тот же приём, что у .review-modal-overlay выше: затемнение на весь
   экран плюс панель по центру. Внутри – iframe с обычным
   add.html?fromPassport=1..., просто в рамке, а не отдельной
   страницей – см. js/passports.js. Имя анимации своё (setFadeUp): в
   этом файле уже есть @keyframes fadeUp с другим сдвигом. */
:where(.set-view) .pp-add-modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 24px;
}
:where(.set-view) .pp-add-modal-overlay.hidden { display: none; }
@keyframes setFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
:where(.set-view) .pp-add-modal-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  width: 100%;
  max-width: 720px;
  height: 90vh;
  position: relative;
  animation: setFadeUp .25s ease both;
}
:where(.set-view) .pp-add-modal-close {
  position: absolute; top: 10px; right: 10px;
  z-index: 1;
  width: 30px; height: 30px;
