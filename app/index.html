  background: var(--surface2); border: 1px solid var(--err); border-radius: 3px;
}
.add-view .tm-cat-delete-choice.hidden { display: none; }
.add-view .tm-cat-delete-choice .tm-note { color: var(--text); margin: 0 0 .7rem; }
.add-view .tm-cat-delete-choice .field { margin-bottom: .7rem; }

/* ══ ТЕГИ ════════════════════════════════════════ */
.add-view .tags-grid { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.5rem; }
.add-view .tag-toggle {
  font-family: 'DM Sans', sans-serif;
  font-size: .63rem;
  padding: .25rem .65rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--tint-line);
  background: var(--tint);
  color: var(--text-dim);
  transition: all .15s;
  user-select: none;
  letter-spacing: .03em;
}
.add-view .tag-toggle:hover { color: var(--text); border-color: var(--tint-line-hi); }
.add-view .tag-toggle.active { background: var(--accent-fill); border-color: rgba(192,57,43,.4); color: var(--err); }

/* Уголки у «Сохранить» уже описаны выше (маршрут #/favorites-edit) —
   здесь только то, чем версия из add.html от неё отличалась: плавный
   переход цвета и подсветка на наведение. Общими их не делаем, чтобы не
   менять поведение кнопки на других маршрутах. */
.add-view .btn-save::before, .add-view .btn-save::after { transition: border-color .2s; }
.add-view .btn-save:hover::before, .add-view .btn-save:hover::after { border-color: var(--red-hi); }

/* Маршрут #/settings-edit (см. план перехода, фаза 3.4) — та же
   вёрстка, что раньше жила в app/settings-edit.html (файл удалён в
   фазе 4, см. js/routes/settings-edit.js).
   :where(.set-view) вместо голых селекторов — та же причина, что у .add-view
   выше: у настроек «label», «input, select», «h1» и «.row» были
   глобальными правилами отдельного документа и никого не задевали, а
   здесь задели бы вообще все поля ввода приложения.
   Селекторы по id (#app/#main/#sidebar/#locked) оставлены как были,
   БЕЗ префикса :where(.set-view) — нарочно: themes.css красит #sidebar через
   [data-skin="…"] #sidebar, и префикс поднял бы специфичность до той
   же, а этот <style> идёт в <head> позже темы — сайдбар в «Брутализме»
   потерял бы свою рамку. Эти id всё равно есть только внутри маршрута. */
.set-view { display: flex; }

#locked { width: 100%; }
#locked a { color: var(--red-hi); }
/* Утилитарный класс должен побеждать любые другие правила отображения
   (в т.ч. #app { display:flex } ниже) — иначе элемент с id может
   остаться видимым несмотря на добавленный класс .hidden (баг:
   настройки на миг показывались разлогиненным пользователям).
   В отличие от исходной страницы правило прицелено внутрь .set-view:
   общий .hidden { display: none } у index.html трогать нельзя. */
:where(.set-view) .hidden { display: none !important; }

/* padding-left держит место под #sidebar (position: fixed, вне потока
   — см. её комментарий ниже) так, чтобы #main центрировался в
   ОСТАВШЕЙСЯ после сайдбара ширине, а не прилипал прямо к его краю.
   Значение по умолчанию — 220px, дефолтная ширина колонки; при
   resize мышью его пересчитывает тот же скрипт, что раньше двигал
   margin-left у #main напрямую (см. ResizeObserver у #sidebar). */
#app { display: flex; width: 100%; padding-left: 220px; }

#sidebar {
  width: 220px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 24px 0;
  position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  background: var(--bg);
  z-index: 2;
}
/* Раньше здесь был position: sticky с явной height: 100vh (вместо
   auto/stretch по флексу — тот вариант ломал sticky совсем: контейнер
   и колонка одной высоты, «стянуть» некуда). Но и sticky с явной
   высотой всё равно уезжала вместе со страницей — воспроизвелось у
   пользователя на видео, хотя в этой же вёрстке без масштабирования
   страницы всё было на месте. Причина — в Chromium известно ломается
   расчёт position: sticky, когда масштаб страницы (webContents.
   setZoomFactor в electron/main.js, ползунок «Масштаб» в этой же
   панели) отличается от 100%. Sticky тут вообще не нужен: колонка
   всегда занимает весь экран по высоте — fixed делает ровно то же
   самое визуально, но не зависит от этого расчёта. #app получает
   соответствующий padding-left по скрипту (см. ResizeObserver у
   #sidebar в js/routes/settings-edit.js), а overflow-y: auto здесь по
   прежней причине: список разделов может не поместиться в невысокое
   окно — тогда его можно прокрутить, но не колесом мыши (см.
   обработчик wheel там же). */
/* Растягивание мышью — см. js/utils.js, makeResizablePanel(); тот же
   приём, что и у рельсы на главной (.rail-resize выше). */
:where(.set-view) .sidebar-resize {
  position: absolute; top: 0; right: -3px; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 5;
}
#sidebar a.back {
  display: block; margin: 0 20px 20px;
  color: var(--text); text-decoration: none; font-size: .95rem; font-weight: 600;
  padding: 6px 10px 6px 4px;
  position: sticky; top: 0; z-index: 1; background: var(--bg);
}
#sidebar a.back:hover { color: var(--text-hi); }
:where(.set-view) .side-tab {
  display: block; width: 100%; text-align: left;
  background: none; border: none; margin: 0;
  padding: 10px 20px; font-size: .85rem;
  color: var(--text-dim); cursor: pointer;
  border-left: 2px solid transparent;
}
:where(.set-view) .side-tab:hover { color: var(--text); background: var(--surface2); }
:where(.set-view) .side-tab.active { color: var(--text-hi); border-left-color: var(--red); background: var(--surface2); }

/* «История версий» — раньше была ссылкой на отдельную страницу
   (backup-history.html), теперь такая же панель, как остальные, но
   визуально отделена от них: это не часть настроек одной темы, а
   отдельная функция сбоку. */
:where(.set-view) .side-tab.side-tab-divider { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 18px; }

/* min-width: 0 — иначе колонка не даёт себе стать уже содержимого,
   и на узком экране за край уезжает вся страница, а не отдельный
   широкий блок внутри. margin: 0 auto центрирует узкую (max-width:
   680px) колонку в пространстве, которое #app оставляет под неё —
   то есть во всей ширине ЗА ВЫЧЕТОМ padding-left под #sidebar. */
#main { flex: 1; min-width: 0; max-width: 680px; padding: 40px 32px; margin: 0 auto; }
:where(.set-view) h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin: 0 0 24px; }
/* Видна только на телефоне (см. её же правило в самом низу мобильного
   блока ниже) — на ПК сайдбар и так открыт целиком, возвращаться
   в список неоткуда и незачем. */
.settings-panel-back { display: none; }

/* Телефон. Сайдбар в 220px тут съедал больше половины ширины, и на
   содержимое оставалось около сотни пикселей — уезжали все панели
   без исключения. Раньше вместо колонки делали прокручиваемую пальцем
   строку сверху, как вкладки на главной — но 12+ разделов в одну
   строку то же самое узкое место просто сдвигали в другую сторону:
   часть подписей всё равно приходилось обрезать или листать вбок
   вслепую. Вместо этого — тот же приём, что у iOS/Telegram/большинства
   мобильных приложений: список разделов и открытая панель показываются
   по очереди, не одновременно. #app.mobile-panel-open — единственный
   переключатель между двумя состояниями (ставит/снимает его клик по
   .side-tab и «Все настройки», см. js/routes/settings-edit.js), а не
   отдельные видимость+ширина+padding, как было при горизонтальной
   строке. */
@media (max-width: 720px) {
  #app { flex-direction: column; padding-left: 0; }
  #app.mobile-panel-open #sidebar { display: none; }
  #app:not(.mobile-panel-open) #main { display: none; }

  #sidebar {
    width: auto; height: auto; position: static;
    border-right: none;
    padding: 4px 0 24px;
    display: block;
  }
  :where(.set-view) .sidebar-resize { display: none; }
  #sidebar a.back {
    margin: 0; position: static; background: none;
    padding: 16px; font-size: 1rem;
  }
  :where(.set-view) .side-tab {
    display: flex; align-items: center; gap: 12px;
    width: 100%; white-space: normal; text-align: left;
    padding: 13px 16px;
    border-left: none; border-bottom: 1px solid var(--border);
    font-size: .95rem;
  }
  :where(.set-view) .side-tab-icon {
    display: block; width: 20px; height: 20px; flex-shrink: 0;
    color: var(--text-dim);
  }
  :where(.set-view) .side-tab.active { border-left-color: transparent; background: var(--surface2); }
  :where(.set-view) .side-tab.active .side-tab-icon { color: var(--red); }
  /* Шеврон списка — тот же смысл, что «>» в iOS Settings: пункт
     открывает подэкран, а не просто выделяется как вкладка. */
  :where(.set-view) .side-tab::after {
    content: "›"; margin-left: auto; padding-left: 8px; flex-shrink: 0;
    font-size: 1.3rem; line-height: 1; color: var(--text-dim); opacity: .6;
  }

  #main { max-width: none; padding: 0 16px 64px; }
  .settings-panel-back {
    display: flex; align-items: center; gap: 8px;
    width: calc(100% + 32px); margin: 0 -16px 8px; padding: 16px;
    background: none; border: none; border-bottom: 1px solid var(--border);
    color: var(--text); font-size: .95rem; font-weight: 600;
    cursor: pointer;
  }
  .settings-panel-back svg { width: 18px; height: 18px; flex-shrink: 0; }
}
@media (min-width: 721px) {
  /* Иконки пунктов списка — только часть телефонной раскладки (см.
     выше): на ПК сайдбар открыт целиком, иконка рядом с текстом только
     сузила бы и без того тесную колонку. */
  :where(.set-view) .side-tab-icon { display: none; }
}

:where(.set-view) .panel { display: none; }
:where(.set-view) .panel.active { display: block; }
:where(.set-view) .panel-intro { color: var(--text-dim); font-size: .9rem; margin-bottom: 20px; }
:where(.set-view) .panel-intro a { color: var(--red-hi); text-decoration: none; }
:where(.set-view) .panel-intro a:hover { text-decoration: underline; }
/* --text-dim в классической, мягкой ботанической, неоморфизме и
   рисованной темах слишком близок к фону — рядом с обычным текстом
   (.sync-intro, тот же по сути пояснительный абзац, просто другого
   класса) читается заметно тусклее. В брутализме та же пара цветов
   на предельно чёрно-белом фоне ещё держит контраст, там не трогаем. */
[data-skin="classic"] :where(.set-view) .panel-intro,
[data-skin="soft"] :where(.set-view) .panel-intro,
[data-skin="soft-dark"] :where(.set-view) .panel-intro,
[data-skin="neomorphism"] :where(.set-view) .panel-intro,
[data-skin="neomorphism-dark"] :where(.set-view) .panel-intro,
[data-skin="doodle"] :where(.set-view) .panel-intro,
[data-skin="doodle-dark"] :where(.set-view) .panel-intro {
  color: var(--text);
}

:where(.set-view) .sync-intro { color: var(--text); font-size: .9rem; margin-bottom: 20px; }
:where(.set-view) .sync-intro a { color: var(--red-hi); text-decoration: none; }
:where(.set-view) .sync-intro a:hover { text-decoration: underline; }

:where(.set-view) .theme-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
:where(.set-view) .theme-option {
  border: 1px solid var(--border2); border-radius: 2px; padding: 10px 14px;
  cursor: pointer; font-size: .85rem; background: var(--surface); color: var(--text);
  font-family: 'DM Sans', sans-serif; transition: all .15s;
}
:where(.set-view) .theme-option:hover { border-color: var(--red-dim); color: var(--text-hi); }
:where(.set-view) .theme-option.selected { border-color: var(--red); color: var(--text-hi); background: var(--accent-wash); }

/* Попап выбора тёмная/светлая под пилюлей стиля. Позиционируется от
   .theme-group, а не от самой пилюли, — так рамка попапа не скачет,
   если пилюля меняет ширину (например, у неё появляется подпись
   "— тёмная" после выбора). */
:where(.set-view) .theme-group { position: relative; }
:where(.set-view) .theme-popover {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
  display: flex; flex-direction: column; gap: 2px; min-width: 150px;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 2px;
  padding: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
:where(.set-view) .theme-popover.hidden { display: none; }
:where(.set-view) .theme-popover button {
  background: none; border: none; text-align: left; padding: 8px 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .82rem; color: var(--text);
  border-radius: 1px; transition: background .12s, color .12s;
}
:where(.set-view) .theme-popover button:hover { background: var(--surface2); color: var(--text-hi); }
:where(.set-view) .theme-popover button.current { color: var(--red-hi); }

:where(.set-view) label { display: block; font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; margin: 16px 0 6px; }
/* Голый input, а не input[type="text"]: у [data-skin="…"] input в
   themes.css специфичность выше (добавлен атрибутный селектор), и
   он спокойно перебивает эту строку в темах, которые сами её не
   задают. Префикс :where(.set-view) поднимает специфичность на один класс —
   ровно столько же добавляет и .add-view выше, и там это уже
   проверено: тема по-прежнему побеждает (у неё атрибут + элемент). */
:where(.set-view) input, :where(.set-view) select {
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text-hi);
  border-radius: 2px; padding: 8px 10px; font-size: .9rem; font-family: 'Cormorant Garamond', serif;
  outline: none; transition: border-color .2s, background .2s;
}
:where(.set-view) input[type="text"]:focus, :where(.set-view) input[type="number"]:focus { border-color: var(--red); background: var(--bg2); }
:where(.set-view) input[type="color"] { width: 60px; height: 34px; padding: 2px; cursor: pointer; }
:where(.set-view) input[type="text"] { width: 100%; box-sizing: border-box; }

:where(.set-view) .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 4px; }
:where(.set-view) .row > div { flex: 1; min-width: 160px; }

/* Кнопки — .btn/.btn-primary/.btn-ghost/.btn-save/.icon-btn общие
   (style.css), уголки .btn-save::before/::after уже описаны выше в
   этом же файле (фаза #/add) — дублировать не нужно. */

/* Фон/рамка/радиус — уже в общем правиле input, select выше;
   здесь только то, что нужно именно select. */
:where(.set-view) select {
  width: 100%; box-sizing: border-box; font-size: .95rem;
}
:where(.set-view) select:focus { border-color: var(--red); }

:where(.set-view) .status-msg { margin-top: 12px; font-size: .83rem; }

:where(.set-view) h2.section-h { font-size: 1.05rem; color: var(--text-hi); }

/* ── Сворачиваемые разделы настроек ──────────────
   Тот же приём, что у .sec/.sec-toggle в редакторе отзыва: каждый
   h2.section-h в «Вкладках» и «Подписях» и всё, что следует за ним до
   следующего заголовка, оборачивается в .set-sec (см.
   collapsibleizeSettingsSections() в js/routes/settings-edit.js) и по
   умолчанию сворачивается — открывается кликом по заголовку. */
:where(.set-view) .set-sec { margin-bottom: 6px; }
:where(.set-view) .set-sec .set-sec-toggle {
  cursor: pointer;
  display: flex; align-items: center; gap: .55rem;
  user-select: none;
  padding: 6px 4px;
  margin: 22px -4px 0;
  border-radius: 6px;
}
:where(.set-view) .set-sec:first-child .set-sec-toggle { margin-top: 0; }
:where(.set-view) .set-sec .set-sec-toggle:hover { background: var(--tint-hi); }
:where(.set-view) .set-sec .set-sec-toggle::before {
  content: '';
  flex-shrink: 0;
  width: 0; height: 0;
  border-style: solid;
  border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent var(--text-dim);
  transition: transform .15s ease;
}
:where(.set-view) .set-sec:not(.collapsed) .set-sec-toggle::before { transform: rotate(90deg); }
:where(.set-view) .set-sec .set-sec-body { padding-top: 10px; }
:where(.set-view) .set-sec.collapsed .set-sec-body { display: none; }
:where(.set-view) .set-sec-toggle:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }

/* ── Модалка «добавить себе» из чужого паспорта ──
   Тот же приём, что у .review-modal-overlay выше: затемнение на весь
   экран плюс панель по центру. Внутри — iframe с обычным
   add.html?fromPassport=1..., просто в рамке, а не отдельной
   страницей — см. js/passports.js. Имя анимации своё (setFadeUp): в
   этом файле уже есть @keyframes fadeUp с другим сдвигом. */
:where(.set-view) .pp-add-modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  padding: 24px;
}
:where(.set-view) .pp-add-modal-overlay.hidden { display: none; }
@keyframes setFadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
:where(.set-view) .pp-add-modal-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 4px;
  width: 100%;
  max-width: 720px;
  height: 90vh;
  position: relative;
  animation: setFadeUp .25s ease both;
}
:where(.set-view) .pp-add-modal-close {
  position: absolute; top: 10px; right: 10px;
  z-index: 1;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%;
  background: var(--surface2); color: var(--text-dim);
  cursor: pointer;
}
:where(.set-view) .pp-add-modal-close:hover { color: var(--text); background: var(--tint-hi); }
:where(.set-view) .pp-add-modal-frame {
  width: 100%; height: 100%;
  border: none; border-radius: 4px;
}
@media (max-width: 720px) {
  :where(.set-view) .pp-add-modal-overlay { padding: 0; }
  /* height: 100vh — запасной вариант для браузеров без dvh (см. ниже);
     100dvh — «динамический» vh, который пересчитывается вместе с
     панелью адреса телефона. Обычный vh на телефоне считается по
     максимальной высоте экрана (когда панель адреса скрыта), а
     модалка на весь экран открывается ДО того, как она успевает
     спрятаться — нижний край панели в этот момент оказывается под
     ней, обрезанным. dvh пересчитывает высоту по актуальному
     состоянию панели адреса, а не по максимуму. */
  :where(.set-view) .pp-add-modal-panel { max-width: none; height: 100vh; height: 100dvh; border-radius: 0; }
  :where(.set-view) .pp-add-modal-frame { border-radius: 0; }
}

:where(.set-view) .list-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
:where(.set-view) .list-row .name { flex: 1; font-size: .88rem; }
:where(.set-view) .list-row .tag-note { color: var(--text-dim); font-size: .78rem; }
:where(.set-view) .vault-current { color: var(--text-dim); font-size: .78rem; white-space: nowrap; }

:where(.set-view) .app-path { font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text-dim);
  word-break: break-all; border: 1px dashed var(--border2); border-radius: 4px; padding: 9px 12px; }
:where(.set-view) .app-zoom { font-family: 'DM Sans', sans-serif; font-size: .85rem; color: var(--text-hi);
  min-width: 4rem; text-align: center; }

/* Ползунок масштаба — тот же минимализм, что у остальных полей:
   тонкий трек, квадратный бегунок без родных стрелок браузера. */
:where(.set-view) .app-zoom-slider {

}

}
:where(.set-view) .app-zoom-slider::-moz-range-thumb {

}

  margin-top: 10px; font-size: .78rem; color: var(--text-dim); }
:where(.set-view) .fav-restore-btn { background: none; border: 1px dashed var(--border2); color: var(--text-dim);
  border-radius: 4px; padding: 3px 9px; font-size: .78rem; cursor: pointer; font-family: inherit; }
:where(.set-view) .fav-restore-btn:hover { color: var(--text-hi); border-color: var(--text-dim); }

:where(.set-view) .tab-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  transition: opacity .15s, border-color .15s;
}
:where(.set-view) .tab-row input[type="checkbox"] { width: auto; margin: 0; }
:where(.set-view) .tab-row .tab-name { flex: 1; font-size: .9rem; }
:where(.set-view) .tab-row input[type="text"] { flex: 1; display: none; }
:where(.set-view) .tab-row.editing .tab-name { display: none; }
:where(.set-view) .tab-row.editing input[type="text"] { display: block; }
:where(.set-view) .tab-row .drag-handle {

/* Телефон. В строке вкладки шесть вещей подряд: ручка перетаскивания,
   глаз, имя, карандаш и подпись «Главная страница» с точкой. Глаз и
   карандаш под пальцем становятся по 44px (см. style.css), «Главная
   страница» не переносится (white-space: nowrap) и ужаться не может
   (flex: none) — в 390px это не влезало, строка вылезала за экран, и
   вместе с ней уезжала вбок вся страница настроек.
   Пускаем подпись на вторую строку: места по ширине она больше не
   просит, а сама радиокнопка (13px, растягивать её нельзя — станет
   не похожа на радиокнопку) получает нормальную цель для пальца за
   счёт отступов у своей подписи. */
@media (pointer: coarse) {

  :where(.set-view) .tab-row .main-radio-label {

}

:where(.set-view) .shelf-row {

}

:where(.set-view) .shelf-row .shelf-desc {

<div id="rail-edge-trigger" aria-hidden="true"></div>
<!-- Плавающая кнопка добавления — только телефон, только у владельца
     (см. её же CSS в мобильном медиа-запросе и JS-переключатель
     видимости рядом с #admin-settings-link ниже). На столе то же самое
     действие уже есть в .admin-add-btn на вкладке «Отзывы» и по
     горячей клавише — здесь дублировать незачем, там и без FAB
     дотянуться пальцем некуда не выходит. -->
<a href="#/add" id="mobile-fab-add" class="hidden" aria-label="Добавить">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<script>
  // .hidden у ссылки настроек — обычный CSS-класс, а не HTML-атрибут
  // hidden, и на этой странице ни разу не был описан отдельным
  // правилом (в отличие от удалённых теперь backup-history.html и
  // settings-edit.html, где .hidden{display:none} был свой на
  // страницу). Ссылка была видна всем, а не
  // только владельцу — простое дополнение, раз уж элемент и так
  // переносится в боковую панель.
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof isAdmin === "function" && isAdmin()) {
      document.getElementById("admin-settings-link").classList.remove("hidden");
      document.getElementById("mobile-fab-add").classList.remove("hidden");
    }
  });

  // ── Сворачивание рельсы + автопоявление по наведению ──
  // Кнопка сворачивает/разворачивает насовсем (запоминаем в
  // localStorage). Пока свёрнута, рельса лежит за левым краем окна
  // (transform в CSS) и выезжает как оверлей, стоит навести курсор на
  // полоску-ловушку или на саму рельсу; убираем курсор — прячется
  // обратно с небольшой задержкой, чтобы случайный перелёт мимо края
  // не дёргал её туда-сюда.
  (function initRailCollapse() {
    const STORAGE_KEY = "tasteid-rail-collapsed";
    const rail = document.getElementById("rail");
    const btn = document.getElementById("rail-collapse-btn");
    const edge = document.getElementById("rail-edge-trigger");
    if (!rail || !btn || !edge) return;

    let hideTimer = null;
    const peek = () => {
      clearTimeout(hideTimer);
      rail.classList.add("rail-peek");
    };
    const unpeek = () => {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => rail.classList.remove("rail-peek"), 250);
    };

    const setCollapsed = (collapsed) => {
      document.body.classList.toggle("rail-collapsed", collapsed);
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.title = collapsed ? "Развернуть панель" : "Свернуть панель";
      btn.setAttribute("aria-label", btn.title);
      if (!collapsed) rail.classList.remove("rail-peek");
      try { localStorage.setItem(STORAGE_KEY, collapsed ? "1" : "0"); } catch {}
    };

    btn.addEventListener("click", () => {
      setCollapsed(!document.body.classList.contains("rail-collapsed"));
    });

    edge.addEventListener("mouseenter", peek);
    edge.addEventListener("mouseleave", unpeek);
    rail.addEventListener("mouseenter", peek);
    rail.addEventListener("mouseleave", unpeek);

    let restored = false;
    try { restored = localStorage.getItem(STORAGE_KEY) === "1"; } catch {}
    if (restored) setCollapsed(true);
  })();
</script>

     маршрутов (см. #shell-root выше и js/router.js). Пусто и скрыто,

<div id="view-root" class="hidden"></div>

     extractIdsFromCover). Раньше подключался только на add.html;

     где отдельный документ ещё нужен, поэтому add.html и пережил

<!-- touch-drag.js — перетаскивание пальцем. Браузер рождает события
     drag только от мыши, и без этого моста порядок вкладок в
     #/settings-edit (как и списки в #/reviews-order, #/chars-edit,
     #/favorites-edit) на телефоне не двигался бы вовсе. Файл —
     самозапускающийся IIFE, который на устройстве с мышью сразу

<script>
let _navInit = true;

function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => {
    el.classList.remove("active");
    el.setAttribute("aria-selected", "false");
  });
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  btn.setAttribute("aria-selected", "true");
  // Иначе клавиатурный фокус остаётся на кнопке, кликнутой мышью раньше
  // (переключение по 1–5 её не трогает), и следующее нажатие клавиши
  // рисует рамку :focus-visible вокруг неё, а не вокруг активной вкладки.
  if (document.activeElement !== btn) btn.focus({ preventScroll: true });

  if (!_navInit) {
    btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }

  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
  if (tabId === "tab-stats")     loadStats();
  if (tabId === "tab-tierlist")  loadTierlist();
}

// ── Горячие клавиши ─────────────────────────────
// 1–5 переключают вкладки рельсы, / открывает поиск в «Отзывах», N —
// новый отзыв (только у админа), ? — эта же подсказка списком. Список
// показываемых сочетаний — общий с панелью в настройках, см.
// js/utils.js: keyboardShortcutsList/Html.
function openShortcutsModal() {
  document.getElementById("shortcuts-modal-list").innerHTML = keyboardShortcutsHtml();
  document.getElementById("shortcuts-modal-overlay").classList.remove("hidden");
}
function closeShortcutsModal() {
  document.getElementById("shortcuts-modal-overlay").classList.add("hidden");
}
function closeShortcutsModalOnOverlay(e) {
  if (e.target === document.getElementById("shortcuts-modal-overlay")) closeShortcutsModal();
}

document.addEventListener("keydown", (e) => {
  // Esc закрывает открытую модалку (в том числе эту) — общий
  // обработчик в js/utils.js, здесь только цифры/N//?, поэтому Escape
  // просто ничего из нижеперечисленного не находит и молча проходит.
  if (e.key === "Escape") return;

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (document.querySelector(".modal-overlay:not(.hidden), .review-modal-overlay:not(.hidden)")) return;

  // e.code — физическая клавиша, не символ: e.key на русской раскладке
  // для тех же клавиш отдаёт кириллицу («ф» вместо «/», «т» вместо «н» —
  // клавиша N — и вовсе не «н», а совсем другая), и сочетания молча не
  // срабатывали, пока не переключишься на английскую. code от раскладки
  // не зависит.
  // Позиция считается только по ВИДИМЫМ вкладкам — скрытые в настройках
  // (settings.hiddenTabs, см. theme.js) остаются в DOM с атрибутом
  // hidden, и без фильтра «1» продолжала бы указывать на позицию в
  // общем списке, а не на первую видимую. tabId берём из самой кнопки
  // (aria-controls), а не гадаем по номеру — settings.tabOrder может
  // переставить вкладки местами, и порядковый номер после этого уже
  // не совпадает с зашитым «tab-now, tab-favorites, …».
  const digitMatch = /^Digit([1-5])$/.exec(e.code);
  const visibleTabBtns = () => Array.from(document.querySelectorAll(".rail-tabs .tab-btn:not([hidden])"));
  if (digitMatch) {
    const btn = visibleTabBtns()[Number(digitMatch[1]) - 1];
    if (btn) { e.preventDefault(); switchTab(btn.getAttribute("aria-controls"), btn); }
    return;
  }

  // Своя клавиша на конкретную вкладку (Настройки → Горячие клавиши →
  // Переключение вкладок) — привязана к id, а не к позиции, поэтому
  // работает поверх цифр независимо от того, что скрыто или переставлено.
  for (const [tabId, b] of Object.entries(currentTabKeyBindings())) {
    if (tabBindingMatchesKey(e, b)) {
      const btn = document.querySelector(`.tab-btn[aria-controls="tab-${tabId}"]:not([hidden])`);
      if (btn) { e.preventDefault(); switchTab(`tab-${tabId}`, btn); }
      return;
    }
  }

  // Биндинги настраиваемые (см. js/utils.js: currentKeybindings) —
  // /, N и ? по умолчанию, но каждый можно перевесить на другую
  // клавишу в Настройки → Горячие клавиши.
  const kb = currentKeybindings();
  if (keyBindingMatches(e, kb.search)) {
    e.preventDefault();
    const btn = document.querySelector('.tab-btn[aria-controls="tab-reviews"]');
    switchTab("tab-reviews", btn);
    setTimeout(() => document.getElementById("rv-search")?.focus(), 50);
  } else if (keyBindingMatches(e, kb.newReview) && typeof isAdmin === "function" && isAdmin()) {
    e.preventDefault();
    location.hash = "#/add";
  } else if (keyBindingMatches(e, kb.shortcuts)) {
    e.preventDefault();
    openShortcutsModal();
  }
});

// Кнопки мыши (средняя, «назад»/«вперёд» на боковине) для переключения
// вкладок — та же привязка по id, что и у клавиш выше, просто другой
// источник события. Левая кнопка сюда не заходит (button === 0) — она
// нужна для обычных кликов по интерфейсу.
document.addEventListener("mousedown", (e) => {
  if (e.button === 0) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (document.querySelector(".modal-overlay:not(.hidden), .review-modal-overlay:not(.hidden)")) return;
  for (const [tabId, b] of Object.entries(currentTabKeyBindings())) {
    if (tabBindingMatchesMouse(e, b)) {
      const btn = document.querySelector(`.tab-btn[aria-controls="tab-${tabId}"]:not([hidden])`);
      if (btn) { e.preventDefault(); switchTab(`tab-${tabId}`, btn); }
      return;
    }
  }
});

// Первую вкладку открываем только после того, как применились настройки
// сайта: до этого неизвестны ни стартовая вкладка (mainTab), ни порядок,
// ни какие вкладки скрыты. Раньше клик стоял здесь же синхронно — вкладка
// успевала отрисоваться со встроенными настройками и через миг
// перерисовывалась поверх, а mainTab не работал вовсе.
// Обёртка Promise.resolve обязательна. window.themeReady приходит из
// theme.js, и если браузер по какой-то причине отдаст старую копию
// этого файла (кэш, сбой загрузки), themeReady окажется undefined —
// без обёртки здесь падал бы весь блок, и страница навсегда осталась
// бы на надписи «Загружаем…». Теперь в худшем случае просто откроется
// первая доступная вкладка.
// Если адрес открыт сразу на маршруте (#/reviews-order и т.п. —
// прямая ссылка/обновление страницы), рельса всё равно скрыта
// роутером (см. js/router.js), но кликать по вкладке под ней смысла
// нет — она всё равно не видна, а её loadNow()/loadFavorites()/…
// сходят в сеть впустую.
Promise.resolve(window.themeReady).then(() => {
  _navInit = false;
  if (location.hash) return;
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");

  if (btn) btn.click();
});

// Клик по логотипу на самой же главной — это переход "/" -> "/", то
// есть по сути просто "вернуться на стартовую вкладку и наверх". Без
// перехвата это была бы настоящая перезагрузка: страница поднимается
// заново с нуля, снова ждёт настройки сайта, снова открывает стартовую
// вкладку, а та заново запрашивает свои данные и на время запроса
// показывает спиннер вместо контента — резкая смена высоты между
// спиннером и заполненной вкладкой и читается как рывок интерфейса.
// Обычно перезагрузка укладывается в один кадр и не видна, но при
// быстрых повторных кликах эти циклы наслаиваются друг на друга.
// Тут же вкладка и так уже открыта и её данные уже загружены — так что
// вместо повторного похода на сервер просто возвращаемся к стартовой
// вкладке и скроллу локально, без единого лишнего запроса.
document.querySelector(".logo")?.addEventListener("click", (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  // Активен маршрут роутера (#/reviews-order и т.п.) — сначала просто
  // уходим с него (leaveRoute() из js/router.js), тем же приёмом, что
  // раньше был переходом на "/". Вкладку саму по себе трогать не надо:
  // она и так осталась открытой под скрытой рельсой (см. renderRoute()).
  if (location.hash) {
    leaveRoute();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
  const wanted = window.SITE_INITIAL_TAB;
  const btn =
    (wanted && document.querySelector(`[data-label="nav.${wanted}"]`)) ||
    document.querySelector(".tab-btn:not([hidden])");
  btn?.click();
});

makeResizablePanel(
  document.getElementById("rail"),
  document.getElementById("rail-resize"),
  "tasteid-rail-width", 200, 420
);

// Service worker и manifest.json — это PWA-механика для установки
// сайта из браузера («Добавить на экран»/офлайн-страница), а сайта в
// этом репозитории нет: тут только Electron- и мобильное приложение,
// у которых свои родные способы установки. sw.js был не просто
// бесполезен (сервер локальный, «плохой сети» не бывает), а вреден:
// порт при каждом запуске новый, значит и источник (origin) для
// service worker'а новый — и на диске копится Cache Storage от
// происхождений, куда приложение больше никогда не зайдёт и которые
// никому не почистить. Файлы sw.js и manifest.json удалены вместе с
// этой регистрацией.
</script>

</body>
</html>
