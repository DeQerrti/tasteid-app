<!DOCTYPE html>
<html lang="ru">
<head>
<script>
// Тема из кэша — синхронно, до первой отрисовки. theme.js ниже тоже её
// применяет, но только после fetch("/site-settings.json") — а это сеть,
// пусть и локальная. При быстрой повторной навигации (пара кликов по
// логотипу подряд) окно между первой отрисовкой и ответом сервера иногда
// растягивается настолько, что на долю секунды видна тема по умолчанию
// из :root, прежде чем встанет настоящая. localStorage читается без
// сети, поэтому успевает всегда. Ключ пишет и обновляет applyTheme() в
// theme.js.
(function () {
  try {
    var cached = JSON.parse(localStorage.getItem("tasteid-skin-cache"));
    if (!cached) return;
    if (cached.skin) document.documentElement.setAttribute("data-skin", cached.skin);
    if (cached.declarations) {
      var s = document.createElement("style");
      s.id = "theme-overrides";
      s.textContent = ":root { " + cached.declarations + " }";
      document.head.appendChild(s);
    }
  } catch {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Порядок любимого</title>
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts.css?v=1">
<link rel="stylesheet" href="/style.css?v=22">
<link rel="stylesheet" href="/admin.css?v=14">
<link rel="stylesheet" href="/themes.css?v=17">
<script src="/js/mobile.bundle.js?v=1"></script>
<script src="/js/i18n.js?v=1"></script>
<script src="/js/i18n-en.js?v=2"></script>
<script src="/js/sync.js?v=1"></script>
<script src="/js/utils.js?v=25"></script>
<script src="/js/theme.js?v=16"></script>
<script src="/js/touch-drag.js?v=1" defer></script>
<style>

main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

.section-title { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
  font-size: 1.2rem; color: var(--text-hi); margin-bottom: 1.25rem;
  display: flex; align-items: center; gap: .8rem; }
.section-title::before { content: ''; width: 16px; height: 1px; background: var(--red); flex-shrink: 0; }


/* ── Сетка drag-and-drop ── */
.dnd-grid {
  display: grid;
  gap: .75rem;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  margin-bottom: 2.5rem;
  min-height: 60px;
}

.dnd-item {
  position: relative;
  cursor: grab;
  border-radius: 2px;
  border: 1px solid var(--border);
  background: var(--surface);
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s, opacity .2s;
  user-select: none;
}
.dnd-item:active { cursor: grabbing; }
.dnd-item.dragging { opacity: .4; }
.dnd-item.drag-over { border-color: var(--red); box-shadow: 0 0 0 1px var(--red-dim); }

.dnd-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: brightness(.88);
  pointer-events: none;
}
.dnd-item-body { padding: .45rem .5rem .55rem; }
.dnd-item-title { font-family: 'Cormorant Garamond', serif; font-size: .85rem; font-weight: 600;
  color: var(--text-hi); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.dnd-item-type { font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim);
  margin-top: .2rem; text-transform: uppercase; letter-spacing: .08em; }

.dnd-item-num { position: absolute; top: 4px; left: 4px; background: var(--poster-scrim);
  color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: .6rem;
  padding: .15rem .4rem; border-radius: 1px; pointer-events: none; }

/* ── Кнопка сохранить ── */
.save-bar { gap: 1.5rem; margin-top: 1rem; }
.btn-save {
  font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; font-style: italic;
  padding: .7rem 2rem; background: var(--accent-fill); border: 1px solid var(--accent-line);
  border-radius: 2px; color: var(--text-hi); cursor: pointer; transition: background .2s, border-color .2s;
}

.save-status { font-family: 'DM Sans', sans-serif; font-size: .78rem; }
.save-status.ok  { color: var(--green-hi); }
.save-status.err { color: var(--err); }

.state-box { padding: 4rem 2rem; font-size: 1.05rem; }
.spinner { width: 24px; height: 24px; margin: 0 auto .75rem; }
</style>
</head>
<body>

<header class="app-topbar">
  <a href="/" class="logo topbar-back"><span class="arrow">&larr;</span>TasteID</a>
  <h1 class="topbar-title" data-i18n>Редактор порядка</h1>
</header>

<main>
  <div id="content">
    <div class="state-box"><div class="spinner"></div>Загружаем…</div>
  </div>
</main>

<script>
const TYPE_LABELS = {
  anime:i18n("Аниме"), manga:i18n("Манга"), manhwa:i18n("Манхва"), manhua:i18n("Маньхуа"),
  novel:i18n("Ранобэ"), movie:i18n("Фильм"), show:i18n("Сериал"), dorama:i18n("Дорама"),
  book:i18n("Книга"), game:i18n("Игра"), gacha:i18n("Гача"),
};

const PH = "https://placehold.co/120x180/111114/4a4540?text=?";

let titles = [];      // текущий порядок тайтлов
let dragSrc = null;   // элемент который тащим

// ── Загрузка ───────────────────────────────────
async function init() {
  try {
    const res  = await fetch("/reviews.json?_=" + Date.now());
    const data = await res.json();
    titles = data
      .filter(r => r.favorite === true)
      .sort((a, b) => (a.fav_order ?? 9999) - (b.fav_order ?? 9999));
    render();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="state-box">Ошибка загрузки: ${e.message}</div>`;
  }
}

// ── Рендер ─────────────────────────────────────
function render() {
  if (!titles.length) {
    document.getElementById("content").innerHTML =
      `<div class="state-box">${i18n("Нет тайтлов с флагом «Любимое».")}<br>
       <span style="font-size:.85rem">${i18n("Отметь тайтлы в редакторе отзыва.")}</span></div>`;
    return;
  }

  const items = titles.map((r, i) => {
    const cover = r.cover || PH;
    const label = TYPE_LABELS[r.type] || r.type || "—";
    return `<div class="dnd-item" draggable="true" data-id="${r.id}">
      <div class="dnd-item-num">${i + 1}</div>
      <img src="${esc(cover)}" alt="${esc(r.title)}"
        loading="lazy" ${imgFallbackAttrs(r.cover, r.cover_backup, PH)}>
      <div class="dnd-item-body">
        <div class="dnd-item-title">${esc(r.title)}</div>
        <div class="dnd-item-type">${esc(label)}</div>
      </div>
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <h2 class="section-title">${i18n("Тайтлы")}</h2>
    <p class="hint">${i18n("Перетащи карточки чтобы изменить порядок. Нажми «Сохранить» когда готово.")}</p>
    <div class="dnd-grid" id="dnd-grid">${items}</div>
    <div class="save-bar">
      <button class="btn-save" id="btn-save" onclick="saveOrder()">${i18n("Сохранить порядок")}</button>
      <span class="save-status" id="save-status"></span>
    </div>`;

  bindDnd();
}

// ── Drag-and-drop ──────────────────────────────
function bindDnd() {
  const grid = document.getElementById("dnd-grid");

  grid.addEventListener("dragstart", e => {
    dragSrc = e.target.closest(".dnd-item");
    if (!dragSrc) return;
    dragSrc.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });

  grid.addEventListener("dragend", e => {
    document.querySelectorAll(".dnd-item").forEach(el => {
      el.classList.remove("dragging", "drag-over");
    });
    dragSrc = null;
    updateNumbers();
  });

  grid.addEventListener("dragover", e => {
    e.preventDefault();
    const target = e.target.closest(".dnd-item");
    if (!target || target === dragSrc) return;
    document.querySelectorAll(".dnd-item").forEach(el => el.classList.remove("drag-over"));
    target.classList.add("drag-over");
  });

  grid.addEventListener("dragleave", e => {
    const target = e.target.closest(".dnd-item");
    if (target) target.classList.remove("drag-over");
  });

  grid.addEventListener("drop", e => {
    e.preventDefault();
    const target = e.target.closest(".dnd-item");
    if (!target || target === dragSrc || !dragSrc) return;
    target.classList.remove("drag-over");

    // Определяем позицию вставки
    const rect = target.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (e.clientX < midX) {
      grid.insertBefore(dragSrc, target);
    } else {
      grid.insertBefore(dragSrc, target.nextSibling);
    }

    updateNumbers();
  });
}

// Обновляем номера после перетаскивания
function updateNumbers() {
  document.querySelectorAll(".dnd-item").forEach((el, i) => {
    el.querySelector(".dnd-item-num").textContent = i + 1;
  });
}

// ── Сохранение ─────────────────────────────────
async function saveOrder() {
  const btn    = document.getElementById("btn-save");
  const status = document.getElementById("save-status");

  // Собираем новый порядок id из DOM
  const newOrder = [...document.querySelectorAll(".dnd-item")]
    .map(el => parseInt(el.dataset.id));

  btn.disabled = true;
  btn.textContent = i18n("Сохраняем…");
  status.className = "save-status";
  status.textContent = "";

  try {
    const res = await fetch("/api/save-review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ _reorder_favorites: newOrder }),
    });
    const data = await res.json();
    if (res.ok) {
      status.className = "save-status ok";
      status.textContent = i18n("Порядок сохранён.") + ((await isAppContext()) ? "" : i18n(" Сайт обновится через ~30 секунд."));
    } else {
      status.className = "save-status err";
      status.textContent = i18n("Ошибка: ") + (data.error || i18n("неизвестная"));
    }
  } catch (e) {
    status.className = "save-status err";
    status.textContent = i18n("Ошибка сети: ") + e.message;
  }

  btn.disabled = false;
  btn.textContent = i18n("Сохранить порядок");
}

init();
enableEscapeToLeave();
</script>
<script src="/js/backup.js?v=12"></script>
</body>
</html>
