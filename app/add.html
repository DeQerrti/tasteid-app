<!DOCTYPE html>
<html lang="ru">
<head>
<script>
// Тема из кэша – синхронно, до первой отрисовки. theme.js ниже тоже её
// применяет, но только после fetch("/site-settings.json") – а это сеть,
// пусть и локальная. При быстрой повторной навигации (пара кликов по
// логотипу подряд) окно между первой отрисовкой и ответом сервера иногда
// растягивается настолько, что на долю секунды видна тема по умолчанию
// из :root, прежде чем встанет настоящая. localStorage читается без
// сети, поэтому успевает всегда. Ключ пишет и обновляет applyTheme() в
// theme.js.
(function () {
  try {
    var cached = JSON.parse(localStorage.getItem("tasteid-skin-cache"));
    if (!cached) return;
    if (cached.skin) document.documentElement.setAttribute("data-skin", cached.skin);
    if (cached.declarations) {
      var s = document.createElement("style");
      s.id = "theme-overrides";
      s.textContent = ":root { " + cached.declarations + " }";
      document.head.appendChild(s);
    }
  } catch {}
})();
</script>

<style>
/* ══ NOIR PALETTE ════════════════════════════════ */

/* ══ HEADER ══════════════════════════════════════ */

/* ══ MAIN ════════════════════════════════════════ */

/* ══ EDIT BANNER ═════════════════════════════════ */

/* ══ SECTION TITLE ═══════════════════════════════ */

.section-title .sub {
  font-size: .8rem;
  font-weight: 400;
  font-style: italic;
  color: var(--text-dim);
}

/* ══ GRID / FIELDS ═══════════════════════════════ */

input, textarea, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .65rem .85rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--red);
  background: var(--bg2);
}
input::placeholder, textarea::placeholder { color: var(--text-dim); }

textarea { resize: vertical; min-height: 100px; line-height: 1.7; }

/* кастомная стрелка у select */

/* ══ ПЕРЕКЛЮЧАТЕЛЬ «Любимое» ═════════════════════
   Вместо системного чекбокса (белый квадрат, который на тёмном фоне
   выбивался) – кнопка со всей надписью. Выключена – приглушённая,
   включена – в акцентном цвете. Сам <input type="checkbox"> остался,
   но скрыт: на его .checked завязаны заполнение и сохранение формы. */
/* Переключатель «любимое» – обычная кнопка (.btn .btn-ghost) плюс
   сердце и включённое состояние. Раньше он описывал свой вид целиком и
   поэтому не участвовал в темах: на «мягкой» и «рисованной» вокруг были
   скруглённые кнопки, а он оставался прямоугольником. */
.btn.fav-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .7rem .85rem;
  text-transform: none;
  font-size: .75rem;
  letter-spacing: .05em;
  user-select: none;
}
/* Сердце – svg, а не символ '♡'/'♥' из шрифта: ни один из
   самохостящихся шрифтов их не содержит (проверено по cmap), и браузер
   тихо подставлял системный запасной – на разных платформах он выходит
   разного размера и формы при одном и том же коде (та же причина, что
   была у ромба над активной вкладкой на главной). svg с обводкой
   currentColor вместо этого – как у глаза в настройках статистики. */
.fav-toggle-icon { flex-shrink: 0; }
.fav-toggle.on .fav-toggle-icon { fill: currentColor; }

.btn.fav-toggle.on {
  border-color: var(--accent-line);
  background: var(--accent-fill);
  color: var(--red-hi);
}
.fav-toggle.on:hover { background: var(--accent-fill-hi); color: var(--red-hi); }

/* ══ СВОРАЧИВАЕМЫЕ РАЗДЕЛЫ ═══════════════════════
   Раньше каждый раздел (даты, превью, полный текст, оценка, теги)
   занимал место всегда, даже пустой, и форма растягивалась на
   несколько экранов – особенно заметно с телефона. Теперь свёрнутый
   раздел это одна строка-кнопка, ровно как уже было у обложки и
   источников. Разворачивается кликом, сворачивается крестиком.
   Состояние держится классом на обёртке – так открытая и закрытая
   части не могут разъехаться. */
.sec { margin-bottom: .75rem; }
.sec > .sec-toggle { display: none; }
.sec.collapsed > .sec-toggle { display: block; }
.sec.collapsed > .sec-body { display: none; }

.sec-body {
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: .9rem 1rem 1rem;
  background: var(--tint);
}

.sec-head {
  display: flex;
  align-items: center;
  gap: .8rem;
  margin-bottom: .9rem;
}
.sec-head .sec-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--text-hi);
}
.sec-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border2), transparent);
}
.sec-head .icon-btn { flex-shrink: 0; order: 3; }

/* Внутри раздела нижний отступ последнего поля лишний */
.sec-body > .field:last-child,
.sec-body > .grid:last-child { margin-bottom: 0; }

/* ══ HINT ════════════════════════════════════════ */
.hint {
  font-size: .68rem;
  padding: .55rem .85rem;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--tint-hi);
  margin-bottom: 1.25rem;
  margin-top: -.25rem;
}

.cover-preview {
  width: 64px; height: 96px;
  object-fit: cover;
  border: 1px solid var(--border2);
  border-radius: 2px;
  display: none;
  flex-shrink: 0;
}

.cover-block {
  display: flex;
  gap: 1.25rem;
  align-items: flex-start;
  background: var(--tint);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1.1rem;
  margin-top: .75rem;
}
.cover-block.hidden { display: none; }
.cover-controls { flex: 1; min-width: 0; }
.cover-controls-head { display: flex; align-items: flex-end; gap: .6rem; margin-bottom: .6rem; }
.cover-upload-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
}

/* ══ GRADES ══════════════════════════════════════ */
.grades-grid {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-bottom: 1.5rem;
}
.grade-btn {
  font-family: 'Playfair Display', serif;
  font-size: .82rem;
  font-weight: 700;
  padding: .35rem .85rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid;
  transition: all .15s;
  background: var(--tint-hi);
  position: relative;
}
.grade-btn::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 6px; height: 6px;
  border-top: 1px solid currentColor;
  border-left: 1px solid currentColor;
  opacity: 0;
  transition: opacity .15s;
}
.grade-btn.active::before { opacity: 1; }
.grade-btn.active { filter: brightness(1.4); }

/* ══ МОДАЛКА: новый тег / новая категория ════════ */

button.icon-btn { background: none; border: 1px solid var(--border2); color: var(--text-dim);
  width: 30px; height: 30px; padding: 0; margin: 0; border-radius: 4px; font-size: .8rem; cursor: pointer; flex-shrink: 0; }
button.icon-btn:hover { color: var(--text-hi); border-color: var(--red); background: none; }

/* .src-* и .file-btn/.btn/.icon-btn – общие компоненты выпадающих
   списков с инлайн-добавлением теперь в style.css (см. секцию
   "ВЫПАДАЮЩИЕ СПИСКИ С ИНЛАЙН-ДОБАВЛЕНИЕМ"), переиспользуются и в
   favorites-edit.html для Ролей. */

.tag-modal-tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
.tag-modal-tab { flex: 1; background: var(--surface2); border: 1px solid var(--border2); border-radius: 2px;
  color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-size: .72rem; letter-spacing: .05em;
  text-transform: uppercase; padding: .55rem; cursor: pointer; transition: all .15s; }
.tag-modal-tab:hover { color: var(--text); }
.tag-modal-tab.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--accent-wash); }
#tag-modal-status { margin-top: .75rem; }

/* Модалка одновременно и форма, и список существующих записей –
   в 420px это уже тесно. */
#tag-modal-overlay .modal { max-width: 520px; }

.tm-actions { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-top: .5rem; }
.tm-link { background: none; border: none; padding: 0; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim);
  text-decoration: underline; text-underline-offset: 3px; }
.tm-link:hover { color: var(--text-hi); }
.tm-danger { color: var(--err); }
.tm-danger:hover { color: #e8a4a4; }

.danger-zone { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .7rem; }
.danger-hint { font-family: 'DM Sans', sans-serif; font-size: .68rem;
  color: var(--text-dim); flex: 1; min-width: 12rem; }

.tm-color-row { display: flex; align-items: center; gap: .9rem; }
.tm-color-row input[type=color] { width: 64px; height: 42px; padding: .2rem; cursor: pointer; }
.tm-note { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim); }

.tm-list-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  margin: 1.5rem 0 .6rem; padding-top: 1.1rem; border-top: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim); }
.tm-list-head input { width: 140px; font-size: .7rem; padding: .25rem .5rem; }

.tm-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: .1rem; }
.tm-group { font-family: 'DM Sans', sans-serif; font-size: .58rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-dim); margin: .7rem 0 .2rem; }
.tm-group:first-child { margin-top: 0; }
.tm-row { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 3px; padding: .3rem .5rem;
  cursor: pointer; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .74rem; }
.tm-row:hover { border-color: var(--border2); color: var(--text-hi); }
.tm-row.active { border-color: var(--red-dim); background: var(--accent-wash); color: var(--text-hi); }
.tm-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-row-note { font-size: .64rem; color: var(--text-dim); flex-shrink: 0; }
.tm-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--border2); }
.tm-empty { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); padding: .4rem 0; }

/* ── Массовое удаление тегов ──
   Тот же список (#tm-tag-list), что и всегда, просто в другом режиме:
   форма добавления/правки и переключатель «Тег/Категория» прячутся –
   нечего редактировать, пока выбираешь, что удалить, – а у строк
   вместо ✎ появляется галочка выбора. */
.btn-new-danger { border-color: var(--err); color: var(--err); }
.btn-new-danger:hover { background: var(--err-wash, rgba(163,51,51,.12)); border-color: var(--err); }

#tag-modal-tag-panel.bulk-mode .field,
#tag-modal-tag-panel.bulk-mode .tm-actions,
#tag-modal-overlay.bulk-mode .tag-modal-tabs {
  display: none;
}
.tm-bulk-bar {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  margin-bottom: .8rem; padding: .55rem .8rem;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 3px;
  font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim);
}
.tm-bulk-bar.hidden { display: none; }
.tm-bulk-actions { display: flex; align-items: center; gap: .9rem; }
.tm-row-check {
  width: 14px; height: 14px; flex-shrink: 0; border-radius: 3px;
  border: 1px solid var(--border2); position: relative;
}
.tm-row.selected .tm-row-check { border-color: var(--red); background: var(--red-dim); }
.tm-row.selected .tm-row-check::after {
  content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
  border: solid var(--text-hi); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.tm-row.selected { border-color: var(--red-dim); background: var(--accent-wash); color: var(--text-hi); }

/* ── Какие теги показывать на карточке ── */
.card-tags-hint { font-family: 'DM Sans', sans-serif; font-size: .7rem; color: var(--text-dim); margin: .3rem 0 .7rem; }
.card-tags-count { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin: .5rem .1rem 0; }
.card-tag-row {
  display: flex; align-items: center; gap: .6rem; cursor: pointer;
  padding: .4rem .1rem; border-bottom: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--text);
}
.card-tag-row:last-child { border-bottom: none; }
.card-tag-row.selected { color: var(--text-hi); }
.card-tag-row.selected .tm-row-check { border-color: var(--red); background: var(--red-dim); }
.card-tag-row.selected .tm-row-check::after {
  content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
  border: solid var(--text-hi); border-width: 0 2px 2px 0; transform: rotate(45deg);
}
.card-tag-row.disabled { opacity: .4; cursor: not-allowed; }
.card-tag-row-name { flex: 1; }
.card-tags-none-row { border-bottom: 1px solid var(--border); margin-bottom: .2rem; }
#card-tags-list.disabled { opacity: .35; pointer-events: none; }

.tm-cat-delete-choice {
  margin: 1rem 0; padding: .9rem 1rem;
  background: var(--surface2); border: 1px solid var(--err); border-radius: 3px;
}
.tm-cat-delete-choice.hidden { display: none; }
.tm-cat-delete-choice .tm-note { color: var(--text); margin: 0 0 .7rem; }
.tm-cat-delete-choice .field { margin-bottom: .7rem; }

/* ══ TAGS ════════════════════════════════════════ */
.tags-grid {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.5rem;
}
.tag-toggle {
  font-family: 'DM Sans', sans-serif;
  font-size: .63rem;
  padding: .25rem .65rem;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--tint-line);
  background: var(--tint);
  color: var(--text-dim);
  transition: all .15s;
  user-select: none;
  letter-spacing: .03em;
}
.tag-toggle:hover { color: var(--text); border-color: var(--tint-line-hi); }
.tag-toggle.active {
  background: var(--accent-fill);
  border-color: rgba(192,57,43,.4);
  color: var(--err);
}

/* ══ DIVIDER ═════════════════════════════════════ */

/* ══ SAVE BUTTON ═════════════════════════════════ */

.btn-save::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 10px; height: 10px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  transition: border-color .2s;
}
.btn-save::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 10px; height: 10px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  transition: border-color .2s;
}

.btn-save:hover::before,
.btn-save:hover::after { border-color: var(--red-hi); }

/* ══ STATUS ══════════════════════════════════════ */
</style>
</head>

<div id="add-root"></div>

<script src="/js/routes/add.js?v=3"></script>
<script>
// В отличие от #/add внутри index.html, где точку входа зовёт router.js
// (renderRoute() на каждый hashchange), этот документ загружается один
// раз и монтирует редактор сам – тем же mount(container, params), что
// и роутер, с теми же параметрами, только из location.search, а не из
// хэша. params.get("fromPassport") в самом mount() уже отличает обычное
// открытие от iframe-модалки «Добавить себе» (см. js/routes/add.js).
mount(document.getElementById("add-root"), new URLSearchParams(location.search));
</script>
<script src="/js/backup.js?v=12"></script>
</body>
