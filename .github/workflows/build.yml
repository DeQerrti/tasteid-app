# Сборка приложения под три системы.
#
# Проверки гоняются на каждый push и каждый pull request — они быстрые.
# Сами установщики собираются только по тегу вида v1.2.3: собирать их на
# каждый коммит значит по полчаса машинного времени впустую, а результат
# нужен только когда действительно выпускаешь версию.
name: Проверки и сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Ручной запуск с вкладки Actions. Нужен не только для удобства:
  # выпускать по тегу можно не из любой среды, а собрать установщики
  # иногда надо здесь и сейчас.
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза (например 0.1.1)"
        required: true
        default: "0.1.1"

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: Проверки в браузере
    # Версия закреплена, а не ubuntu-latest: GitHub переводит latest на
    # Ubuntu 26, а Playwright 1.56.1 (package.json) Chromium на ней ещё не
    # ставит – шаг установки браузера падал, не дойдя до самих проверок.
    # Поднимать вместе с версией Playwright, когда та научится Ubuntu 26.
    runs-on: ubuntu-24.04
    # Не в общем check: это Playwright и настоящий Chromium, а не только
    # Node — отдельный джоб не тормозит остальные проверки на каждый push
    # и не блокирует сборку (build/android ниже не зависят от него).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  build:
    name: Установщики
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Без этого шаг с релизом падает на 403: по умолчанию токен рабочего
    # процесса умеет только читать, а ему нужно создать релиз и залить
    # в него установщики.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
        env:
          # Приложение не подписано, и это осознанно: подпись стоит денег
          # и всё равно не убирает предупреждение Windows целиком.
          # Без этой переменной electron-builder попробует подписать сам
          # и упадёт на отсутствующем сертификате.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # GH_TOKEN сюда больше не передаём. С ним electron-builder
          # считал, что публиковать релиз — его работа, и лез туда же,
          # куда шаг ниже: в релизе появлялось два одинаковых установщика,
          # а черновик успевал создаться дважды. Выкладывает только шаг
          # релиза, сборка — только собирает (--publish never).
      - uses: softprops/action-gh-release@v3
        with:
          # Черновик здесь, в закрытом tasteid-app — для собственной
          # проверки перед выпуском. В публичный DeQerrti/TasteID версия
          # переносится отдельно, только когда её уже проверили руками
          # (см. README) — не автоматически на каждый тег.
          # По тегу имя релиза берётся из него самого; при ручном запуске
          # тега нет, поэтому версию спрашиваем во входных данных.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          draft: true
          fail_on_unmatched_files: false

  android:
    name: Приложение для телефона
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Android собирается Gradle, а Gradle — это Java. На готовых
      # машинах GitHub сам Android SDK уже стоит, ставить нужно только её.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Мост телефона собирается в один файл и кладётся к страницам —
      # только после этого их есть смысл копировать в проект Android.
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      # Ключ подписи – из секретов репозитория, не из самого репозитория:
      # он открытый, и ключ в нём позволил бы кому угодно выпустить
      # «обновление» TasteID. Файл ключа хранится в секрете base64-строкой
      # и разворачивается во временную папку машины только на эту сборку.
      # Без секретов сборка падает сразу и понятно, а не выпускает APK,
      # который телефон не поставит.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 – см. раздел «Ключ подписи Android» в README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TASTEID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
        working-directory: android
        env:
          TASTEID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASTEID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASTEID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Назвать файл по-человечески
        run: |
          version=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TasteID-${version#v}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: dist/*.apk
          draft: true
          fail_on_unmatched_files: false
