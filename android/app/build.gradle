apply plugin: 'com.android.application'

// Версия у приложения одна на все платформы, и живёт она в package.json.
// Держать её здесь копией значило бы однажды выпустить телефонную сборку
// со старым номером и долго это искать.
def appVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace = "ru.tasteid.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.tasteid.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode должен только расти и быть целым — складываем его
        // из тех же трёх чисел: 0.2.0 -> 200, 1.4.12 -> 10412.
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Ключ подписи выпусков — НЕ в репозитории. Раньше здесь лежал
    // debug.keystore с общеизвестным паролем, а репозиторий открытый:
    // любой мог подписать им свой APK, и телефон принял бы его как
    // обновление TasteID — с доступом ко всем данным приложения.
    //
    // Теперь ключ приходит из переменных окружения: на GitHub Actions —
    // из секретов репозитория (см. джоб android в build.yml), локально —
    // если задать их вручную. Ключ один и тот же для всех выпусков, так
    // что новая версия ставится поверх старой, как и раньше. Без этих
    // переменных собирается только отладочная версия (assembleDebug) —
    // с личным отладочным ключом Gradle из ~/.android, которого нет больше
    // ни у кого.
    def releaseKeystore = System.getenv("TASTEID_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("TASTEID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TASTEID_KEY_ALIAS")
                keyPassword System.getenv("TASTEID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
